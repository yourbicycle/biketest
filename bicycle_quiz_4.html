は、車両であるから常に車両用の信号機に従わなければならない。", "answer": "×"}, {"set": "R7E", "num": 14, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で、片足で全体重をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "○"}, {"set": "R7E", "num": 15, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような自転車事故の場合は、相手の怪我が軽いので、自動車と違い警察官への報告義務はない｡", "answer": "×"}, {"set": "R7E", "num": 16, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね３等分する３カ所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "○"}, {"set": "R7E", "num": 17, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて、原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R7E", "num": 18, "question": "普通自転車の点検整備基準においては、前車輪と後車輪が、それぞれ別系統で確実に制動できること、ブレーキレバーを反復して作動した場合において、ブレーキ各部及び各取付部に異状が生じないことが必要である。", "answer": "○"}, {"set": "R7E", "num": 19, "question": "駆動補助機付自転車の点検整備基準においては、ペダルに踏力が加わっていないときでも、わずかであれば原動機による力が作動してもよいとされている。", "answer": "×"}, {"set": "R7E", "num": 20, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりする。また、反対にねじを締めすぎるとボールが壊れて、走れなくなることがある。", "answer": "○"}, {"set": "R7E", "num": 21, "question": "防犯登録は法律で登録することが義務付けられているが、ＴＳマークは防犯登録とは制度が異なることから、防犯登録がなされていない自転車でも、ＴＳマークを貼付することはできる。", "answer": "○"}, {"set": "R7E", "num": 22, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないため、道路のどこに駐車しても支障はないので、駐車禁止の対象となっていない。", "answer": "×"}, {"set": "R7E", "num": 23, "question": "自転車は、信号機などにより交通整理の行われていない交差点（環状交差点を除く）を右折するときは、後方の安全を確かめ、できる限り道路の左端に寄って、交差点の向こう側まで直進し、さらに安全確認を行い、十分速度を落として曲がらなければならない。", "answer": "○"}, {"set": "R7E", "num": 24, "question": "普通自転車の点検整備基準においては、制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R7E", "num": 25, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」などがあるが、「普通自転車の歩道通行時の通行方法違反」もその対象である。", "answer": "○"}, {"set": "R7E", "num": 26, "question": "普通自転車の車輪を点検する場合、著しいへこみや変形等のないこと、振れ及び前車輪の固定の３点を確認する。", "answer": "×"}, {"set": "R7E", "num": 27, "question": "自転車安全整備店の登録を受けた自転車店は、「自転車安全整備店章」を貸与されるが、掲出する必要はない。", "answer": "×"}, {"set": "R7E", "num": 28, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができ、修理ができる構造であることとされている。", "answer": "×"}, {"set": "R7E", "num": 29, "question": "ＴＳマーク付帯保険の支払対象となる事故には、自転車を押し歩いている場合の事故は含まれない。", "answer": "×"}, {"set": "R7E", "num": 30, "question": "酒気を帯びて自転車を運転した者に限らず、酒気を帯びている者に自転車を提供した者、酒気を帯びて自転車を運転するおそれがある者に酒を提供し、又はすすめた者も処罰の対象となる。", "answer": "○"}, {"set": "R7E", "num": 31, "question": "自転車に乗って道路を横断しようとするとき、近くに自転車横断帯も横断歩道もない場合には、右左の見通しのよいところを選んで、自動車が来ないことを確認し､直角にわたる。", "answer": "○"}, {"set": "R7E", "num": 32, "question": "普通自転車は、サドル、タイヤ等の車体・車輪部の部品、チェーン、ブレーキ等の駆動・制動部の部品、ハンドル等の操縦部の部品、尾灯、警音器等の安全付属部の部品又はこれらと同等の機能を有するものにより構成されている。", "answer": "○"}, {"set": "R7E", "num": 33, "question": "自転車の点検及び整備を行うための作業場が１０平方メートル以上確保されていること、当該作業場は、道路から容易に自転車を持ち込めるものであること、自転車の点検整備のため、規程に定められた工具を備え付けていれば、自転車安全整備店として登録するための適正な事業所の基準を満たしている。", "answer": "×"}, {"set": "R7E", "num": 34, "question": "幼児二人同乗用自転車にも、普通自転車に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"}, {"set": "R7E", "num": 35, "question": "自転車安全整備店の登録の有効期間は、登録を受けた日から３年を経過した日以降の１２月３１日又は６月３０日のいずれか早い日が経過するまでの期間である。", "answer": "×"}, {"set": "R7E", "num": 36, "question": "タイヤのバルブには、英式の「ウッズバルブ」、米式の「シュレーダーバルブ」及び仏式の「フレンチバルブ」の３種類があり、それぞれに使えるポンプの口金は異なる。", "answer": "○"}, {"set": "R7E", "num": 37, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車の小売りを業とする者は、自転車の販売にあたっては、当該自転車の取扱方法、定期的な点検の必要性等の自転車の安全利用のための十分な情報を提供するとともに、防犯登録の勧奨並びに自転車の点検及び修理業務の充実に努めなければならない。」と規定されている。", "answer": "○"}, {"set": "R7E", "num": 38, "question": "普通自転車は、普通自転車の運転者が１３歳未満の子供、７０歳以上のお年寄りの場合に限り、自転車歩道通行可の標識や標示のない歩道を通行することができる。", "answer": "×"}, {"set": "R7E", "num": 39, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポスト関係で固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "R7E", "num": 40, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人に自転車が走っていることを知らせるためのものでもあるので、原則として夜間にライトをつけずに走行してはならない。", "answer": "○"}, {"set": "R7E", "num": 41, "question": "自転車安全整備店としての登録を受けるには、自転車店の店主が自転車安全整備士の資格を有していなければならない。", "answer": "×"}, {"set": "R7E", "num": 42, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、相当な安全性を備えた安価な自転車の供給体制の整備が明記されている。", "answer": "×"}, {"set": "R7E", "num": 43, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "R7E", "num": 44, "question": "適正な事業所の基準で定める工具のうち、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "R7E", "num": 45, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行かつ水平に、幅はフレーム中心面に垂直かつ水平にそれぞれ最長部を測定するが、後写鏡については含めないで測定する。", "answer": "×"}, {"set": "R7E", "num": 46, "question": "自転車は気軽な乗り物なので、乗るときに明るい目立つ色の衣服を着用したり、反射器材を使用する必要はない。", "answer": "×"}, {"set": "R7E", "num": 47, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能については、自転車に備え付けられた場合において、定められた基準に適合する前照灯で照射したときに、夜間後方１００メートルの距離から、照射位置から反射光を容易に確認できること、反射光の色は、橙色又は赤色であることが必要である。", "answer": "○"}, {"set": "R7E", "num": 48, "question": "自動車の運転者は、危険を防止するためやむを得ない場合を除き、その自動車を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならないが、自転車についてはこの限りではない。", "answer": "×"}, {"set": "R7E", "num": 49, "question": "ナットドライバーは、適正な事業所の基準で定める工具に含まれない。", "answer": "○"}, {"set": "R7E", "num": 50, "question": "普通自転車の車輪数は、４輪以下とされている。", "answer": "×"}, {"set": "R7F", "num": 1, "question": "駆動補助機付自転車の点検整備基準においては、ペダルに踏力が加わっていないときは、原動機による補助力が作動しないこととされている。", "answer": "○"}, {"set": "R7F", "num": 2, "question": "適正な事業所の基準で定める工具のうち、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "R7F", "num": 3, "question": "自転車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて、原則として道路の左側に寄って一時停止しなければならない。", "answer": "○"}, {"set": "R7F", "num": 4, "question": "自転車に乗るときは運転中、停止中であっても、スマートフォンで通話をしたり、スマートフォンの画面を注視してはならない。", "answer": "×"}, {"set": "R7F", "num": 5, "question": "酒気を帯びて自転車を運転した者に限らず、酒気を帯びている者に自転車を提供した者、酒気を帯びて自転車を運転するおそれがある者に酒を提供し、又はすすめた者も処罰の対象となる。", "answer": "○"}, {"set": "R7F", "num": 6, "question": "防犯登録は法律で登録することが義務付けられているが、ＴＳマークは防犯登録とは制度が異なることから、防犯登録がなされていない自転車でも、ＴＳマークを貼付することはできる。", "answer": "○"}, {"set": "R7F", "num": 7, "question": "自転車に乗って道路を横断しようとするとき、近くに自転車横断帯も横断歩道もない場合には、右左の見通しのよいところを選んで、自動車が来ないことを確認し､直角にわたる。", "answer": "○"}, {"set": "R7F", "num": 8, "question": "普通自転車は、自転車歩道通行可の標識がある歩道を通行することができる。この場合、歩行者の通行を妨げることとなるときは、ベルを鳴らして歩行者に注意を喚起しなければならない。", "answer": "×"}, {"set": "R7F", "num": 9, "question": "普通自転車は、普通自転車の運転者が１３歳未満の子供、７０歳以上のお年寄りの場合に限り、自転車歩道通行可の標識や標示のない歩道を通行することができる。", "answer": "×"}, {"set": "R7F", "num": 10, "question": "自転車安全整備店の登録の有効期間は、登録を受けた日から３年を経過した日以降の１２月３１日又は６月３０日のいずれか早い日が経過するまでの期間である。", "answer": "×"}, {"set": "R7F", "num": 11, "question": "自転車安全利用５則は、①車道が原則・左側を通行、②歩道は例外・歩行者を優先、③交差点では信号と一時停止を守って・安全確認、④夜間はライトを点灯、⑤ヘルメットを着用の５つである。", "answer": "×"}, {"set": "R7F", "num": 12, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、緩まないようにねじは強く締めるほうがよい。", "answer": "×"}, {"set": "R7F", "num": 13, "question": "自転車は、車両であるから常に車両用の信号機に従わなければならない。", "answer": "×"}, {"set": "R7F", "num": 14, "question": "自転車安全整備店が次のいずれかに該当することとなったときは、登録を取り消すことができる。（１）適正な事業所の基準に適合しなくなったとき。（２）正当な理由がないのに１年以上点検整備済ＴＳマークの取扱いをしなかったとき。（３）点検整備済ＴＳマークを不適正に貼付したとき。（４）登録者としての信用を失墜させる行為をしたとき。", "answer": "○"}, {"set": "R7F", "num": 15, "question": "自転車タイヤのサイドウオールの数字が〔２６×１．９５〕である場合、そのタイヤはＨＥタイヤである。", "answer": "○"}, {"set": "R7F", "num": 16, "question": "自転車活用推進法では、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を１０月の体育の日、自転車月間を１０月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "R7F", "num": 17, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で片足の踏力をペダルにかけたとき、後車輪が回らないことを確認する。", "answer": "×"}, {"set": "R7F", "num": 18, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような自転車事故の場合は、相手の怪我が軽いので、自動車と違い警察官への報告義務はない｡", "answer": "×"}, {"set": "R7F", "num": 19, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車の小売りを業とする者は、自転車の販売にあたっては、当該自転車の取扱方法、定期的な点検の必要性等の自転車の安全利用のための十分な情報を提供するとともに、防犯登録の勧奨並びに自転車の点検及び修理業務の充実に努めなければならない。」と規定されている。", "answer": "○"}, {"set": "R7F", "num": 20, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人に自転車が走っていることを知らせるためのものでもあるので、原則として夜間にライトをつけずに走行してはならない。", "answer": "○"}, {"set": "R7F", "num": 21, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができ、修理ができる構造であることとされている。", "answer": "×"}, {"set": "R7F", "num": 22, "question": "ＴＳマーク付帯保険の支払対象となる事故には、自転車を押し歩いている場合の事故は含まれない。", "answer": "×"}, {"set": "R7F", "num": 23, "question": "自転車安全整備店として登録を受けた自転車店は、貸与された「自転車安全整備店章」を事業所の見やすい場所に掲出しなければならない。", "answer": "○"}, {"set": "R7F", "num": 24, "question": "普通自転車の車輪数は、４輪以下とされている。", "answer": "×"}, {"set": "R7F", "num": 25, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポスト関係で固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "R7F", "num": 26, "question": "普通自転車の点検整備基準においては、制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R7F", "num": 27, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行かつ水平に、幅はフレーム中心面に垂直かつ水平にそれぞれ最長部を測定するが、後写鏡については含めないで測定する。", "answer": "×"}, {"set": "R7F", "num": 28, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "R7F", "num": 29, "question": "普通自転車は、サドル、タイヤ等の車体・車輪部の部品、チェーン、ブレーキ等の駆動・制動部の部品、ハンドル等の操縦部の部品、尾灯、警音器等の安全付属部の部品又はこれらと同等の機能を有するものにより構成されている。", "answer": "○"}, {"set": "R7F", "num": 30, "question": "自転車安全整備店としての登録を受けるには、自転車店の店主が自転車安全整備士の資格を有していなければならない。", "answer": "×"}, {"set": "R7F", "num": 31, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね３等分する３カ所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "○"}, {"set": "R7F", "num": 32, "question": "タイヤのバルブには、英式の「ウッズバルブ」、米式の「シュレーダーバルブ」及び仏式の「フレンチバルブ」の３種類があるが、「シュレーダーバルブ」と「フレンチバルブ」は同一のポンプの口金が使える。", "answer": "×"}, {"set": "R7F", "num": 33, "question": "自転車は、信号機などにより交通整理の行われていない交差点（環状交差点を除く）を右折するとき、後方の安全を確かめ、交差点の中心を通るなど最短距離で曲がらなければならない。", "answer": "×"}, {"set": "R7F", "num": 34, "question": "自転車の点検及び整備を行うための作業場が５平方メートル以上確保されていること、自転車の点検整備のために規程に定められた工具を備え付けていれば自転車安全整備店として登録するための適正な事業所の基準を満たしている。", "answer": "×"}, {"set": "R7F", "num": 35, "question": "ナットドライバーは、適正な事業所の基準で定める工具に含まれない。", "answer": "○"}, {"set": "R7F", "num": 36, "question": "普通自転車の点検整備基準においては、前車輪と後車輪が、それぞれ別系統で確実に制動できること、ブレーキレバーを１回作動させた場合において、ブレーキ各部及び各取付部に異状が生じないことが必要である。", "answer": "×"}, {"set": "R7F", "num": 37, "question": "自転車は気軽な乗り物なので、乗るときに明るい目立つ色の衣服を着用したり、反射器材を使用する必要はない。", "answer": "×"}, {"set": "R7F", "num": 38, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に備え付けられた場合において、定められた基準に適合する前照灯で照射したときに、夜間後方５０メートルの距離から、反射光を照射位置から容易に確認できること、反射光の色は、橙色又は赤色であることが必要である。", "answer": "×"}, {"set": "R7F", "num": 39, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から１年間保管しなければならない。", "answer": "×"}, {"set": "R7F", "num": 40, "question": "緑色ＴＳマーク付帯保険の賠償責任保障の支払いの対象は、死亡又は重度後遺障害（１～７級）である。", "answer": "×"}, {"set": "R7F", "num": 41, "question": "普通自転車のブレーキレバーの点検整備では、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。また、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを最低位置まで下げたとき、グリップ最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、５０㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでない。", "answer": "×"}, {"set": "R7F", "num": 42, "question": "普通自転車の車輪を点検する場合、著しいへこみや変形等のないこと、振れ及び前車輪の固定の３点を確認する。", "answer": "×"}, {"set": "R7F", "num": 43, "question": "自動車の運転者は、危険を防止するためやむを得ない場合を除き、その自動車を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならないが、自転車についても同様である。", "answer": "○"}, {"set": "R7F", "num": 44, "question": "自転車の部品は、正しく取り付けられ、かつ、確実に固定され、各部が正常に作動することが必要である。普通自転車の点検整備マニュアルにおいては、やぐらを使っているシートポストとサドルの固定については、サドルの前と後に両手をかけ、サドルに両手で上下の力を加えたときに、動かなければよい。", "answer": "○"}, {"set": "R7F", "num": 45, "question": "車道の左側を普通自転車に乗って運転中、前方の道路で工事をしているときは、車道の左側を安全に通行することができる場合であっても、歩道を通行してよい。", "answer": "×"}, {"set": "R7F", "num": 46, "question": "幼児二人同乗用自転車にも、普通自転車に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"},  "×"}, {"set": "R7G", "num": 10, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で、片足で全体重をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "○"}, {"set": "R7G", "num": 11, "question": "ナットドライバーは、適正な事業所の基準で定める工具のひとつである。", "answer": "×"}, {"set": "R7G", "num": 12, "question": "自転車に乗って道路を横断しようとするとき、近くに自転車横断帯も横断歩道もない場合には、右左の見通しのよいところを選んで、自動車が来ないことを確認し､直角にわたる。", "answer": "○"}, {"set": "R7G", "num": 13, "question": "自転車活用推進法では、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を５月５日、自転車月間を５月１日から同月３１日までと定めている。", "answer": "○"}, {"set": "R7G", "num": 14, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、高い安全性を備えた良質な自転車の供給体制の整備が明記されている。", "answer": "○"}, {"set": "R7G", "num": 15, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないため、道路のどこに駐車しても支障はないので、駐車禁止の対象となっていない。", "answer": "×"}, {"set": "R7G", "num": 16, "question": "自動車の運転者は、危険を防止するためやむを得ない場合を除き、その自動車を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならないが、自転車についてはこの限りではない。", "answer": "×"}, {"set": "R7G", "num": 17, "question": "自転車安全整備店の登録の有効期間は、登録を受けた日から３年を経過した日以降の１２月３１日又は６月３０日のいずれか早い日が経過するまでの期間である。", "answer": "×"}, {"set": "R7G", "num": 18, "question": "自転車の点検及び整備を行うための作業場が５平方メートル以上確保されていること、当該作業場は、道路から容易に自転車を持ち込めるものであること、自転車の点検整備のため、規程に定められた工具を備え付けていれば自転車安全整備店として登録するための適正な事業所の基準を満たしている。", "answer": "○"}, {"set": "R7G", "num": 19, "question": "自転車の運転者は、他人を当該自転車に乗車させるときは、当該他人に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "R7G", "num": 20, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりする。また、反対にねじを締めすぎるとボールが壊れて、走れなくなることがある。", "answer": "○"}, {"set": "R7G", "num": 21, "question": "自転車は、夜間であっても、街灯がある場合は、ライトを点灯して走行しなくてもよい。", "answer": "×"}, {"set": "R7G", "num": 22, "question": "自転車安全整備店として登録を受けた自転車店は、貸与された「自転車安全整備店章」を事業所の見やすい場所に掲出しなければならない。", "answer": "○"}, {"set": "R7G", "num": 23, "question": "普通自転車のブレーキレバーの点検整備では、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。また、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを最低位置まで下げたとき、グリップ最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、４０㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでない。", "answer": "○"}, {"set": "R7G", "num": 24, "question": "自転車に乗るときは、自動車の運転者や歩行者などから見やすいように、できるだけ明るい目立つ色の衣服を着用したり、反射器材を使用する。", "answer": "○"}, {"set": "R7G", "num": 25, "question": "自転車は、信号機などにより交通整理の行われていない交差点（環状交差点を除く）を右折するときは、後方の安全を確かめ、できる限り道路の左端に寄って、交差点の向こう側まで直進し、さらに安全確認を行い、十分速度を落として曲がらなければならない。", "answer": "○"}, {"set": "R7G", "num": 26, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて、原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R7G", "num": 27, "question": "自転車に乗るときは運転中、停止中であっても、スマートフォンで通話をしたり、スマートフォンの画面を注視してはならない。", "answer": "×"}, {"set": "R7G", "num": 28, "question": "駆動補助機付自転車の点検整備基準においては、ペダルに踏力が加わっていないときでも、わずかであれば原動機による力が作動してもよいとされている。", "answer": "×"}, {"set": "R7G", "num": 29, "question": "普通自転車の車輪を点検する場合、著しいへこみや変形等のないこと、スポークの張力及び前車輪の固定の３点を確認する。", "answer": "×"}, {"set": "R7G", "num": 30, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "R7G", "num": 31, "question": "自転車は、車両であるから常に車両用の信号機に従わなければならない。", "answer": "×"}, {"set": "R7G", "num": 32, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行かつ水平に、幅はフレーム中心面に垂直かつ水平にそれぞれ最長部を測定するが、どろよけ、スタンド、キャリヤ、後写鏡などの部品を含めて測定する。", "answer": "○"}, {"set": "R7G", "num": 33, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような相手の怪我が軽い自転車事故の場合でも、自動車と同様に警察官への報告義務がある｡", "answer": "○"}, {"set": "R7G", "num": 34, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポスト関係で固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "R7G", "num": 35, "question": "普通自転車の車輪数は、４輪以下とされている。", "answer": "×"}, {"set": "R7G", "num": 36, "question": "自転車安全利用５則は、①車道が原則・左側を通行、②歩道は例外・歩行者を優先、③交差点では信号と一時停止を守って・安全確認、④夜間はライトを点灯、⑤ヘルメットを着用の５つである。", "answer": "×"}, {"set": "R7G", "num": 37, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね２等分する２カ所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "×"}, {"set": "R7G", "num": 38, "question": "車道の左側を普通自転車に乗って運転中、前方の道路で工事をしているときは、車道の左側を安全に通行することができる場合であっても、歩道を通行してよい。", "answer": "×"}, {"set": "R7G", "num": 39, "question": "自転車タイヤのサイドウオールの数字が〔２６×１．９５〕である場合、そのタイヤはＨＥタイヤである。", "answer": "○"}, {"set": "R7G", "num": 40, "question": "酒気を帯びて自転車を運転した者に限らず、酒気を帯びている者に自転車を提供した者、酒気を帯びて自転車を運転するおそれがある者に酒を提供し、又はすすめた者も処罰の対象となる。", "answer": "○"}, {"set": "R7G", "num": 41, "question": "普通自転車は、サドル、タイヤ等の車体・車輪部の部品、チェーン、ブレーキ等の駆動・制動部の部品、ハンドル等の操縦部の部品、尾灯、警音器等の安全付属部の部品又はこれらと同等の機能を有するものにより構成されている。", "answer": "○"}, {"set": "R7G", "num": 42, "question": "適正な事業所の基準で定める工具のうち、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "R7G", "num": 43, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」などがあるが、「普通自転車の歩道通行時の通行方法違反」もその対象である。", "answer": "○"}, {"set": "R7G", "num": 44, "question": "幼児二人同乗用自転車にも、普通自転車に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"}, {"set": "R7G", "num": 45, "question": "防犯登録は法律で登録することが義務付けられており、防犯登録がなされていない自転車には、ＴＳマークを貼付することはできない。", "answer": "×"}, {"set": "R7G", "num": 46, "question": "ＴＳマーク付帯保険の支払対象となる事故には、自転車を押し歩いている場合の事故は含まれない。", "answer": "×"}, {"set": "R7G", "num": 47, "question": "普通自転車は、普通自転車の運転者が１３歳未満の子供、７０歳以上のお年寄りの場合に限り、自転車歩道通行可の標識や標示のない歩道を通行することができる。", "answer": "×"}, {"set": "R7G", "num": 48, "question": "緑色ＴＳマーク付帯保険の賠償責任保障の支払いの対象は、死亡又は重度後遺障害（１～４級）である。", "answer": "×"}, {"set": "R7G", "num": 49, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができ、修理ができる構造であることとされている。", "answer": "×"}, {"set": "R7G", "num": 50, "question": "普通自転車の点検整備基準においては、前車輪と後車輪が、それぞれ別系統で確実に制動できること、ブレーキレバーを反復して作動した場合において、ブレーキ各部及び各取付部に異状が生じないことが必要である。", "answer": "○"}];

  document.getElementById('acorrect').textContent=q.answer;
  document.getElementById('nbtn').textContent=cur+1>=quiz.length?'結果を見る':'次の問題 →';
  document.getElementById('apanel').style.display='block';
}
function next(){cur++;if(cur>=quiz.length)showResult();else renderQ();}
function resetQuiz(){if(confirm('クイズをリセットして設定に戻りますか？'))showQ('su');}
function showReview(){
  const wrong = history.filter(h=>!h.ok);
  const ok    = history.filter(h=>h.ok);

  const makeItem = h => `
    <div class="rev-item">
      <div class="rev-head">
        <div class="rev-num">${SET_LABELS[h.q.set]||h.q.set} – 問${h.q.num}</div>
        <div class="rev-tag ${h.ok?'ok':'ng'}">${h.ok?'正解':'不正解'}</div>
      </div>
      <div class="rev-q">${h.q.question}</div>
      <div class="rev-ans-row">
        <div class="rev-ans-box correct">正解 ${h.q.answer}</div>
        <div class="rev-ans-box ${h.ok?'same':'wrong'}">あなた ${h.userAns}</div>
      </div>
    </div>`;

  let html='';
  if(wrong.length){
    html+=`<div class="rev-section-title">間違えた問題（${wrong.length}問）</div>`;
    html+=wrong.map(makeItem).join('');
  }
  html+=`<div class="rev-section-title">正解した問題（${ok.length}問）</div>`;
  html+=ok.map(makeItem).join('');
  document.getElementById('rev-body').innerHTML=html;
}
function showResult(){
  showQ('sr');
  const pct=Math.round(score/quiz.length*100);
  document.getElementById('rbig').textContent=score+' / '+quiz.length;
  document.getElementById('rpct').textContent=pct+'%';
  setTimeout(()=>{document.getElementById('rbar').style.width=pct+'%';},100);
  document.getElementById('rmsg').textContent=pct>=80?'合格ライン突破！すばらしい':pct>=60?'あと少し。苦手問題を復習しましょう':'要復習。もう一度挑戦してみましょう';
  showReview();
}

// --- 一覧側 ---
function selYear(y, el) {
  listYear=y;
  document.querySelectorAll('.ybtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  const sets = YEAR_SETS[y];
  listSet = sets[0];
  renderSetBtns();
  renderList();
}
function renderSetBtns(){
  const sets = YEAR_SETS[listYear];
  const container = document.getElementById('list-set-sel');
  container.innerHTML='';
  sets.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='ssbtn'+(s===listSet?' active':'');
    btn.textContent=s.replace(/^R\d/,'')+'問題';
    btn.onclick=()=>{listSet=s;document.querySelectorAll('.ssbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderList();};
    container.appendChild(btn);
  });
}
function renderList(){
  const qs = ALL_QS.filter(q=>q.set===listSet);
  const body = document.getElementById('list-body');
  if(!qs.length){body.innerHTML='<div class="list-empty">問題が見つかりません</div>';return;}
  body.innerHTML = qs.map(q=>`
    <div class="list-item">
      <div class="li-head">
        <div class="li-num">問${q.num}</div>
        <div class="li-ans ${q.answer==='○'?'maru':'batu'}">${q.answer}</div>
      </div>
      <div class="li-q">${q.question}</div>
    </div>
  `).join('');
}
function renderListTab(){
  renderSetBtns();
  renderList();
}
</script>
</body>
