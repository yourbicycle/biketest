<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自転車安全整備士 過去問クイズ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem}
.app{width:100%;max-width:680px}
.header{margin-bottom:1.25rem}
.header h1{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:2px}
.header p{font-size:12px;color:#888}
.screen{display:none}.screen.active{display:block}

/* タブ */
.tabs{display:flex;gap:0;margin-bottom:1.25rem;background:#e8e6de;border-radius:10px;padding:3px}
.tab{flex:1;padding:.55rem;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;color:#777;transition:all .15s}
.tab.active{background:#fff;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 共通 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.25rem}
.stat{background:#fff;border:0.5px solid #e0ded6;border-radius:10px;padding:1rem;text-align:center}
.stat-n{font-size:26px;font-weight:600;color:#1a1a1a;line-height:1}
.stat-l{font-size:11px;color:#888;margin-top:4px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.mode-btn{background:#fff;border:1.5px solid #e0ded6;border-radius:10px;padding:1rem;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.mode-btn:hover{border-color:#aaa;background:#fafaf7}
.mode-btn.selected{border-color:#1a1a1a;background:#f0efe8}
.mode-btn .mb-title{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.mode-btn .mb-sub{font-size:11px;color:#888}
.n-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem;background:#fff;border:0.5px solid #e0ded6;border-radius:10px;padding:.75rem 1rem}
.n-row label{font-size:13px;color:#555;white-space:nowrap}
.n-row input[type=range]{flex:1;accent-color:#1a1a1a}
.n-row .n-val{font-size:14px;font-weight:600;color:#1a1a1a;min-width:36px;text-align:right}
.pbtn{width:100%;padding:.85rem;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.pbtn:hover{opacity:.85}
.sbtn{background:transparent;color:#555;border:0.5px solid #e0ded6;border-radius:10px;padding:.7rem 1.25rem;font-size:14px;cursor:pointer;font-family:inherit;margin-top:.5rem;width:100%}
.sbtn:hover{background:#f5f4f0}

/* クイズ */
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.prog-track{height:3px;flex:1;background:#e0ded6;border-radius:2px}
.prog-fill{height:100%;background:#1a1a1a;border-radius:2px;transition:width .3s}
.prog-lbl{font-size:12px;color:#888;white-space:nowrap}
.set-badge{display:inline-block;font-size:11px;background:#e8e6de;color:#555;padding:2px 8px;border-radius:20px;margin-bottom:.5rem}
.q-card{background:#fff;border:0.5px solid #e0ded6;border-radius:12px;padding:1.25rem 1.25rem 1rem;margin-bottom:.875rem}
.q-text{font-size:15px;line-height:1.75;color:#1a1a1a}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.5rem}
.tf-btn{background:#fff;border:1.5px solid #e0ded6;border-radius:10px;padding:1.25rem .5rem;font-size:32px;cursor:pointer;transition:background .1s,border-color .1s;font-family:inherit;line-height:1}
.tf-btn:hover:not(:disabled){background:#f5f4f0;border-color:#aaa}
.tf-btn:disabled{cursor:default}
.tf-btn.ok{background:#edfaf3;border-color:#5ab87a;color:#2e7d50}
.tf-btn.ng{background:#fef0f0;border-color:#e07070;color:#b03030}
.tf-btn.missed{background:#fffbe6;border-color:#d4b84a}
.ans-panel{background:#fff;border:0.5px solid #e0ded6;border-radius:12px;padding:1rem 1.25rem;margin-bottom:.875rem}
.ans-row{display:flex;align-items:center;gap:8px;margin-bottom:.5rem}
.badge{display:inline-flex;align-items:center;justify-content:center;width:56px;height:26px;border-radius:6px;font-size:13px;font-weight:600}
.badge.ok{background:#edfaf3;color:#2e7d50}
.badge.ng{background:#fef0f0;color:#b03030}
.correct-lbl{font-size:13px;color:#555}
.correct-lbl span{font-weight:600;color:#1a1a1a}
.next-btn{width:100%;padding:.8rem;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.next-btn:hover{opacity:.85}
.result-card{background:#fff;border:0.5px solid #e0ded6;border-radius:14px;padding:2rem;margin-bottom:1rem;text-align:center}
.score-big{font-size:56px;font-weight:700;color:#1a1a1a;line-height:1;margin-bottom:.25rem}
.score-pct{font-size:18px;color:#555;margin-bottom:.5rem}
.r-bar-wrap{margin:1.25rem 0 .5rem}
.r-bar-track{height:8px;background:#e0ded6;border-radius:4px;overflow:hidden}
.r-bar-fill{height:100%;background:#1a1a1a;border-radius:4px;transition:width 1s ease}
.score-msg{font-size:14px;color:#777}
.r-actions{display:flex;flex-direction:column;gap:8px}
.r-btn{padding:.8rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.r-btn.primary{background:#1a1a1a;color:#fff;border:none}
.r-btn.primary:hover{opacity:.85}
.r-btn.secondary{background:#fff;color:#555;border:1.5px solid #e0ded6}
.r-btn.secondary:hover{background:#f5f4f0}

/* 復習画面 */
.rev-item{background:#fff;border:0.5px solid #e0ded6;border-radius:10px;padding:.875rem 1rem;margin-bottom:.625rem}
.rev-head{display:flex;align-items:center;gap:8px;margin-bottom:.5rem}
.rev-num{font-size:11px;color:#888;white-space:nowrap}
.rev-tag{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;flex-shrink:0}
.rev-tag.ok{background:#edfaf3;color:#2e7d50}
.rev-tag.ng{background:#fef0f0;color:#b03030}
.rev-q{font-size:13px;line-height:1.7;color:#1a1a1a;margin-bottom:.5rem}
.rev-ans-row{display:flex;gap:8px;font-size:12px}
.rev-ans-box{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:5px;font-weight:500}
.rev-ans-box.correct{background:#edfaf3;color:#2e7d50}
.rev-ans-box.wrong{background:#fef0f0;color:#b03030}
.rev-ans-box.same{background:#f5f4f0;color:#555}
.rev-section-title{font-size:12px;font-weight:600;color:#555;margin:1rem 0 .5rem;padding-left:2px}

/* 一覧メニュー */
.year-sel{display:flex;gap:6px;margin-bottom:.75rem}
.ybtn{flex:1;padding:.55rem;border:1.5px solid #e0ded6;border-radius:8px;background:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;color:#555;transition:all .15s}
.ybtn.active{border-color:#1a1a1a;background:#1a1a1a;color:#fff}
.set-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.ssbtn{padding:5px 12px;border:1.5px solid #e0ded6;border-radius:20px;background:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:#555;transition:all .15s}
.ssbtn.active{border-color:#1a1a1a;background:#1a1a1a;color:#fff}
.list-item{background:#fff;border:0.5px solid #e0ded6;border-radius:10px;padding:.875rem 1rem;margin-bottom:.5rem}
.li-head{display:flex;align-items:center;gap:8px;margin-bottom:.4rem}
.li-num{font-size:11px;color:#888;white-space:nowrap}
.li-ans{display:inline-flex;align-items:center;justify-content:center;width:32px;height:22px;border-radius:5px;font-size:12px;font-weight:600;flex-shrink:0}
.li-ans.maru{background:#edfaf3;color:#2e7d50}
.li-ans.batu{background:#fef0f0;color:#b03030}
.li-q{font-size:13px;line-height:1.7;color:#1a1a1a}
.list-empty{text-align:center;color:#aaa;font-size:13px;padding:2rem 0}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>自転車安全整備士 過去問クイズ</h1>
  <p>令和５年度（A〜F）・令和６年度（A〜H）・令和７年度（A〜G）全1050問</p>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('quiz')">クイズ</div>
  <div class="tab" onclick="switchTab('list')">問題一覧</div>
</div>

<!-- ===== クイズタブ ===== -->
<div id="tab-quiz" class="screen active">

  <div id="su" class="screen active">
    <div class="stat-grid">
      <div class="stat"><div class="stat-n">1050</div><div class="stat-l">総問題数</div></div>
      <div class="stat"><div class="stat-n">21</div><div class="stat-l">問題セット</div></div>
      <div class="stat"><div class="stat-n">○×</div><div class="stat-l">問題形式</div></div>
    </div>
    <div class="mode-grid">
      <div class="mode-btn selected" data-mode="all" onclick="selMode(this)">
        <div class="mb-title">全問ランダム</div>
        <div class="mb-sub">全セットからシャッフル出題</div>
      </div>
      <div class="mode-btn" data-mode="set" onclick="selMode(this)">
        <div class="mb-title">セット指定</div>
        <div class="mb-sub">年度・日程を選んで出題</div>
      </div>
    </div>
    <div id="set-sel" style="display:none;background:#fff;border:0.5px solid #e0ded6;border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem">
      <div style="font-size:12px;color:#888;margin-bottom:.5rem">出題セットを選択（複数可）</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px" id="set-checks"></div>
    </div>
    <div class="n-row">
      <label>出題数</label>
      <input type="range" id="nrange" min="5" max="50" step="5" value="20" oninput="document.getElementById('nval').textContent=this.value">
      <div class="n-val" id="nval">20</div>
    </div>
    <button class="pbtn" onclick="startQuiz()">スタート</button>
  </div>

  <div id="sq" class="screen">
    <div class="prog-wrap">
      <div class="prog-track"><div class="prog-fill" id="pf" style="width:0%"></div></div>
      <div class="prog-lbl" id="plbl">0 / 0</div>
      <button onclick="resetQuiz()" style="background:#fff;border:0.5px solid #e0ded6;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;padding:4px 10px;color:#666;font-family:inherit;white-space:nowrap;flex-shrink:0">リセット</button>
    </div>
    <div class="set-badge" id="sbadge"></div>
    <div class="q-card"><div class="q-text" id="qt"></div></div>
    <div class="tf-row">
      <button class="tf-btn" id="b-maru" onclick="answer('○')">○</button>
      <button class="tf-btn" id="b-batu" onclick="answer('×')">×</button>
    </div>
    <div class="ans-panel" id="apanel" style="display:none">
      <div class="ans-row">
        <div class="badge" id="abadge"></div>
        <div class="correct-lbl">正解は <span id="acorrect"></span></div>
      </div>
      <button class="next-btn" id="nbtn" onclick="next()"></button>
    </div>
  </div>

  <div id="sr" class="screen">
    <div class="result-card">
      <div class="score-big" id="rbig"></div>
      <div class="score-pct" id="rpct"></div>
      <div class="r-bar-wrap"><div class="r-bar-track"><div class="r-bar-fill" id="rbar" style="width:0%"></div></div></div>
      <div class="score-msg" id="rmsg"></div>
    </div>
    <div class="r-actions" style="margin-bottom:1.5rem">
      <button class="r-btn primary" onclick="startQuiz()">もう一度（同じ設定）</button>
      <button class="r-btn secondary" onclick="showQ('su')">設定に戻る</button>
    </div>
    <div id="rev-body"></div>
  </div>

</div><!-- /tab-quiz -->

<!-- ===== 一覧タブ ===== -->
<div id="tab-list" class="screen">
  <div class="year-sel">
    <button class="ybtn active" onclick="selYear('R7',this)">令和７年度</button>
    <button class="ybtn" onclick="selYear('R6',this)">令和６年度</button>
    <button class="ybtn" onclick="selYear('R5',this)">令和５年度</button>
  </div>
  <div class="set-sel" id="list-set-sel"></div>
  <div id="list-body"></div>
</div>

</div><!-- /app -->

<script>
const ALL_QS = [{"set": "A", "num": 1, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店であり、一旦登録を受ければ登録更新をする必要はない。", "answer": "×"}, {"set": "A", "num": 2, "question": "道路交通法上、自転車は軽車両と位置付けられ、歩道と車道の区別があるところでは、車道通行が原則であり、道路工事などの場合を除き、車道の左端に沿って通行しなければならない。", "answer": "○"}, {"set": "A", "num": 3, "question": "駆動補助機付自転車における人の力に対する原動機を用いて人の力を補う力の比率は、10㎞/h未満の速度で自転車を走行させる場合は、２以下であり、10㎞/h以上25㎞/h未満の速度で自転車を走行させる場合は、徐々に下がり、25㎞/h以上ではゼロとなることとされている。", "answer": "×"}, {"set": "A", "num": 4, "question": "普通自転車は、白の二本線で標示されている路側帯を通行することができる。", "answer": "×"}, {"set": "A", "num": 5, "question": "自動車は、同一の進路を進行している他の車両等の直後を進行するときは、その直前の車両等が急に停止したときにおいてもこれに追突するのを避けることができるため必要な距離を、これから保たなければならないが、自転車についても同様である。", "answer": "○"}, {"set": "A", "num": 6, "question": "自転車安全整備技能検定に合格した者は、公益財団法人日本交通管理技術協会の合格者名簿に登載され、自転車安全整備士の称号が付与される。自転車安全整備士の資格には更新制度はない。", "answer": "○"}, {"set": "A", "num": 7, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、緩まないようにねじは強く締めるほうがよい。", "answer": "×"}, {"set": "A", "num": 8, "question": "普通自転車の点検整備基準においては、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを製造業者が指定するサドル最小高さまで下げたときに、グリップの最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、50㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでないとされている。", "answer": "×"}, {"set": "A", "num": 9, "question": "道路交通法は、何人も酒気を帯びて自動車を運転することを禁止している。自転車の場合、酒酔いに至らない程度の酒気を帯びた状態での運転も禁止されている。", "answer": "○"}, {"set": "A", "num": 10, "question": "適正な事業所の基準においては、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "A", "num": 11, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、高い安全性を備えた良質な自転車の供給体制の整備が明記されている。", "answer": "○"}, {"set": "A", "num": 12, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「指定場所一時不停止」「酒酔い運転」等があるが、「制動装置（ブレーキ）不良自転車運転」もその対象である。", "answer": "○"}, {"set": "A", "num": 13, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に改造のできない構造であることとされている。", "answer": "○"}, {"set": "A", "num": 14, "question": "自転車の運転者は、他人を当該自転車に乗車させるときは、当該他人に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "A", "num": 15, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行、かつ、水平に、幅はフレーム中心面に垂直、かつ、水平にそれぞれ最長部を測定するが、スタンドについては、含めないで測定する。", "answer": "×"}, {"set": "A", "num": 16, "question": "適正な事業所の基準においては、各部品、工具の整形等に使用する卓上グラインダーは、手回し、電動どちらでもよいとされている。", "answer": "○"}, {"set": "A", "num": 17, "question": "自転車タイヤのサイドウオールのサイズ表示が〔26×1.95〕である場合、そのタイヤはＷＯタイヤである。", "answer": "×"}, {"set": "A", "num": 18, "question": "自転車安全整備店の登録を受けるためには、自転車の点検及び整備を行うための作業場が10平方メートル以上確保されていること、当該作業場が、道路から容易に自転車を持ち込めるものであること、適正な事業所の基準に定める工具を備え付けていることの３点に適合する事業所を有していなければならない。", "answer": "×"}, {"set": "A", "num": 19, "question": "普通自転車の点検整備基準においては、制動性能は、乾燥した平たんな舗装道路において、走行速度が10km/hのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "A", "num": 20, "question": "自転車活用推進法は、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を５月４日、自転車月間を同月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "A", "num": 21, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で、片足で全体重をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "○"}, {"set": "A", "num": 22, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者も同じである。", "answer": "○"}, {"set": "A", "num": 23, "question": "普通自転車を構成する部品のなかで、ハブとブレーキが一体となった構造であるハブブレーキのように、一つの部品で二つ以上の部品の機能を備えているものを複合部品という。普通自転車の点検整備マニュアルにおいては、複合部品を使用している場合は、重複する部品を省略できることとされている。", "answer": "○"}, {"set": "A", "num": 24, "question": "ＴＳマーク付帯保険の賠償責任補償は、同居の親族・同乗者に対する賠償事故は対象としていない。", "answer": "○"}, {"set": "A", "num": 25, "question": "普通自転車は、サドル、タイヤ等の車体・車輪部の部品、チェーン、ブレーキ等の駆動・制動部の部品、ハンドル等の操縦部の部品、尾灯、警音器等の安全付属部の部品又はこれらと同等の機能を有するものにより構成されている。", "answer": "○"}, {"set": "A", "num": 26, "question": "普通自転車は、自転車道の標識のあるところを通行する場合、自転車道とそれ以外の車道のどちらを通行してもよい。", "answer": "×"}, {"set": "A", "num": 27, "question": "自転車安全整備制度は、被害者の救済に資そうとするものではない。", "answer": "×"}, {"set": "A", "num": 28, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね２等分する２箇所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "×"}, {"set": "A", "num": 29, "question": "自転車は、「一時停止」の標識のあるところであっても、自動車と異なり、左右の安全が確認できれば、一時停止をしないで通行することができる。", "answer": "×"}, {"set": "A", "num": 30, "question": "自転車安全整備店の登録を受けた自転車店は、「自転車安全整備店章」を貸与されるが、事業所に掲出する必要はない。", "answer": "×"}, {"set": "A", "num": 31, "question": "自転車に安全に乗るため、自分の体に合った自転車を選ぶよう指導する。サドルにまたがらせ、ハンドルを持たせ、左右自由に回してみたり、ブレーキをかけてみたりさせ、無理のないもの、操作のしやすいものを選ばせる。", "answer": "○"}, {"set": "A", "num": 32, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような自転車事故の場合は、相手の怪我が軽いので、自動車と違い警察官への報告義務はない。", "answer": "×"}, {"set": "A", "num": 33, "question": "自転車安全整備店登録申請書に記載した自転車安全整備士の氏名等に変更を生じたときは、自転車安全整備店登録事項変更届により速やかにその旨を届け出なければならない。", "answer": "○"}, {"set": "A", "num": 34, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、徐行しなければならない。", "answer": "×"}, {"set": "A", "num": 35, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "A", "num": 36, "question": "緑色ＴＳマーク付帯保険の賠償責任補償の支払いの対象は、死亡又は重度後遺障害（１～７級）である。", "answer": "×"}, {"set": "A", "num": 37, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に備え付けられた場合において、夜間後方100メートルの距離から道路運送車両の保安基準第32条第1項の基準に適合する前照灯で照射したときに、その反射光を照射位置から容易に確認できること、反射光の色は、橙色又は赤色であることとされている。", "answer": "○"}, {"set": "A", "num": 38, "question": "夜間、自転車で走行中、前照灯が急に故障し、点灯しなくなったことに気が付いた場合は、運転を継続してはならない。", "answer": "○"}, {"set": "A", "num": 39, "question": "普通自転車の車輪数は、２輪以上４輪以下とされている。", "answer": "○"}, {"set": "A", "num": 40, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポストがはめ合わせ限界以上にはめ合わされていることを確認したうえで、固定力検査を行うのは、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定、シートポストとサドルとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "A", "num": 41, "question": "普通自転車の車体の大きさは、道路交通法令においては、長さ190㎝、幅65㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれのある鋭利な突出部がないこととされている。", "answer": "×"}, {"set": "A", "num": 42, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律は、自転車等の利用者の責務として「自転車等を利用する者は、自転車等駐車場以外の場所に自転車等を放置することのないように努めなければならない。」と定めている。", "answer": "○"}, {"set": "A", "num": 43, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないので、道路のどこに駐車してもよい。", "answer": "×"}, {"set": "A", "num": 44, "question": "普通自転車の点検整備基準においては、チェーンの点検は、ギヤクランクを正・逆方向に回転させ、容易にはずれないことを確認する。", "answer": "○"}, {"set": "A", "num": 45, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から１年間保管しなければならない。", "answer": "×"}, {"set": "A", "num": 46, "question": "警音器（ベル）は、危険を防止するためやむを得ないときなどに使用するものであるから、歩道などでみだりに鳴らしてはいけない。", "answer": "○"}, {"set": "A", "num": 47, "question": "補助車輪の付いた幼児用自転車には、普通自転車の点検整備基準に適合していても、ＴＳマークを貼付することはできない。", "answer": "×"}, {"set": "A", "num": 48, "question": "自転車安全利用５則は、車道が原則・歩道は例外、車道は左側を通行、歩道は歩行者優先で車道寄りを徐行、交通ルールを守る、子供はヘルメットを着用の５つである。", "answer": "×"}, {"set": "A", "num": 49, "question": "防犯登録は、自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律により、義務化されている。", "answer": "○"}, {"set": "A", "num": 50, "question": "駆動補助機付自転車は、ペダルに踏力が加わっていないときは、原動機による補助力が作動しないこととされている。", "answer": "○"}, {"set": "B", "num": 1, "question": "自転車を運転していて交通事故を起こしたとき、運転者は、ただちに自転車の運転を停止して、負傷者を救護し、道路における危険を防止し、交通事故の状況などを警察官に報告しなければならない。", "answer": "○"}, {"set": "B", "num": 2, "question": "自転車安全整備制度は、被害者の救済に資そうとするものではない。", "answer": "×"}, {"set": "B", "num": 3, "question": "駆動補助機付自転車は、ペダルに踏力が加わっていないときでも、わずかであれば原動機による力が作動してもよいとされている。", "answer": "×"}, {"set": "B", "num": 4, "question": "普通自転車の車輪数は、２輪以上４輪以下とされている。", "answer": "○"}, {"set": "B", "num": 5, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、徐行しなければならない。", "answer": "×"}, {"set": "B", "num": 6, "question": "駆動補助機付自転車における人の力に対する原動機を用いて人の力を補う力の比率は、10㎞/h未満の速度で自転車を走行させる場合は、２以下であり、10㎞/h以上25㎞/h未満の速度で自転車を走行させる場合は、徐々に下がり、25㎞/h以上ではゼロとなることとされている。", "answer": "×"}, {"set": "B", "num": 7, "question": "自転車安全整備店の登録を受けるためには、自転車の点検及び整備を行うための作業場が５平方メートル以上確保されていること、当該作業場が、道路から容易に自転車を持ち込めるものであること、適正な事業所の基準に定める工具を備え付けていることの３点に適合する事業所を有していなければならない。", "answer": "○"}, {"set": "B", "num": 8, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポストがはめ合わせ限界以上にはめ合わされていることを確認したうえで、固定力検査を行うのは、前ホークとハンドルステムとの固定 備店の登録を受けた自転車店は、「自転車安全整備店章」を貸与されるが、事業所に掲出する必要はない。", "answer": "×"}, {"set": "B", "num": 39, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で片足の踏力をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "×"}, {"set": "B", "num": 40, "question": "普通自転車を構成する部品のなかで、ハブとブレーキが一体となった構造であるハブブレーキのように、一つの部品で二つ以上の部品の機能を備えているものを複合部品という。普通自転車の点検整備マニュアルにおいては、複合部品を使用している場合でも、重複する部品の省略はできないこととされている。", "answer": "×"}, {"set": "B", "num": 41, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者にはその義務までは課されていない。", "answer": "×"}, {"set": "B", "num": 42, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、相当な安全性を備えた安価な自転車の供給体制の整備が明記されている。", "answer": "×"}, {"set": "B", "num": 43, "question": "適正な事業所の基準においては、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "B", "num": 44, "question": "補助車輪の付いた幼児用自転車にも、普通自転車の点検整備基準に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"}, {"set": "B", "num": 45, "question": "普通自転車の点検整備基準においては、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを製造業者が指定するサドル最小高さまで下げたときに、グリップの最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、50㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでないとされている。", "answer": "×"}, {"set": "B", "num": 46, "question": "普通自転車は、サドル、タイヤ等の車体・車輪部の部品、チェーン、ブレーキ等の駆動・制動部の部品、ハンドル等の操縦部の部品、尾灯、警音器等の安全付属部の部品又はこれらと同等の機能を有するものにより構成されている。", "answer": "○"}, {"set": "B", "num": 47, "question": "自転車に安全に乗るため、自分の体に合った自転車を選ぶよう指導する。サドルにまたがらせ、ハンドルを持たせ、左右自由に回してみたり、ブレーキをかけてみたりさせ、無理のないもの、操作のしやすいものを選ばせる。", "answer": "○"}, {"set": "B", "num": 48, "question": "夜間、自転車で走行中、前照灯が急に故障し、点灯しなくなったことに気が付いた場合は、運転を継続してはならない。", "answer": "○"}, {"set": "B", "num": 49, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないので、道路のどこに駐車しても支障はないため、駐車禁止の対象となっていない。", "answer": "×"}, {"set": "B", "num": 50, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に備え付けられた場合において、夜間後方50メートルの距離から道路運送車両の保安基準第32条第1項の基準に適合する前照灯で照射したときに、その反射光を照射位置から容易に確認できること、反射光の色は、橙色又は赤色であることとされている。", "answer": "×"}, {"set": "C", "num": 1, "question": "普通自転車の点検整備基準においては、チェーンの点検は、ギヤ 進に関して、重点的に検討され、及び実施されるべき施策として、相当な安全性を備えた安価な自転車の供給体制の整備が明記されている。", "answer": "×"}, {"set": "E", "num": 32, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で、片足で全体重をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "○"}, {"set": "E", "num": 33, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような自転車事故の場合は、相手の怪我が軽いので、自動車と違い警察官への報告義務はない。", "answer": "×"}, {"set": "E", "num": 34, "question": "自転車に安全に乗るため、自分の体に合った自転車を選ぶよう指導する。サドルにまたがらせ、ハンドルを持たせ、左右自由に回してみたり、ブレーキをかけてみたりさせ、無理のないもの、操作のしやすいものを選ばせる。", "answer": "○"}, {"set": "E", "num": 35, "question": "普通自転車の点検整備基準においては、チェーンの点検は、ギヤクランクを正・逆方向に回転させ、容易にはずれないことを確認する。", "answer": "○"}, {"set": "E", "num": 36, "question": "ＴＳマーク付帯保険の賠償責任補償は、同居の親族・同乗者に対する賠償事故は対象としていない。", "answer": "○"}, {"set": "E", "num": 37, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に改造のできない構造であることとされている。", "answer": "○"}, {"set": "E", "num": 38, "question": "自転車活用推進法は、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を５月４日、自転車月間を同月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "E", "num": 39, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行、かつ、水平に、幅はフレーム中心面に垂直、かつ、水平にそれぞれ最長部を測定するが、どろよけ、スタンド、キャリヤ、後写鏡などの部品を含めて測定する。", "answer": "○"}, {"set": "E", "num": 40, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、徐行しなければならない。", "answer": "×"}, {"set": "E", "num": 41, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に備え付けられた場合において、夜間後方100メートルの距離から道路運送車両の保安基準第32条第1項の基準に適合する前照灯で照射したときに、その反射光を照射位置から容易に確認できること、反射光の色は、橙色又は赤色であることとされている。", "answer": "○"}, {"set": "E", "num": 42, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店であり、一旦登録を受ければ登録更新をする必要はない。", "answer": "×"}, {"set": "E", "num": 43, "question": "普通自転車の車体の大きさは、道路交通法令においては、長さ190㎝、幅65㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれのある鋭利な突出部がないこととされている。", "answer": "×"}, {"set": "E", "num": 44, "question": "道路交通法上、自転車は軽車両と位置付けられ、歩道と車道の区別があるところでは、車道通行が原則であり、道路工事などの場合を除き、車道の左端に沿って通行しなければならない。", "answer": "○"}, {"set" swer": "○"}, {"set": "F", "num": 38, "question": "道路交通法は、何人も酒気を帯びて自動車を運転することを禁止しているが、自転車の場合、少量の酒しか飲んでいなければ、運転は禁止されていない。", "answer": "×"}, {"set": "F", "num": 39, "question": "夜間、自転車で走行中、前照灯が急に故障し、点灯しなくなったことに気が付いたが、街灯がある場合は、運転を継続してもよい。", "answer": "×"}, {"set": "F", "num": 40, "question": "防犯登録は、自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律により、努力義務化されている。", "answer": "×"}, {"set": "F", "num": 41, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「指定場所一時不停止」「酒酔い運転」等があるが、「制動装置（ブレーキ）不良自転車運転」はその対象ではない。", "answer": "×"}, {"set": "F", "num": 42, "question": "普通自転車を構成する部品のなかで、ハブとブレーキが一体となった構造であるハブブレーキのように、一つの部品で二つ以上の部品の機能を備えているものを複合部品という。普通自転車の点検整備マニュアルにおいては、複合部品を使用している場合は、重複する部品を省略できることとされている。", "answer": "○"}, {"set": "F", "num": 43, "question": "補助車輪の付いた幼児用自転車には、普通自転車の点検整備基準に適合していても、ＴＳマークを貼付することはできない。", "answer": "×"}, {"set": "F", "num": 44, "question": "自転車を駐車するときは、駐車禁止以外の場所に、歩行者や他の車両の通行の邪魔にならないようにしなければならない。", "answer": "○"}, {"set": "F", "num": 45, "question": "適正な事業所の基準においては、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "F", "num": 46, "question": "自転車安全整備制度は、被害者の救済に資そうとするものではない。", "answer": "×"}, {"set": "F", "num": 47, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、徐行しなければならない。", "answer": "×"}, {"set": "F", "num": 48, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポストがはめ合わせ限界以上にはめ合わされていることを確認したうえで、固定力検査を行うのは、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定、シートポストとサドルとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "F", "num": 49, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店であり、一旦登録を受ければ登録更新をする必要はない。", "answer": "×"}, {"set": "F", "num": 50, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で、片足で全体重をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "○"}, {"set": "G", "num": 1, "question": "補助車輪の付いた幼児用自転車にも、普通自転車の点検整備基準に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"}, {"set": "G", "num": 2, "question": "警音器（ベル）は、危険を防止するためやむを得ないときなどに使用するものであるから、歩道などでみだりに鳴らしてはいけない。", しないで通行することができる。", "answer": "×"}, {"set": "G", "num": 18, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で片足の踏力をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "×"}, {"set": "G", "num": 19, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店であり、一旦登録を受ければ登録更新をする必要はない。", "answer": "×"}, {"set": "G", "num": 20, "question": "普通自転車の点検整備基準においては、制動性能は、乾燥した平たんな舗装道路において、走行速度が10km/hのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "G", "num": 21, "question": "自転車の運転者は、他人を当該自転車に乗車させるときは、当該他人に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "G", "num": 22, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポストがはめ合わせ限界以上にはめ合わされていることを確認したうえで、固定力検査を行うのは、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定、シートポストとサドルとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "G", "num": 23, "question": "自転車安全整備店の登録を受けるためには、自転車の点検及び整備を行うための作業場が10平方メートル以上確保されていること、当該作業場が、道路から容易に自転車を持ち込めるものであること、適正な事業所の基準に定める工具を備え付けていることの３点に適合する事業所を有していなければならない。", "answer": "×"}, {"set": "G", "num": 24, "question": "普通自転車の点検整備基準においては、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを製造業者が指定するサドル最小高さまで下げたときに、グリップの最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、40㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでないとされている。", "answer": "○"}, {"set": "G", "num": 25, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような自転車事故の場合は、相手の怪我が軽いので、自動車と違い警察官への報告義務はない。", "answer": "×"}, {"set": "G", "num": 26, "question": "普通自転車を構成する部品のなかで、ハブとブレーキが一体となった構造であるハブブレーキのように、一つの部品で二つ以上の部品の機能を備えているものを複合部品という。普通自転車の点検整備マニュアルにおいては、複合部品を使用している場合でも、重複する部品の省略はできないこととされている。", "answer": "×"}, {"set": "G", "num": 27, "question": "自転車安全整備店の登録を受けた自転車店は、「自転車安全整備店章」を貸与されるが、事業所に掲出する必要はない。", "answer": "×"}, {"set": "G", "num": 28, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね２等分する２箇所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "×"}, {"set": "G", "num": 29, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "G", "num": 30, "question": "普通自転車の点検整備基準においては、チェーンの点検は、ギヤクランクを正・逆方向に回転させ、容易にはずれないことを確認する。", "answer": "○"}, {"set": "G", "num": 31, "question": "ＴＳマーク付帯保険の賠償責任補償は、同居の親族・同乗者に対する賠償事故は対象としていない。", "answer": "○"}, {"set": "G", "num": 32, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に備え付けられた場合において、夜間後方100メートルの距離から道路運送車両の保安基準第32条第1項の基準に適合する前照灯で照射したときに、その反射光を照射位置から容易に確認できること、反射光の色は、橙色又は赤色であることとされている。", "answer": "○"}, {"set": "G", "num": 33, "question": "普通自転車は、白の二本線で標示されている路側帯を通行することができる。", "answer": "×"}, {"set": "G", "num": 34, "question": "普通自転車の車輪数は、２輪以上４輪以下とされている。", "answer": "○"}, {"set": "G", "num": 35, "question": "適正な事業所の基準においては、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "G", "num": 36, "question": "自転車活用推進法は、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を５月４日、自転車月間を同月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "G", "num": 37, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、緩まないようにねじは強く締めるほうがよい。", "answer": "×"}, {"set": "G", "num": 38, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないので、道路のどこに駐車しても支障はないため、駐車禁止の対象となっていない。", "answer": "×"}, {"set": "G", "num": 39, "question": "緑色ＴＳマーク付帯保険の賠償責任補償の支払いの対象は、死亡又は重度後遺障害（１～４級）である。", "answer": "×"}, {"set": "G", "num": 40, "question": "駆動補助機付自転車における人の力に対する原動機を用いて人の力を補う力の比率は、10㎞/h未満の速度で自転車を走行させる場合は、２以下であり、10㎞/h以上25㎞/h未満の速度で自転車を走行させる場合は、徐々に下がり、25㎞/h以上ではゼロとなることとされている。", "answer": "×"}, {"set": "G", "num": 41, "question": "自転車安全利用５則は、車道が原則・歩道は例外、車道は左側を通行、歩道は歩行者優先で車道寄りを徐行、交通ルールを守る、子供はヘルメットを着用の５つである。", "answer": "×"}, {"set": "G", "num": 42, "question": "自転車安全整備技能検定に合格した者は、公益財団法人日本交通管理技術協会の合格者名簿に登載され、自転車安全整備士の称号が付与される。自転車安全整備士の資格は、３年毎に更新しなければならない。", "answer": "×"}, {"set": "G", "num": 43, "question": "自転車タイヤのサイドウオールのサイズ表示が〔700×32C〕である場合、そのタイヤはＨＥタイヤである。", "answer": "×"}, {"set": "G", "num": 44, "question": "道路交通法上、自転車は軽車両と位置付けられ、歩道と車道の区別があるところでは、車道通行が原則であり、道路工事などの場合を除き、車道の左端に沿って通行しなければならない。", "answer": "○"}, {"set": "G", "num": 45, "question": "普通自転
