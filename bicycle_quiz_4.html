整備士の称号が付与される。自転車安全整備士の資格には更新制度はない。", "answer": "○"}, {"set": "H", "num": 25, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に改造のできない構造であることとされている。", "answer": "○"}, {"set": "H", "num": 26, "question": "普通自転車を構成する部品のなかで、ハブとブレーキが一体となった構造であるハブブレーキのように、一つの部品で二つ以上の部品の機能を備えているものを複合部品という。普通自転車の点検整備マニュアルにおいては、複合部品を使用している場合は、重複する部品を省略できることとされている。", "answer": "○"}, {"set": "H", "num": 27, "question": "ＴＳマーク付帯保険の賠償責任補償は、同居の親族・同乗者に対する賠償事故も対象としている。", "answer": "×"}, {"set": "H", "num": 28, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポストがはめ合わせ限界以上にはめ合わされていることを確認したうえで、固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定、シートポストとサドルとの固定及びハンドルバーとブレーキレバーとの固定の５箇所である。", "answer": "○"}, {"set": "H", "num": 29, "question": "自転車に安全に乗るため、自分の体に合った自転車を選ぶよう指導する。サドルにまたがらせ、ハンドルを持たせ、左右自由に回してみたり、ブレーキをかけてみたりさせ、無理のないもの、操作のしやすいものを選ばせる。", "answer": "○"}, {"set": "H", "num": 30, "question": "適正な事業所の基準においては、各部品、工具の整形等に使用する卓上グラインダーは、電動でなければならないとされている。", "answer": "×"}, {"set": "H", "num": 31, "question": "普通自転車の車輪数は、２輪又は３輪とされている。", "answer": "×"}, {"set": "H", "num": 32, "question": "自転車活用推進法は、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を５月４日、自転車月間を同月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "H", "num": 33, "question": "駆動補助機付自転車における人の力に対する原動機を用いて人の力を補う力の比率は、10㎞/h未満の速度で自転車を走行させる場合は、２以下であり、10㎞/h以上25㎞/h未満の速度で自転車を走行させる場合は、徐々に下がり、25㎞/h以上ではゼロとなることとされている。", "answer": "×"}, {"set": "H", "num": 34, "question": "普通自転車の点検整備基準においては、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを製造業者が指定するサドル最小高さまで下げたときに、グリップの最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、40㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでないとされている。", "answer": "○"}, {"set": "H", "num": 35, "question": "警音器（ベル）は、危険を防止するためやむを得ないときなどに使用するものであるから、歩道などでみだりに鳴らしてはいけない。", "answer": "○"}, {"set": "H", "num": 36, "question": "自転車タイヤのサイドウオールのサイズ表示が〔26×1.95〕である場合、そのタイヤはＨＥタイヤである。", "answer": "○"}, {"set": "H", "num": 37, "question": "夜間、自転車で走行中、前照灯が急に故障し、点灯しなくなったことに気が付いたが、街灯がある場合は、運転を継続してもよい。", "answer": "×"}, {"set": "H", "num": 38, "question": "適正な事業所の基準においては、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "H", "num": 39, "question": "自転車安全整備制度は、被害者の救済に資そうとするものではない。", "answer": "×"}, {"set": "H", "num": 40, "question": "自動車は、同一の進路を進行している他の車両等の直後を進行するときは、その直前の車両等が急に停止したときにおいてもこれに追突するのを避けることができるため必要な距離を、これから保たなければならないが、自転車についても同様である。", "answer": "○"}, {"set": "H", "num": 41, "question": "防犯登録は、自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律により、義務化されている。", "answer": "○"}, {"set": "H", "num": 42, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "H", "num": 43, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「指定場所一時不停止」「酒酔い運転」等があるが、「制動装置（ブレーキ）不良自転車運転」はその対象ではない。", "answer": "×"}, {"set": "H", "num": 44, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店であり、一旦登録を受ければ登録更新をする必要はない。", "answer": "×"}, {"set": "H", "num": 45, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者にはその義務までは課されていない。", "answer": "×"}, {"set": "H", "num": 46, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行、かつ、水平に、幅はフレーム中心面に垂直、かつ、水平にそれぞれ最長部を測定するが、スタンドについては、含めないで測定する。", "answer": "×"}, {"set": "H", "num": 47, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、高い安全性を備えた良質な自転車の供給体制の整備が明記されている。", "answer": "○"}, {"set": "H", "num": 48, "question": "自転車安全利用５則は、車道が原則・左側を通行・歩道は例外・歩行者を優先、交差点では信号と一時停止を守って・安全確認、夜間はライトを点灯、飲酒運転は禁止、ヘルメットを着用の５つである。", "answer": "○"}, {"set": "H", "num": 49, "question": "自転車の運転者は、他人を当該自転車に乗車させるときは、当該他人に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "H", "num": 50, "question": "自転車安全整備店の登録を受けるためには、自転車の点検及び整備を行うための作業場が５平方メートル以上確保されていること、当該作業場が、道路から容易に自転車を持ち込めるものであること、適正な事業所の基準に定める工具を備え付けていることの３点に適合する事業所を有していなければならない。", "answer": "○"}, {"set": "R5A", "num": 1, "question": "ＴＳマークに付帯する傷害保険では、ＴＳマークが貼付されている自転車に搭乗中の人が、事故によって事故の日から１８０日以内に死亡又は重度後遺障害（自動車賠償責任保険の後遺障害等級の第１級から第４級までをいう。）を被った場合、一律に緑色ＴＳマークは５０万円、赤色ＴＳマークは１００万円、青色ＴＳマークは３０万円が支払われる。", "answer": "○"}, {"set": "R5A", "num": 2, "question": "ＴＳマーク付帯保険の支払いを受けられる者は、自転車の所有者である必要はなく、所有者から借用して搭乗している人も支払対象者に含まれる。", "answer": "○"}, {"set": "R5A", "num": 3, "question": "ＴＳマーク付帯保険の支払いの対象となる事故は、道路上で起きた交通事故に限られ、スーパーの駐車場や通常自転車が通行することができる公園は含まれない。", "answer": "×"}, {"set": "R5A", "num": 4, "question": "ＴＳマーク付帯保険の賠償責任補償は、同居の親族・同乗者に対する賠償事故及び対物損害も対象としている。", "answer": "×"}, {"set": "R5A", "num": 5, "question": "自転車の中には、ブレーキやベルの装置のないものや故障または整備されていないなど、不備があるまま使用されていることがある。安全に運転するためには、整備された自転車に乗ること、そのためには、自転車の手入れや簡単な修理ができるようにしておくことが必要である。", "answer": "○"}, {"set": "R5A", "num": 6, "question": "道路交通法は、過労、病気、薬物その他の理由により正常な運転ができない状態で自動車を運転することを禁止している。自転車の場合も、自動車と同じように過労、病気、薬物その他の理由により正常な運転ができない状態で運転することを禁止している。", "answer": "○"}, {"set": "R5A", "num": 7, "question": "児童又は幼児を保護する責任のある者は、児童又は幼児が自転車を運転するときは、当該児童又は幼児に乗車用ヘルメットを必ずかぶらせなければならない。", "answer": "×"}, {"set": "R5A", "num": 8, "question": "自転車は、「一時停止」の標識のあるところであっても、自動車と異なり、安全を確かめれば一時停止をしなくてもよい。", "answer": "×"}, {"set": "R5A", "num": 9, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R5A", "num": 10, "question": "防犯登録は、自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律により、努力義務化されている。", "answer": "×"}, {"set": "R5A", "num": 11, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車等を利用する者は、自転車等駐車場以外の場所に自転車等を放置してはならない。」として、自転車利用者の責務を定めている。", "answer": "×"}, {"set": "R5A", "num": 12, "question": "自転車安全整備店としての登録を受けるには、自転車安全整備士の資格を有する者が勤務していれば、自転車店の店主が自転車安全整備士の資格を有していなくてもよい。", "answer": "○"}, {"set": "R5A", "num": 13, "question": "ＴＳマークの更新の場合の付帯保険の開始日については、保険の有効期間満了日の前一か月間の「更新期間」の間に更新すれば、前の保険の満了日の翌日となる。", "answer": "○"}, {"set": "R5A", "num": 14, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店で、５年ごとに登録更新を受けなければならない。", "answer": "×"}, {"set": "R5A", "num": 15, "question": "ＴＳマーク付帯保険の支払いの対象となる事故には、業務中の事故は含まれない。", "answer": "×"}, {"set": "R5A", "num": 16, "question": "普通自転車の点検整備マニュアルにおけるブレーキの点検項目は、ブレーキの大きな遊び、ブレーキレバーの固すぎ、ブレーキレバーの戻り不良、ブレーキの片利き、片当たり、ブレーキの利きすぎ、ブレーキブロックの取り付け位置のずれ及び摩耗の6点である。", "answer": "×"}, {"set": "R5A", "num": 17, "question": "普通自転車のブレーキレバーの位置は、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の頭頂部より下方にする。", "answer": "×"}, {"set": "R5A", "num": 18, "question": "タイヤのサイドウォールに「700×32C」とあるタイヤはHEタイヤで仏式サイズ表示である。", "answer": "×"}, {"set": "R5A", "num": 19, "question": "ワイヤカッタ、ニッパ、プライヤは、自転車安全整備店が備え付ける工具であるが、この中でブレーキワイヤを切断する際、最も適している工具は、ワイヤカッタである。", "answer": "○"}, {"set": "R5A", "num": 20, "question": "スポーク張力計（スポークテンションメーター）は、適正な事業所の基準で定める工具に含まれる。", "answer": "○"}, {"set": "R5A", "num": 21, "question": "普通自転車は、フレーム、サドル、リムなどの車体・車輪部の部品、ギヤクランク、チェーンなどの駆動・制動部の部品、ハンドル、ブレーキなどの操縦部の部品、反射器材、警音器などの安全付属部の部品又はこれらと同等の機能を有するものによって構成されている。", "answer": "×"}, {"set": "R5A", "num": 22, "question": "普通自転車の車輪を点検する場合、スポークの張力の緩いものは、締め付ける等して、張力の著しいばらつきがないように調節する。", "answer": "○"}, {"set": "R5A", "num": 23, "question": "普通自転車の尾灯の性能については、自転車に備え付けられた場合において、夜間後方１００ｍの距離から、その灯光を容易に確認できることとされている。", "answer": "○"}, {"set": "R5A", "num": 24, "question": "普通自転車の警音器(ベル)の性能を点検する場合、１０ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "×"}, {"set": "R5A", "num": 25, "question": "普通自転車を点検整備する場合、普通自転車の点検整備基準に示す部品構成表に掲げる部品等で構成されていることを目視により確認し、不足又は破損している場合は、普通自転車の点検整備基準の構造及び性能の基準等に適合する部品を補充する。", "answer": "○"}, {"set": "R5A", "num": 26, "question": "前ホークステムとハンドルステムの固定を調べるには、自転車の前から両脚で車輪を挟み、両手でハンドルバーを握って水平方向に左右に回したときに、動かないか確認する。", "answer": "○"}, {"set": "R5A", "num": 27, "question": "普通自転車の車体の大きさは、道路交通法令では、長さ１９０㎝、幅６５㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれがある突出部がないこととされている。", "answer": "×"}, {"set": "R5A", "num": 28, "question": "普通自転車のリヤリフレクタの有効反射部は、その光軸が自転車の進行方向に対し、平行に取り付けられ、上下左右に５°以上の傾きがあってはならず、反射部全面が後方より容易に見えることを確認する。", "answer": "○"}, {"set": "R5A", "num": 29, "question": "普通自転車の部品の取付けを点検する場合、チェーンは、ギヤクランクを逆方向に回転させて確認し、必要な場合は整備する。", "answer": "×"}, {"set": "R5A", "num": 30, "question": "普通自転車の制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R5A", "num": 31, "question": "普通自転車のブレーキレバーは、手を用いて容易に操作できる位置にあることが求められる。また、後写鏡を装備する場合は、運転操作を妨げず、かつ、歩行者等に危害を及ばさないよう装備されていることが求められる。", "answer": "○"}, {"set": "R5A", "num": 32, "question": "駆動補助機付自転車の点検整備基準においては、電動機以外の原動機を備えていないこととされている。", "answer": "○"}, {"set": "R5A", "num": 33, "question": "駆動補助機付自転車は、発進、加速、定速（定常）、減速、惰行及び停止の各運転態様を組み合わせて走行させた場合、各運転態様のつながりが円滑で、時間応答性が速やかでなくてはならない。", "answer": "○"}, {"set": "R5A", "num": 34, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、ねじはより強く締めるほうがよい。", "answer": "×"}, {"set": "R5A", "num": 35, "question": "駆動補助機付自転車の電源スイッチ、電池、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができない構造でなければならない。", "answer": "×"}, {"set": "R5A", "num": 36, "question": "自転車安全整備店に自転車安全整備士がいなくなった場合、登録の効力が失われる。", "answer": "○"}, {"set": "R5A", "num": 37, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から３年間保管しなければならない。", "answer": "○"}, {"set": "R5A", "num": 38, "question": "一輪車には、長さ190センチメートル、幅60センチメートルのいずれも超えない場合にはＴＳマークを貼付することができる。", "answer": "×"}, {"set": "R5A", "num": 39, "question": "自転車安全整備士は、自転車の安全利用の指導について、専門的な知識と技能を持つ必要はない。", "answer": "×"}, {"set": "R5A", "num": 40, "question": "ＴＳマーク付帯保険の有効期間は、ＴＳマークに記載された点検基準日から１年間である。ＴＳマークには、点検基準日及び自転車安全整備士の登録番号を記載しなければならない。", "answer": "○"}, {"set": "R5A", "num": 41, "question": "自転車に荷物を積むときは、視野を妨げるなど運転の支障となったり、片寄って自転車の安定が悪くならないよう、前カゴや荷台に固定するとともに、歩行者などの迷惑にならないように注意する。", "answer": "○"}, {"set": "R5A", "num": 42, "question": "自転車が、信号機や道路標識・標示、その他の交通状況によって、徐行したり、停止したりする場合には、静かに前輪のブレーキをかけてスピードを加減するようにする。みだりに急ブレーキをかけると、後から来る車に衝突されたり、スリップして転倒したりする危険があるから注意する。", "answer": "×"}, {"set": "R5A", "num": 43, "question": "自転車は、著しく歩行者の通行を妨げる場合を除き、道路の中央から左の部分に設けられた路側帯を通行することができるが、白の二本線の標示のある路側帯を通行することはできない。", "answer": "○"}, {"set": "R5A", "num": 44, "question": "警察官が手信号や灯火による信号により交通整理を行っている場合、この手信号や灯火による信号が信号機の信号と違っていても、その警察官の信号に従わなければならない。", "answer": "○"}, {"set": "R5A", "num": 45, "question": "駆動補助機付普通自転車は、道路標識等により普通自転車が通行することができるとされている歩道であっても、駆動補助機が付いているため通行することはできない。", "answer": "×"}, {"set": "R5A", "num": 46, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、一時停止しなければならない。", "answer": "○"}, {"set": "R5A", "num": 47, "question": "自転車は、信号機のある交差点を右折する場合、対面する信号が赤や黄色であっても、右折用の青の矢印が表示されていれば、自動車と同じ方法で右折することができる。", "answer": "×"}, {"set": "R5A", "num": 48, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人や車両等に自転車が走っていることを知らせるためのものでもある。", "answer": "○"}, {"set": "R5A", "num": 49, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者にはその義務までは課されていない。", "answer": "×"}, {"set": "R5A", "num": 50, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」「酒酔い運転」などがあるが、「通行区分違反」もその対象である。", "answer": "○"}, {"set": "R5B", "num": 1, "question": "自転車に乗車して信号機のない交差点を右に曲がるときは、後方の安全を確かめ、交差点の中心を通るなど最短距離で交差点の向こう側まで進むようにする。", "answer": "×"}, {"set": "R5B", "num": 2, "question": "自転車は、「一時停止」の標識のあるところでは、一時停止をして、安全を確かめなければならない。", "answer": "○"}, {"set": "R5B", "num": 3, "question": "ＴＳマーク付帯保険の支払いの対象となる事故には、業務中の事故は含まれない。", "answer": "×"}, {"set": "R5B", "num": 4, "question": "普通自転車の部品の取付けを点検する場合、チェーンは、ギヤクランクを正・逆方向に回転させて確認し、必要な場合は整備する。", "answer": "○"}, {"set": "R5B", "num": 5, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」「酒酔い運転」などがあるが、「通行区分違反」はその対象ではない。", "answer": "×"}, {"set": "R5B", "num": 6, "question": "自転車の中には、ブレーキやベルの装置のないものや故障または整備されていないなど、不備があるまま使用されていることがある。安全に運転するためには、整備された自転車に乗ること、そのためには、自転車の手入れや簡単な修理ができるようにしておくことが必要である。", "answer": "○"}, {"set": "R5B", "num": 7, "question": "普通自転車のブレーキレバーの位置は、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。", "answer": "○"}, {"set": "R5B", "num": 8, "question": "自転車安全整備士は、自転車の点検整備と安全利用の指導について専門的な知識と技能を持っていなければならない。", "answer": "○"}, {"set": "R5B", "num": 9, "question": "普通自転車のブレーキレバーは、手を用いて容易に操作できる位置にあることが求められる。また、後写鏡を装備する場合は、後方の安全確認が容易にできる位置にあればよい。", "answer": "×"}, {"set": "R5B", "num": 10, "question": "普通自転車のリヤリフレクタの有効反射部は、その光軸が自転車の進行方向に対し、平行に取り付けられ、上下左右に１０°以上の傾きがあってはならず、反射部全面が後方より容易に見えることを確認する。", "answer": "×"}, {"set": "R5B", "num": 11, "question": "ＴＳマーク付帯保険の支払いの対象となる事故は、道路上で起きた交通事故だけに限られず、スーパーの駐車場や通常自転車が通行することのできる公園も含まれる。", "answer": "○"}, {"set": "R5B", "num": 12, "question": "駆動補助機付自転車の電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に改造のできない構造でなければならない。", "answer": "○"}, {"set": "R5B", "num": 13, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車等を利用する者は、自転車等駐車場以外の場所に自転車等を放置してはならない。」として、自転車利用者の責務を定めている。", "answer": "×"}, {"set": "R5B", "num": 14, "question": "普通自転車の尾灯の性能については、自転車に備え付けられた場合において、夜間後方１００ｍの距離から、その灯光を容易に確認できることとされている。", "answer": "○"}, {"set": "R5B", "num": 15, "question": "警察官が手信号や灯火による信号により交通整理を行っている場合、この手信号や灯火による信号が信号機の信号と違っていても、その警察官の信号に従わなければならない。", "answer": "○"}, {"set": "R5B", "num": 16, "question": "駆動補助機付自転車のペダルに踏力が加わっていないときは、補助力が作動しないことが求められている。", "answer": "○"}, {"set": "R5B", "num": 17, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から１年間保管しなければならない。", "answer": "×"}, {"set": "R5B", "num": 18, "question": "駆動補助機付自転車は、発進、加速、定速（定常）、減速、惰行及び停止の各運転態様を組み合わせて走行させた場合、各運転態様のつながりが円滑であれば、時間応答性は速やかでなくてもよい。", "answer": "×"}, {"set": "R5B", "num": 19, "question": "ＴＳマークに付帯する傷害保険では、ＴＳマークが貼付されている自転車に搭乗中の人が、事故によって事故の日から１８０日以内に死亡又は重度後遺障害（自動車賠償責任保険の後遺障害等級の第１級から第７級までをいう。）を被った場合、一律に緑色ＴＳマークは５０万円、赤色ＴＳマークは１００万円、青色ＴＳマークは３０万円が支払われる。", "answer": "×"}, {"set": "R5B", "num": 20, "question": "普通自転車の警音器(ベル)の性能を点検する場合、１０ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "×"}, {"set": "R5B", "num": 21, "question": "ワイヤカッタ、ニッパ、プライヤは、自転車安全整備店が備え付ける工具であるが、この中でブレーキワイヤを切断する際、最も適している工具は、ワイヤカッタである。", "answer": "○"}, {"set": "R5B", "num": 22, "question": "ＴＳマークの更新の場合の付帯保険の開始日については、保険の有効期間満了日の前一か月間の「更新期間」の間に更新すれば、前の保険の満了日の翌日となる。", "answer": "○"}, {"set": "R5B", "num": 23, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者も同じである。", "answer": "○"}, {"set": "R5B", "num": 24, "question": "普通自転車の車体の大きさは、道路交通法令では、長さ２００㎝、幅６０㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれがある突出部がないこととされている。", "answer": "×"}, {"set": "R5B", "num": 25, "question": "自転車が、信号機や道路標識・標示、その他の交通状況によって、徐行したり、停止したりする場合には、静かに前輪のブレーキをかけてスピードを加減するようにする。みだりに急ブレーキをかけると、後から来る車に衝突されたり、スリップして転倒したりする危険があるから注意する。", "answer": "×"}, {"set": "R5B", "num": 26, "question": "自転車安全整備店に自転車安全整備士がいなくなった場合、登録の効力が失われる。", "answer": "○"}, {"set": "R5B", "num": 27, "question": "普通自転車は、フレーム、サドル、リムなどの車体・車輪部の部品、ギヤクランク、チェーンなどの駆動・制動部の部品、ハンドル、ブレーキなどの操縦部の部品、反射器材、警音器などの安全付属部の部品又はこれらと同等の機能を有するものによって構成されている。", "answer": "×"}, {"set": "R5B", "num": 28, "question": "普通自転車の制動性能は、乾燥した平坦な舗装道路において、走行速度が１５㎞／ｈのとき制動操作を開始した場所から５ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "×"}, {"set": "R5B", "num": 29, "question": "普通自転車は、道路標識等により普通自転車が通行できることができるとされている歩道を通行することができる。この場合、歩行者の通行を妨げることとなるときは、ベルを鳴らして歩行者に注意を喚起し、徐行しなければならない。", "answer": "×"}, {"set": "R5B", "num": 30, "question": "自転車は、信号機のある交差点を右折する場合、対面する信号が赤で、右折用の青の矢印が表示されていても、自動車と同じ方法で右折することはできない。", "answer": "○"}, {"set": "R5B", "num": 31, "question": "普通自転車の点検整備マニュアルにおけるブレーキの点検項目は、ブレーキの大きな遊び、ブレーキレバーの固すぎ、ブレーキレバーの戻り不良、ブレーキの片利き、片当たり、ブレーキの利きの甘さ、ブレーキブロックの取り付け位置のずれ及び摩耗の6点である。", "answer": "○"}, {"set": "R5B", "num": 32, "question": "自転車安全整備店としての登録を受けるには、自転車安全整備士の資格を有する者が勤務していれば、自転車店の店主が自転車安全整備士の資格を有していなくてもよい。", "answer": "○"}, {"set": "R5B", "num": 33, "question": "自転車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて道路の左側に寄って一時停止しなければならない。しかし、一方通行の道路で左側に寄ると、かえって緊急自動車の通行を妨げる場合は、右側に寄る。", "answer": "○"}, {"set": "R5B", "num": 34, "question": "防犯登録は法律で登録することが義務付けられているが、防犯登録がなされていない普通自転車にも、防犯登録とは制度が異なることから、ＴＳマークを貼付することはできる。", "answer": "○"}, {"set": "R5B", "num": 35, "question": "普通自転車の車輪を点検する場合、スポークの張力の緩いものは、締め付ける等して、張力の著しいばらつきがないように調節する。", "answer": "○"}, {"set": "R5B", "num": 36, "question": "駆動補助機付自転車の点検整備基準においては、電動機以外の原動機を備えていてもよいとされている。", "answer": "×"}, {"set": "R5B", "num": 37, "question": "一輪車には、長さ190センチメートル、幅60センチメートルのいずれも超えない場合であってもＴＳマークを貼付することができない。", "answer": "○"}, {"set": "R5B", "num": 38, "question": "児童又は幼児を保護する責任のある者は、児童又は幼児が自転車を運転するときは、当該児童又は幼児に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "R5B", "num": 39, "question": "ＴＳマーク付帯保険の支払いを受けられる者は、自転車の所有者である必要はなく、所有者から借用して搭乗している人も支払対象者に含まれる。", "answer": "○"}, {"set": "R5B", "num": 40, "question": "道路交通法は、過労、病気、薬物その他の理由により正常な運転ができない状態で自動車を運転することを禁止しているが、自転車については運転しないよう努めなければならないとしている。", "answer": "×"}, {"set": "R5B", "num": 41, "question": "駆動補助機付普通自転車は、道路標識等により普通自転車が通行することができるとされている歩道であっても、駆動補助機が付いているため通行することはできない。", "answer": "×"}, {"set": "R5B", "num": 42, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店で、５年ごとに登録更新を受けなければならない。", "answer": "×"}, {"set": "R5B", "num": 43, "question": "スポーク張力計（スポークテンションメーター）は、適正な事業所の基準で定める工具には含まれない。", "answer": "×"}, {"set": "R5B", "num": 44, "question": "自転車は、著しく歩行者の通行を妨げる場合を除き、道路の中央から左の部分に設けられた路側帯を通行することができるが、白の二本線の標示のある路側帯を通行することはできない。", "answer": "○"}, {"set": "R5B", "num": 45, "question": "普通自転車を点検整備する場合、普通自転車の点検整備基準に示す部品構成表に掲げる部品等で構成されていることを目視により確認し、不足又は破損している場合は、普通自転車の点検整備基準の構造及び性能の基準等に適合する部品を補充する。", "answer": "○"}, {"set": "R5B", "num": 46, "question": "自転車に荷物を積むときは、視野を妨げるなど運転の支障となったり、片寄って自転車の安定が悪くならないよう、前カゴや荷台に固定するとともに、歩行者などの迷惑にならないように注意する。", "answer": "○"}, {"set": "R5B", "num": 47, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、各ねじ部の緩みを丁寧に点検し、ねじの緩んだ箇所の増し締めを行い、整備する。", "answer": "○"}, {"set": "R5B", "num": 48, "question": "前ホークステムとハンドルステムの固定を調べるには、自転車の前から両脚で車輪を挟み、両手でハンドルバーを握って水平方向に左右に回したときに、動かないか確認する。", "answer": "○"}, {"set": "R5B", "num": 49, "question": "ＴＳマークの付帯保険の有効期間は、ＴＳマークに記載された点検基準日から１年間である。ＴＳマークには点検基準日及び自転車安全整備店の登録番号を記載しなければならない。", "answer": "×"}, {"set": "R5B", "num": 50, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、前方の安全を確認するためのものであるから、街灯がある場合は、ライトを点灯して走行しなくてもよい。", "answer": "×"}, {"set": "R5C", "num": 1, "question": "自転車安全整備店に自転車安全整備士がいなくなった場合、登録の効力が失われる。", "answer": "○"}, {"set": "R5C", "num": 2, "question": "自転車が、信号機や道路標識・標示、その他の交通状況によって、徐行したり、停止したりする場合には、静かに前輪のブレーキをかけてスピードを加減するようにする。みだりに急ブレーキをかけると、後から来る車に衝突されたり、スリップして転倒したりする危険があるから注意する。", "answer": "×"}, {"set": "R5C", "num": 3, "question": "前ホークステムとハンドルステムの固定を調べるには、自転車の前から両脚で車輪を挟み、両手でハンドルバーを握って水平方向に左右に回したときに、動かないか確認する。", "answer": "○"}, {"set": "R5C", "num": 4, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人や車両等に自転車が走っていることを知らせるためのものでもある。", "answer": "○"}, {"set": "R5C", "num": 5, "question": "自転車安全整備店としての登録を受けるには、自転車安全整備士の資格を有する者が勤務していれば、自転車店の店主が自転車安全整備士の資格を有していなくてもよい。", "answer": "○"}, {"set": "R5C", "num": 6, "question": "自転車に荷物を積むときは、視野を妨げるなど運転の支障となったり、片寄って自転車の安定が悪くならないよう、前カゴや荷台に固定するとともに、歩行者などの迷惑にならないように注意する。", "answer": "○"}, {"set": "R5C", "num": 7, "question": "自転車に安全に乗るため、自分の体に合った自転車を選ぶよう指導する。自転車の大きさは、ハンドルを握ったとき、上体が少し前に傾く、サドルにまたがったとき、両脚かかとが地面につく、が目安となる。", "answer": "×"}, {"set": "R5C", "num": 8, "question": "ＴＳマークの更新の場合の付帯保険の開始日については、保険の有効期間満了日の前一か月間の「更新期間」の間に更新すれば、前の保険の満了日の翌日となる。", "answer": "○"}, {"set": "R5C", "num": 9, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、ねじはより強く締めるほうがよい。", "answer": "×"}, {"set": "R5C", "num": 10, "question": "普通自転車の警音器(ベル)の性能を点検する場合、１０ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "×"}, {"set": "R5C", "num": 11, "question": "ＴＳマーク付帯保険の支払いの対象となる事故には、業務中の事故は含まれない。", "answer": "×"}, {"set": "R5C", "num": 12, "question": "駆動補助機付自転車は、発進、加速、定速（定常）、減速、惰行及び停止の各運転態様を組み合わせて走行させた場合、各運転態様のつながりが円滑で、時間応答性が速やかでなくてはならない。", "answer": "○"}, {"set": "R5C", "num": 13, "question": "警察官が手信号や灯火による信号により交通整理を行っている場合、この手信号や灯火による信号が信号機の信号と違っていても、その警察官の信号に従わなければならない。", "answer": "○"}, {"set": "R5C", "num": 14, "question": "普通自転車の点検整備マニュアルにおけるブレーキの点検項目は、ブレーキの小さな遊び、ブレーキレバーの固すぎ、ブレーキレバーの戻り不良、ブレーキの片利き、片当たり、ブレーキの利きの甘さ、ブレーキブロックの取り付け位置のずれ及び摩耗の6点である。", "answer": "×"}, {"set": "R5C", "num": 15, "question": "一輪車には、長さ190センチメートル、幅60センチメートルのいずれも超えない場合であってもＴＳマークを貼付することができない。", "answer": "○"}, {"set": "R5C", "num": 16, "question": "普通自転車の車体の大きさは、道路交通法令では、長さ１９０㎝、幅６０㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれがある突出部がないこととされている。", "answer": "○"}, {"set": "R5C", "num": 17, "question": "普通自転車の車輪を点検する場合、スポークの張力の緩いものは、締め付ける等して、張力の著しいばらつきがないように調節する。", "answer": "○"}, {"set": "R5C", "num": 18, "question": "ＴＳマークの付帯保険の有効期間は、ＴＳマークに記載された点検基準日から１年間である。ＴＳマークには点検基準日及び自転車安全整備店の登録番号を記載しなければならない。", "answer": "×"}, {"set": "R5C", "num": 19, "question": "スポーク張力計（スポークテンションメーター）は、適正な事業所の基準で定める工具に含まれる。", "answer": "○"}, {"set": "R5C", "num": 20, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、一時停止しなければならない。", "answer": "×"}, {"set": "R5C", "num": 21, "question": "ＴＳマーク付帯保険の支払いを受けられる者は、自転車に搭乗中の所有者に限られるので、所有者から借用して搭乗している人は支払対象者に含まれない。", "answer": "×"}, {"set": "R5C", "num": 22, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R5C", "num": 23, "question": "普通自転車の尾灯の性能については、自転車に備え付けられた場合において、夜間後方１００ｍの距離から、その灯光を容易に確認できることとされている。", "answer": "○"}, {"set": "R5C", "num": 24, "question": "緑色ＴＳマークに付帯する保険では、被害者に入院１５日以上の傷害を負わせた場合、一律に被害者見舞金１０万円が支払われる。", "answer": "×"}, {"set": "R5C", "num": 25, "question": "ワイヤカッタ、ニッパ、プライヤは、自転車安全整備店が備え付ける工具であるが、この中でブレーキワイヤを切断する際、最も適している工具は、ワイヤカッタである。", "answer": "○"}, {"set": "R5C", "num": 26, "question": "普通自転車を点検整備する場合、普通自転車の点検整備基準に示す部品構成表に掲げる部品等で構成されていることを目視により確認し、不足又は破損している場合は、普通自転車の点検整備基準の構造及び性能の基準等に適合する部品を補充する。", "answer": "○"}, {"set": "R5C", "num": 27, "question": "普通自転車のリヤリフレクタの有効反射部は、その光軸が自転車の進行方向に対し、平行に取り付けられ、上下左右に１０°以上の傾きがあってはならず、反射部全面が後方より容易に見えることを確認する。", "answer": "×"}, {"set": "R5C", "num": 28, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車等を利用する者は、自転車等駐車場以外の場所に自転車等を放置してはならない。」として、自転車利用者の責務を定めている。", "answer": "×"}, {"set": "R5C", "num": 29, "question": "普通自転車のブレーキレバーは、手を用いて容易に操作できる位置にあることが求められる。また、後写鏡を装備する場合は、後方の安全確認が容易にできる位置にあればよい。", "answer": "×"}, {"set": "R5C", "num": 30, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者にはその義務までは課されていない。", "answer": "×"}, {"set": "R5C", "num": 31, "question": "普通自転車の制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から５ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "×"}, {"set": "R5C", "num": 32, "question": "自転車の中には、ブレーキやベルの装置のないものや故障または整備されていないなど、不備があるまま使用されていることがある。安全に運転するためには、整備された自転車に乗ること、そのためには、自転車の手入れや簡単な修理ができるようにしておくことが必要である。", "answer": "○"}, {"set": "R5C", "num": 33, "question": "道路交通法は、過労、病気、薬物その他の理由により正常な運転ができない状態で自動車を運転することを禁止しているが、自転車については運転しないよう努めなければならないとしている。", "answer": "×"}, {"set": "R5C", "num": 34, "question": "駆動補助機付自転車は、信号機のある交差点を右折する場合、対面する信号が赤や黄色であっても、右折用の青の矢印が表示されていれば、自動車と同じ方法で右折することができる。", "answer": "×"}, {"set": "R5C", "num": 35, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店で、５年ごとに登録更新を受けなければならない。", "answer": "×"}, {"set": "R5C", "num": 36, "question": "普通自転車のブレーキレバーの位置は、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の頭頂部より下方にする。", "answer": "×"}, {"set": "R5C", "num": 37, "question": "自転車は、著しく歩行者の通行を妨げる場合を除き、道路の中央から左の部分に設けられた路側帯を通行することができるが、白の二本線の標示のある路側帯を通行することはできない。", "answer": "×"}, {"set": "R5C", "num": 38, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から３年間保管しなければならない。", "answer": "○"}, {"set": "R5C", "num": 39, "question": "駆動補助機付自転車の点検整備基準においては、電動機以外の原動機を備えていてもよいとされている。", "answer": "×"}, {"set": "R5C", "num": 40, "question": "駆動補助機付自転車の電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができ、修理ができる構造でなければならない。", "answer": "×"}, {"set": "R5C", "num": 41, "question": "自転車安全整備士は、自転車の点検整備と安全利用の指導について専門的な知識と技能を持っていなければならない。", "answer": "○"}, {"set": "R5C", "num": 42, "question": "普通自転車は、フレーム、サドル、リムなどの車体・車輪部の部品、ギヤクランク、チェーンなどの駆動・制動部の部品、ハンドル、ブレーキなどの操縦部の部品、反射器材、警音器などの安全付属部の部品又はこれらと同等の機能を有するものによって構成されている。", "answer": "○"}, {"set": "R5C", "num": 43, "question": "駆動補助機付普通自転車は、道路標識等により普通自転車が通行することができるとされている歩道であっても、駆動補助機が付いているため通行することはできない。", "answer": "×"}, {"set": "R5C", "num": 44, "question": "普通自転車の部品の取付けを点検する場合、自転車の各部、特に、フレーム体、前ホーク、リムなどに著しいへこみや変形等のないことを目視で確認する。", "answer": "○"}, {"set": "R5C", "num": 45, "question": "ＴＳマークに付帯する傷害保険では、ＴＳマークが貼付されている自転車に搭乗中の人が、事故によって事故の日から１年以内に死亡又は重度後遺障害（自動車賠償責任保険の後遺障害等級の第１級から第４級までをいう。）を被った場合、一律に緑色ＴＳマークは５０万円、赤色ＴＳマークは１００万円、青色ＴＳマークは３０万円が支払われる。", "answer": "×"}, {"set": "R5C", "num": 46, "question": "児童又は幼児を保護する責任のある者は、児童又は幼児が自転車を運転するときは、当該児童又は幼児に乗車用ヘルメットを必ずかぶらせなければならない。", "answer": "×"}, {"set": "R5C", "num": 47, "question": "ＴＳマーク付帯保険の支払いの対象となる事故は、道路上で起きた交通事故だけに限られず、スーパーの駐車場や通常自転車が通行することのできる公園も含まれる。", "answer": "○"}, {"set": "R5C", "num": 48, "question": "普通自転車の部品の取付けを点検する場合、チェーンは、ギヤクランクを正・逆方向に回転させて確認し、必要な場合は整備する。", "answer": "○"}, {"set": "R5C", "num": 49, "question": "自転車は、「一時停止」の標識のあるところでは、一時停止をして、安全を確かめなければならない。", "answer": "○"}, {"set": "R5C", "num": 50, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」「酒酔い運転」などがあるが、「通行区分違反」もその対象である。", "answer": "○"}, {"set": "R5D", "num": 1, "question": "一輪車には、長さ190センチメートル、幅60センチメートルのいずれも超えない場合にはＴＳマークを貼付することができる。", "answer": "×"}, {"set": "R5D", "num": 2, "question": "普通自転車のリヤリフレクタの有効反射部は、その光軸が自転車の進行方向に対し、平行に取り付けられ、上下左右に１０°以上の傾きがあってはならず、反射部全面が後方より容易に見えることを確認する。", "answer": "×"}, {"set": "R5D", "num": 3, "question": "ＴＳマーク付帯保険の支払いの対象となる事故は、道路上で起きた交通事故に限られ、スーパーの駐車場や通常自転車が通行することができる公園は含まれない。", "answer": "×"}, {"set": "R5D", "num": 4, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、ねじはより強く締めるほうがよい。", "answer": "×"}, {"set": "R5D", "num": 5, "question": "普通自転車の運転者が１３歳未満の子供又は７０歳以上のお年寄りの場合に限り、自転車歩道通行可の標識や標示のない歩道でも、普通自転車に乗車したまま通行することができる。", "answer": "×"}, {"set": "R5D", "num": 6, "question": "ＴＳマーク付帯保険の支払いの対象となる事故には、業務中の事故は含まれない。", "answer": "×"}, {"set": "R5D", "num": 7, "question": "駆動補助機付普通自転車は、道路標識等により普通自転車が通行することができるとされている歩道であっても、駆動補助機が付いているため通行することはできない。", "answer": "×"}, {"set": "R5D", "num": 8, "question": "スポーク張力計（スポークテンションメーター）は、適正な事業所の基準で定める工具には含まれない。", "answer": "×"}, {"set": "R5D", "num": 9, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者も同じである。", "answer": "○"}, {"set": "R5D", "num": 10, "question": "ＴＳマーク付帯保険の有効期間は、ＴＳマークに記載された点検基準日から１年間である。ＴＳマークには、点検基準日及び自転車安全整備士の登録番号を記載しなければならない。", "answer": "○"}, {"set": "R5D", "num": 11, "question": "駆動補助機付自転車は、発進、加速、定速（定常）、減速、惰行及び停止の各運転態様を組み合わせて走行させた場合、各運転態様のつながりが円滑であれば、時間応答性は速やかでなくてもよい。", "answer": "×"}, {"set": "R5D", "num": 12, "question": "自転車活用推進法は、国民に広く自転車の活用の推進と理解を深めるため、自転車の日を５月４日、自転車月間を５月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "R5D", "num": 13, "question": "普通自転車のブレーキレバーの位置は、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。", "answer": "×"}, {"set": "R5D", "num": 14, "question": "普通自転車の尾灯の性能については、自転車に備え付けられた場合において、夜間後方１００ｍの距離から、その灯光を容易に確認できることとされている。", "answer": "○"}, {"set": "R5D", "num": 15, "question": "自転車安全整備店に自転車安全整備士がいなくなった場合、登録の効力が失われる。", "answer": "○"}, {"set": "R5D", "num": 16, "question": "普通自転車の部品の取付けを点検する場合、チェーンは、ギヤクランクを正方向に回転させて確認し、必要な場合は整備する。", "answer": "×"}, {"set": "R5D", "num": 17, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、前方の安全を確認するためのものであるから、街灯がある場合は、ライトを点灯して走行しなくてもよい。", "answer": "×"}, {"set": "R5D", "num": 18, "question": "ワイヤカッタ、ニッパ、プライヤは、自転車安全整備店が備え付ける工具であるが、この中でブレーキワイヤを切断する際、最も適している工具は、ワイヤカッタである。", "answer": "○"}, {"set": "R5D", "num": 19, "question": "自転車の中には、ブレーキやベルの装置のないものや故障または整備されていないなど、不備があるまま使用されていることがある。安全に運転するためには、整備された自転車に乗ること、そのためには、自転車の手入れや簡単な修理ができるようにしておくことが必要である。", "answer": "○"}, {"set": "R5D", "num": 20, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から１年間保管しなければならない。", "answer": "×"}, {"set": "R5D", "num": 21, "question": "児童又は幼児を保護する責任のある者は、児童又は幼児が自転車を運転するときは、当該児童又は幼児に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "R5D", "num": 22, "question": "普通自転車の警音器(ベル)の性能を点検する場合、１０ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "×"}, {"set": "R5D", "num": 23, "question": "ＴＳマークの更新の場合の付帯保険の開始日については、保険の有効期間満了日の前一か月間の「更新期間」の間に更新すれば、前の保険の満了日の翌日となる。", "answer": "○"}, {"set": "R5D", "num": 24, "question": "普通自転車の点検整備マニュアルにおけるブレーキの点検項目は、ブレーキの大きな遊び、ブレーキレバーの固すぎ、ブレーキレバーの戻り不良、ブレーキの片利き、片当たり、ブレーキの利きすぎ、ブレーキブロックの取り付け位置のずれ及び摩耗の6点である。", "answer": "×"}, {"set": "R5D", "num": 25, "question": "自転車に荷物を積むときは、視野を妨げるなど運転の支障となったり、片寄って自転車の安定が悪くならないよう、前カゴや荷台に固定するとともに、歩行者などの迷惑にならないように注意する。", "answer": "○"}, {"set": "R5D", "num": 26, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、徐行しなければならない。", "answer": "×"}, {"set": "R5D", "num": 27, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店で、５年ごとに登録更新を受けなければならない。", "answer": "×"}, {"set": "R5D", "num": 28, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」「酒酔い運転」などがあるが、「通行区分違反」はその対象ではない。", "answer": "×"}, {"set": "R5D", "num": 29, "question": "普通自転車は、フレーム、サドル、リムなどの車体・車輪部の部品、ギヤクランク、チェーンなどの駆動・制動部の部品、ハンドル、ブレーキなどの操縦部の部品、反射器材、警音器などの安全付属部の部品又はこれらと同等の機能を有するものによって構成されている。", "answer": "×"}, {"set": "R5D", "num": 30, "question": "ＴＳマーク付帯保険の支払いを受けられる者は、自転車に搭乗中の所有者に限られるので、所有者から借用して搭乗している人は支払対象者に含まれない。", "answer": "×"}, {"set": "R5D", "num": 31, "question": "前ホークステムとハンドルステムの固定を調べるには、自転車の前から両脚で車輪を挟み、両手でハンドルバーを握って水平方向に左右に回したときに、動かないか確認する。", "answer": "○"}, {"set": "R5D", "num": 32, "question": "道路交通法は、過労、病気、薬物その他の理由により正常な運転ができない状態で自動車を運転することを禁止している。自転車の場合も、自動車と同じように過労、病気、薬物その他の理由により正常な運転ができない状態で運転することを禁止している。", "answer": "○"}, {"set": "R5D", "num": 33, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車等を利用する者は、自転車等駐車場以外の場所に自転車等を放置してはならない。」として、自転車利用者の責務を定めている。", "answer": "×"}, {"set": "R5D", "num": 34, "question": "自転車が、信号機や道路標識・標示、その他の交通状況によって、徐行したり、停止したりする場合には、静かに前輪のブレーキをかけてスピードを加減するようにする。みだりに急ブレーキをかけると、後から来る車に衝突されたり、スリップして転倒したりする危険があるから注意する。", "answer": "×"}, {"set": "R5D", "num": 35, "question": "普通自転車のブレーキレバーは、手を用いて容易に操作できる位置にあることが求められる。また、後写鏡を装備する場合は、運転操作を妨げず、かつ、歩行者等に危害を及ばさないよう装備されていることが求められる。", "answer": "○"}, {"set": "R5D", "num": 36, "question": "自転車は、信号機のある交差点を右折する場合、対面する信号が赤で、右折用の青の矢印が表示されていても、自動車と同じ方法で右折することはできない。", "answer": "○"}, {"set": "R5D", "num": 37, "question": "普通自転車の車輪を点検する場合、スポークの張力の緩いものは、締め付ける等して、張力の著しいばらつきがないように調節する。", "answer": "○"}, {"set": "R5D", "num": 38, "question": "駆動補助機付自転車の点検整備基準においては、電動機以外の原動機を備えていてもよいとされている。", "answer": "×"}, {"set": "R5D", "num": 39, "question": "自転車安全整備店としての登録を受けるには、自転車安全整備士の資格を有する者が勤務していれば、自転車店の店主が自転車安全整備士の資格を有していなくてもよい。", "answer": "○"}, {"set": "R5D", "num": 40, "question": "スポークの張力を手で確認する場合には、車輪の両側について、リムの内周を概ね２等分にする2箇所ぐらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないか確認する。必要に応じてスポーク張力計を用いて測定する。", "answer": "×"}, {"set": "R5D", "num": 41, "question": "自転車は、著しく歩行者の通行を妨げる場合を除き、道路の中央から左の部分に設けられた路側帯を通行することができるが、白の二本線の標示のある路側帯を通行することはできない。", "answer": "○"}, {"set": "R5D", "num": 42, "question": "普通自転車を点検整備する場合、普通自転車の点検整備基準に示す部品構成表に掲げる部品等で構成されていることを目視により確認し、不足又は破損している場合は、普通自転車の点検整備基準の構造及び性能の基準等に適合する部品を補充する。", "answer": "○"}, {"set": "R5D", "num": 43, "question": "駆動補助機付自転車の電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に改造のできない構造でなければならない。", "answer": "○"}, {"set": "R5D", "num": 44, "question": "自転車安全整備士は、自転車の安全利用の指導について、専門的な知識と技能を持つ必要はない。", "answer": "×"}, {"set": "R5D", "num": 45, "question": "普通自転車の制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R5D", "num": 46, "question": "普通自転車の車体の大きさは、道路交通法令では、長さ１９０㎝、幅６５㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれがある突出部がないこととされている。", "answer": "×"}, {"set": "R5D", "num": 47, "question": "警察官が手信号や灯火による信号により交通整理を行っている場合、この手信号や灯火による信号が信号機の信号と違っていても、その警察官の信号に従わなければならない。", "answer": "○"}, {"set": "R5D", "num": 48, "question": "自転車は、「一時停止」の標識のあるところであっても、自動車と異なり、安全を確かめれば一時停止をしなくてもよい。", "answer": "×"}, {"set": "R5D", "num": 49, "question": "自転車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて道路の左側に寄って一時停止しなければならない。しかし、一方通行の道路で左側に寄ると、かえって緊急自動車の通行を妨げる場合は、右側に寄る。", "answer": "○"}, {"set": "R5D", "num": 50, "question": "ＴＳマークに付帯する傷害保険では、ＴＳマークが貼付されている自転車に搭乗中の人が、事故によって事故の日から１８０日以内に死亡又は重度後遺障害（自動車賠償責任保険の後遺障害等級の第１級から第４級までをいう。）を被った場合、一律に緑色ＴＳマークは５０万円、赤色ＴＳマークは１００万円、青色ＴＳマークは３０万円が支払われる。", "answer": "○"}, {"set": "R5E", "num": 1, "question": "ＴＳマーク付帯保険の有効期間は、ＴＳマークに記載された点検基準日から１年間である。ＴＳマークには、点検基準日及び自転車安全整備士の登録番号を記載しなければならない。", "answer": "○"}, {"set": "R5E", "num": 2, "question": "普通自転車の車体の大きさは、道路交通法令では、長さ１９０㎝、幅６５㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれがある突出部がないこととされている。", "answer": "×"}, {"set": "R5E", "num": 3, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、一時停止しなければならない。", "answer": "○"}, {"set": "R5E", "num": 4, "question": "警察官が手信号や灯火による信号により交通整理を行っている場合、この手信号や灯火による信号が信号機の信号と違っていても、その警察官の信号に従わなければならない。", "answer": "○"}, {"set": "R5E", "num": 5, "question": "タイヤのサイドウォールに「700×32C」とあるタイヤはHEタイヤで仏式サイズ表示である。", "answer": "×"}, {"set": "R5E", "num": 6, "question": "ＴＳマーク付帯保険の支払いの対象となる事故には、業務中の事故は含まれない。", "answer": "×"}, {"set": "R5E", "num": 7, "question": "前ホークステムとハンドルステムの固定を調べるには、自転車の前から両脚で車輪を挟み、両手でハンドルバーを握って水平方向に左右に回したときに、動かないか確認する。", "answer": "○"}, {"set": "R5E", "num": 8, "question": "普通自転車の点検整備マニュアルにおけるブレーキの点検項目は、ブレーキの大きな遊び、ブレーキレバーの固すぎ、ブレーキレバーの戻り不良、ブレーキの片利き、片当たり、ブレーキの利きすぎ、ブレーキブロックの取り付け位置のずれ及び摩耗の6点である。", "answer": "×"}, {"set": "R5E", "num": 9, "question": "ＴＳマーク付帯保険の支払いを受けられる者は、自転車の所有者である必要はなく、所有者から借用して搭乗している人も支払対象者に含まれる。", "answer": "○"}, {"set": "R5E", "num": 10, "question": "ワイヤカッタ、ニッパ、プライヤは、自転車安全整備店が備え付ける工具であるが、この中でブレーキワイヤを切断する際、最も適している工具は、ワイヤカッタである。", "answer": "○"}, {"set": "R5E", "num": 11, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人や車両等に自転車が走っていることを知らせるためのものでもある。", "answer": "○"}, {"set": "R5E", "num": 12, "question": "一輪車には、長さ190センチメートル、幅60センチメートルのいずれも超えない場合にはＴＳマークを貼付することができる。", "answer": "×"}, {"set": "R5E", "num": 13, "question": "普通自転車の尾灯の性能については、自転車に備え付けられた場合において、夜間後方１００ｍの距離から、その灯光を容易に確認できることとされている。", "answer": "○"}, {"set": "R5E", "num": 14, "question": "自転車が、信号機や道路標識・標示、その他の交通状況によって、徐行したり、停止したりする場合には、静かに前輪のブレーキをかけてスピードを加減するようにする。みだりに急ブレーキをかけると、後から来る車に衝突されたり、スリップして転倒したりする危険があるから注意する。", "answer": "×"}, {"set": "R5E", "num": 15, "question": "普通自転車のブレーキレバーの位置は、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の頭頂部より下方にする。", "answer": "×"}, {"set": "R5E", "num": 16, "question": "自転車安全整備店としての登録を受けるには、自転車安全整備士の資格を有する者が勤務していれば、自転車店の店主が自転車安全整備士の資格を有していなくてもよい。", "answer": "○"}, {"set": "R5E", "num": 17, "question": "駆動補助機付自転車は、発進、加速、定速（定常）、減速、惰行及び停止の各運転態様を組み合わせて走行させた場合、各運転態様のつながりが円滑で、時間応答性が速やかでなくてはならない。", "answer": "○"}, {"set": "R5E", "num": 18, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」「酒酔い運転」などがあるが、「通行区分違反」もその対象である。", "answer": "○"}, {"set": "R5E", "num": 19, "question": "自転車に荷物を積むときは、視野を妨げるなど運転の支障となったり、片寄って自転車の安定が悪くならないよう、前カゴや荷台に固定するとともに、歩行者などの迷惑にならないように注意する。", "answer": "○"}, {"set": "R5E", "num": 20, "question": "防犯登録は、自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律により、努力義務化されている。", "answer": "×"}, {"set": "R5E", "num": 21, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店で、５年ごとに登録更新を受けなければならない。", "answer": "×"}, {"set": "R5E", "num": 22, "question": "普通自転車の制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R5E", "num": 23, "question": "普通自転車は、フレーム、サドル、リムなどの車体・車輪部の部品、ギヤクランク、チェーンなどの駆動・制動部の部品、ハンドル、ブレーキなどの操縦部の部品、反射器材、警音器などの安全付属部の部品又はこれらと同等の機能を有するものによって構成されている。", "answer": "×"}, {"set": "R5E", "num": 24, "question": "児童又は幼児を保護する責任のある者は、児童又は幼児が自転車を運転するときは、当該児童又は幼児に乗車用ヘルメットを必ずかぶらせなければならない。", "answer": "×"}, {"set": "R5E", "num": 25, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R5E", "num": 26, "question": "駆動補助機付普通自転車は、道路標識等により普通自転車が通行することができるとされている歩道であっても、駆動補助機が付いているため通行することはできない。", "answer": "×"}, {"set": "R5E", "num": 27, "question": "自転車は、「一時停止」の標識のあるところであっても、自動車と異なり、安全を確かめれば一時停止をしなくてもよい。", "answer": "×"}, {"set": "R5E", "num": 28, "question": "ＴＳマークに付帯する傷害保険では、ＴＳマークが貼付されている自転車に搭乗中の人が、事故によって事故の日から１８０日以内に死亡又は重度後遺障害（自動車賠償責任保険の後遺障害等級の第１級から第４級までをいう。）を被った場合、一律に緑色ＴＳマークは５０万円、赤色ＴＳマークは１００万円、青色ＴＳマークは３０万円が支払われる。", "answer": "○"}, {"set": "R5E", "num": 29, "question": "普通自転車の警音器(ベル)の性能を点検する場合、１０ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "×"}, {"set": "R5E", "num": 30, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、ねじはより強く締めるほうがよい。", "answer": "×"}, {"set": "R5E", "num": 31, "question": "自転車は、信号機のある交差点を右折する場合、対面する信号が赤や黄色であっても、右折用の青の矢印が表示されていれば、自動車と同じ方法で右折することができる。", "answer": "×"}, {"set": "R5E", "num": 32, "question": "スポーク張力計（スポークテンションメーター）は、適正な事業所の基準で定める工具に含まれる。", "answer": "○"}, {"set": "R5E", "num": 33, "question": "自転車安全整備士は、自転車の安全利用の指導について、専門的な知識と技能を持つ必要はない。", "answer": "×"}, {"set": "R5E", "num": 34, "question": "駆動補助機付自転車の点検整備基準においては、電動機以外の原動機を備えていないこととされている。", "answer": "○"}, {"set": "R5E", "num": 35, "question": "ＴＳマークの更新の場合の付帯保険の開始日については、保険の有効期間満了日の前一か月間の「更新期間」の間に更新すれば、前の保険の満了日の翌日となる。", "answer": "○"}, {"set": "R5E", "num": 36, "question": "普通自転車の部品の取付けを点検する場合、チェーンは、ギヤクランクを逆方向に回転させて確認し、必要な場合は整備する。", "answer": "×"}, {"set": "R5E", "num": 37, "question": "自転車は、著しく歩行者の通行を妨げる場合を除き、道路の中央から左の部分に設けられた路側帯を通行することができるが、白の二本線の標示のある路側帯を通行することはできない。", "answer": "○"}, {"set": "R5E", "num": 38, "question": "駆動補助機付自転車の電源スイッチ、電池、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができない構造でなければならない。", "answer": "×"}, {"set": "R5E", "num": 39, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者にはその義務までは課されていない。", "answer": "×"}, {"set": "R5E", "num": 40, "question": "ＴＳマーク付帯保険の支払いの対象となる事故は、道路上で起きた交通事故に限られ、スーパーの駐車場や通常自転車が通行することができる公園は含まれない。", "answer": "×"}, {"set": "R5E", "num": 41, "question": "普通自転車を点検整備する場合、普通自転車の点検整備基準に示す部品構成表に掲げる部品等で構成されていることを目視により確認し、不足又は破損している場合は、普通自転車の点検整備基準の構造及び性能の基準等に適合する部品を補充する。", "answer": "○"}, {"set": "R5E", "num": 42, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車等を利用する者は、自転車等駐車場以外の場所に自転車等を放置してはならない。」として、自転車利用者の責務を定めている。", "answer": "×"}, {"set": "R5E", "num": 43, "question": "普通自転車のブレーキレバーは、手を用いて容易に操作できる位置にあることが求められる。また、後写鏡を装備する場合は、運転操作を妨げず、かつ、歩行者等に危害を及ばさないよう装備されていることが求められる。", "answer": "○"}, {"set": "R5E", "num": 44, "question": "ＴＳマーク付帯保険の賠償責任補償は、同居の親族・同乗者に対する賠償事故及び対物損害も対象としている。", "answer": "×"}, {"set": "R5E", "num": 45, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から３年間保管しなければならない。", "answer": "○"}, {"set": "R5E", "num": 46, "question": "普通自転車の車輪を点検する場合、スポークの張力の緩いものは、締め付ける等して、張力の著しいばらつきがないように調節する。", "answer": "○"}, {"set": "R5E", "num": 47, "question": "自転車の中には、ブレーキやベルの装置のないものや故障または整備されていないなど、不備があるまま使用されていることがある。安全に運転するためには、整備された自転車に乗ること、そのためには、自転車の手入れや簡単な修理ができるようにしておくことが必要である。", "answer": "○"}, {"set": "R5E", "num": 48, "question": "自転車安全整備店に自転車安全整備士がいなくなった場合、登録の効力が失われる。", "answer": "○"}, {"set": "R5E", "num": 49, "question": "普通自転車のリヤリフレクタの有効反射部は、その光軸が自転車の進行方向に対し、平行に取り付けられ、上下左右に５°以上の傾きがあってはならず、反射部全面が後方より容易に見えることを確認する。", "answer": "○"}, {"set": "R5E", "num": 50, "question": "道路交通法は、過労、病気、薬物その他の理由により正常な運転ができない状態で自動車を運転することを禁止している。自転車の場合も、自動車と同じように過労、病気、薬物その他の理由により正常な運転ができない状態で運転することを禁止している。", "answer": "○"}, {"set": "R5F", "num": 1, "question": "ＴＳマークに付帯する傷害保険では、ＴＳマークが貼付されている自転車に搭乗中の人が、事故によって事故の日から１８０日以内に死亡又は重度後遺障害（自動車賠償責任保険の後遺障害等級の第１級から第７級までをいう。）を被った場合、一律に緑色ＴＳマークは５０万円、赤色ＴＳマークは１００万円、青色ＴＳマークは３０万円が支払われる。", "answer": "×"}, {"set": "R5F", "num": 2, "question": "普通自転車の車輪を点検する場合、スポークの張力の緩いものは、締め付ける等して、張力の著しいばらつきがないように調節する。", "answer": "○"}, {"set": "R5F", "num": 3, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、前方の安全を確認するためのものであるから、街灯がある場合は、ライトを点灯して走行しなくてもよい。", "answer": "×"}, {"set": "R5F", "num": 4, "question": "普通自転車の警音器(ベル)の性能を点検する場合、１０ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "×"}, {"set": "R5F", "num": 5, "question": "自転車の中には、ブレーキやベルの装置のないものや故障または整備されていないなど、不備があるまま使用されていることがある。安全に運転するためには、整備された自転車に乗ること、そのためには、自転車の手入れや簡単な修理ができるようにしておくことが必要である。", "answer": "○"}, {"set": "R5F", "num": 6, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、各ねじ部の緩みを丁寧に点検し、ねじの緩んだ箇所の増し締めを行い、整備する。", "answer": "○"}, {"set": "R5F", "num": 7, "question": "普通自転車の車体の大きさは、道路交通法令では、長さ２００㎝、幅６０㎝を超えないこととされており、また、車体の構造の要件の１つとして歩行者に危害を及ぼすおそれがある突出部がないこととされている。", "answer": "×"}, {"set": "R5F", "num": 8, "question": "自転車は、著しく歩行者の通行を妨げる場合を除き、道路の中央から左の部分に設けられた路側帯を通行することができるが、白の二本線の標示のある路側帯を通行することはできない。", "answer": "×"}, {"set": "R5F", "num": 9, "question": "自転車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて道路の左側に寄って一時停止しなければならない。しかし、一方通行の道路で左側に寄ると、かえって緊急自動車の通行を妨げる場合は、右側に寄る。", "answer": "○"}, {"set": "R5F", "num": 10, "question": "駆動補助機付普通自転車は、道路標識等により普通自転車が通行することができるとされている歩道であっても、駆動補助機が付いているため通行することはできない。", "answer": "×"}, {"set": "R5F", "num": 11, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車等を利用する者は、自転車等駐車場以外の場所に自転車等を放置してはならない。」として、自転車利用者の責務を定めている。", "answer": "×"}, {"set": "R5F", "num": 12, "question": "自転車は、信号機のある交差点を右折する場合、対面する信号が赤で、右折用の青の矢印が表示されていても、自動車と同じ方法で右折することはできない。", "answer": "○"}, {"set": "R5F", "num": 13, "question": "普通自転車の尾灯の性能については、自転車に備え付けられた場合において、夜間後方１００ｍの距離から、その灯光を容易に確認できることとされている。", "answer": "○"}, {"set": "R5F", "num": 14, "question": "駆動補助機付自転車の電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に改造のできない構造でなければならない。", "answer": "○"}, {"set": "R5F", "num": 15, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」「酒酔い運転」などがあるが、「通行区分違反」はその対象ではない。", "answer": "×"}, {"set": "R5F", "num": 16, "question": "自転車に荷物を積むときは、視野を妨げるなど運転の支障となったり、片寄って自転車の安定が悪くならないよう、前カゴや荷台に固定するとともに、歩行者などの迷惑にならないように注意する。", "answer": "○"}, {"set": "R5F", "num": 17, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から１年間保管しなければならない。", "answer": "×"}, {"set": "R5F", "num": 18, "question": "普通自転車のリヤリフレクタの有効反射部は、その光軸が自転車の進行方向に対し、平行に取り付けられ、上下左右に１０°以上の傾きがあってはならず、反射部全面が後方より容易に見えることを確認する。", "answer": "×"}, {"set": "R5F", "num": 19, "question": "普通自転車の点検整備マニュアルにおけるブレーキの点検項目は、ブレーキの大きな遊び、ブレーキレバーの固すぎ、ブレーキレバーの戻り不良、ブレーキの片利き、片当たり、ブレーキの利きの甘さ、ブレーキブロックの取り付け位置のずれ及び摩耗の6点である。", "answer": "○"}, {"set": "R5F", "num": 20, "question": "自転車に乗車して信号機のない交差点を右に曲がるときは、後方の安全を確かめ、交差点の中心を通るなど最短距離で交差点の向こう側まで進むようにする。", "answer": "×"}, {"set": "R5F", "num": 21, "question": "普通自転車のブレーキレバーは、手を用いて容易に操作できる位置にあることが求められる。また、後写鏡を装備する場合は、後方の安全確認が容易にできる位置にあればよい。", "answer": "×"}, {"set": "R5F", "num": 22, "question": "ＴＳマーク付帯保険の支払いを受けられる者は、自転車の所有者である必要はなく、所有者から借用して搭乗している人も支払対象者に含まれる。", "answer": "○"}, {"set": "R5F", "num": 23, "question": "駆動補助機付自転車は、発進、加速、定速（定常）、減速、惰行及び停止の各運転態様を組み合わせて走行させた場合、各運転態様のつながりが円滑であれば、時間応答性は速やかでなくてもよい。", "answer": "×"}, {"set": "R5F", "num": 24, "question": "自転車安全整備店は、ＴＳマークを取り扱うことができる自転車店として、公益財団法人日本交通管理技術協会の登録を受けている自転車店で、５年ごとに登録更新を受けなければならない。", "answer": "○"}, {"set": "R5F", "num": 25, "question": "普通自転車を点検整備する場合、普通自転車の点検整備基準に示す部品構成表に掲げる部品等で構成されていることを目視により確認し、不足又は破損している場合は、普通自転車の点検整備基準の構造及び性能の基準等に適合する部品を補充する。", "answer": "○"}, {"set": "R5F", "num": 26, "question": "道路交通法は、過労、病気、薬物その他の理由により正常な運転ができない状態で自動車を運転することを禁止しているが、自転車については運転しないよう努めなければならないとしている。", "answer": "×"}, {"set": "R5F", "num": 27, "question": "普通自転車のブレーキレバーの位置は、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。", "answer": "○"}, {"set": "R5F", "num": 28, "question": "一輪車には、長さ190センチメートル、幅60センチメートルのいずれも超えない場合であってもＴＳマークを貼付することができない。", "answer": "○"}, {"set": "R5F", "num": 29, "question": "普通自転車の部品の取付けを点検する場合、チェーンは、ギヤクランクを正・逆方向に回転させて確認し、必要な場合は整備する。", "answer": "○"}, {"set": "R5F", "num": 30, "question": "駆動補助機付自転車のペダルに踏力が加わっていないときは、補助力が作動しないことが求められている。", "answer": "○"}, {"set": "R5F", "num": 31, "question": "普通自転車は、道路標識等により普通自転車が通行できることができるとされている歩道を通行することができる。この場合、歩行者の通行を妨げることとなるときは、ベルを鳴らして歩行者に注意を喚起し、徐行しなければならない。", "answer": "×"}, {"set": "R5F", "num": 32, "question": "自転車安全整備店としての登録を受けるには、自転車安全整備士の資格を有する者が勤務していれば、自転車店の店主が自転車安全整備士の資格を有していなくてもよい。", "answer": "○"}, {"set": "R5F", "num": 33, "question": "ＴＳマーク付帯保険の支払いの対象となる事故は、道路上で起きた交通事故だけに限られず、スーパーの駐車場や通常自転車が通行することのできる公園も含まれる。", "answer": "○"}, {"set": "R5F", "num": 34, "question": "自動車の運転者は、ぬかるみ又は水たまりを通行するときは、泥土、汚水等を飛散させて他人に迷惑を及ぼすことがないようにしなければならないが、自転車の運転者も同じである。", "answer": "○"}, {"set": "R5F", "num": 35, "question": "ＴＳマーク付帯保険の支払いの対象となる事故には、業務中の事故は含まれない。", "answer": "×"}, {"set": "R5F", "num": 36, "question": "前ホークステムとハンドルステムの固定を調べるには、自転車の前から両脚で車輪を挟み、両手でハンドルバーを握って水平方向に左右に回したときに、動かないか確認する。", "answer": "○"}, {"set": "R5F", "num": 37, "question": "自転車が、信号機や道路標識・標示、その他の交通状況によって、徐行したり、停止したりする場合には、静かに前輪のブレーキをかけてスピードを加減するようにする。みだりに急ブレーキをかけると、後から来る車に衝突されたり、スリップして転倒したりする危険があるから注意する。", "answer": "×"}, {"set": "R5F", "num": 38, "question": "自転車は、「一時停止」の標識のあるところでは、一時停止をして、安全を確かめなければならない。", "answer": "○"}, {"set": "R5F", "num": 39, "question": "警察官が手信号や灯火による信号により交通整理を行っている場合、この手信号や灯火による信号が信号機の信号と違っていても、その警察官の信号に従わなければならない。", "answer": "○"}, {"set": "R5F", "num": 40, "question": "ＴＳマークの付帯保険の有効期間は、ＴＳマークに記載された点検基準日から１年間である。ＴＳマークには点検基準日及び自転車安全整備店の登録番号を記載しなければならない。", "answer": "×"}, {"set": "R5F", "num": 41, "question": "普通自転車は、フレーム、サドル、リムなどの車体・車輪部の部品、ギヤクランク、チェーンなどの駆動・制動部の部品、ハンドル、ブレーキなどの操縦部の部品、反射器材、警音器などの安全付属部の部品又はこれらと同等の機能を有するものによって構成されている。", "answer": "×"}, {"set": "R5F", "num": 42, "question": "駆動補助機付自転車の点検整備基準においては、電動機以外の原動機を備えていてもよいとされている。", "answer": "×"}, {"set": "R5F", "num": 43, "question": "ＴＳマークの更新の場合の付帯保険の開始日については、保険の有効期間満了日の前一か月間の「更新期間」の間に更新すれば、前の保険の満了日の翌日となる。", "answer": "○"}, {"set": "R5F", "num": 44, "question": "防犯登録は法律で登録することが義務付けられているが、防犯登録がなされていない普通自転車にも、防犯登録とは制度が異なることから、ＴＳマークを貼付することはできる。", "answer": "○"}, {"set": "R5F", "num": 45, "question": "ワイヤカッタ、ニッパ、プライヤは、自転車安全整備店が備え付ける工具であるが、この中でブレーキワイヤを切断する際、最も適している工具は、ワイヤカッタである。", "answer": "○"}, {"set": "R5F", "num": 46, "question": "自転車安全整備店に自転車安全整備士がいなくなった場合、登録の効力が失われる。", "answer": "○"}, {"set": "R5F", "num": 47, "question": "児童又は幼児を保護する責任のある者は、児童又は幼児が自転車を運転するときは、当該児童又は幼児に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "R5F", "num": 48, "question": "スポーク張力計（スポークテンションメーター）は、適正な事業所の基準で定める工具には含まれない。", "answer": "×"}, {"set": "R5F", "num": 49, "question": "自転車安全整備士は、自転車の点検整備と安全利用の指導について専門的な知識と技能を持っていなければならない。", "answer": "○"}, {"set": "R5F", "num": 50, "question": "普通自転車の制動性能は、乾燥した平坦な舗装道路において、走行速度が１５㎞／ｈのとき制動操作を開始した場所から５ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "×"}, {"set": "R7A", "num": 1, "question": "自転車は、信号機などにより交通整理の行われていない交差点（環状交差点を除く）を右折するときは、後方の安全を確かめ、できる限り道路の左端に寄って、交差点の向こう側まで直進し、さらに安全確認を行い、十分速度を落として曲がらなければならない。", "answer": "○"}, {"set": "R7A", "num": 2, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね３等分する３カ所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "○"}, {"set": "R7A", "num": 3, "question": "自転車タイヤのサイドウオールの数字が〔２６×１．９５〕である場合、そのタイヤはＨＥタイヤである。", "answer": "○"}, {"set": "R7A", "num": 4, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて、原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R7A", "num": 5, "question": "普通自転車は、サドル、タイヤ等の車体・車輪部の部品、チェーン、ブレーキ等の駆動・制動部の部品、ハンドル等の操縦部の部品、尾灯、警音器等の安全付属部の部品又はこれらと同等の機能を有するものにより構成されている。", "answer": "○"}, {"set": "R7A", "num": 6, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車の小売りを業とする者は、自転車の販売にあたっては、当該自転車の取扱方法、定期的な点検の必要性等の自転車の安全利用のための十分な情報を提供するとともに、防犯登録の勧奨並びに自転車の点検及び修理業務の充実に努めなければならない。」と規定されている。", "answer": "○"}, {"set": "R7A", "num": 7, "question": "自転車安全利用５則は、①車道が原則・左側を通行・歩道は例外・歩行者を優先、②交差点では信号と一時停止を守って・安全確認、③夜間はライトを点灯、④飲酒運転は禁止、⑤ヘルメットを着用の５つである。", "answer": "○"}, {"set": "R7A", "num": 8, "question": "自転車安全整備店としての登録を受けるには、自転車店の店主が自転車安全整備士の資格を有していなければならない。", "answer": "×"}, {"set": "R7A", "num": 9, "question": "自転車活用推進法では、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を１０月の体育の日、自転車月間を１０月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "R7A", "num": 10, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、高い安全性を備えた良質な自転車の供給体制の整備が明記されている。", "answer": "○"}, {"set": "R7A", "num": 11, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から３年間保管しなければならない。", "answer": "○"}, {"set": "R7A", "num": 12, "question": "防犯登録は法律で登録することが義務付けられており、防犯登録がなされていない自転車には、ＴＳマークを貼付することはできない。", "answer": "×"}, {"set": "R7A", "num": 13, "question": "自転車に乗るときは、自動車の運転者や歩行者などから見やすいように、できるだけ明るい目立つ色の衣服を着用したり、反射器材を使用する。", "answer": "○"}, {"set": "R7A", "num": 14, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができ、修理ができる構造であることとされている。", "answer": "×"}, {"set": "R7A", "num": 15, "question": "自転車の運転者は、他人を当該自転車に乗車させるときは、当該他人に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "R7A", "num": 16, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポスト関係で固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "R7A", "num": 17, "question": "緑色ＴＳマーク付帯保険の賠償責任保障の支払いの対象は、死亡又は重度後遺障害（１～７級）である。", "answer": "×"}, {"set": "R7A", "num": 18, "question": "自転車は、車両であるから常に車両用の信号機に従わなければならない。", "answer": "×"}, {"set": "R7A", "num": 19, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行かつ水平に、幅はフレーム中心面に垂直かつ水平にそれぞれ最長部を測定するが、どろよけ、スタンド、キャリヤ、後写鏡などの部品を含めて測定する。", "answer": "○"}, {"set": "R7A", "num": 20, "question": "自転車安全整備店として登録を受けた自転車店は、貸与された「自転車安全整備店章」を事業所の見やすい場所に掲出しなければならない。", "answer": "○"}, {"set": "R7A", "num": 21, "question": "ＴＳマーク付帯保険の支払対象となる事故には、自転車を押し歩いている場合の事故は含まれない。", "answer": "×"}, {"set": "R7A", "num": 22, "question": "自動車の運転者は、危険を防止するためやむを得ない場合を除き、その自動車を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならないが、自転車についてはこの限りではない。", "answer": "×"}, {"set": "R7A", "num": 23, "question": "車道の左側を普通自転車に乗って運転中、前方の道路で工事をしているときは、車道の左側を安全に通行することができる場合であっても、歩道を通行してよい。", "answer": "×"}, {"set": "R7A", "num": 24, "question": "ナットドライバーは、適正な事業所の基準で定める工具に含まれない。", "answer": "○"}, {"set": "R7A", "num": 25, "question": "適正な事業所の基準で定める工具のうち、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "R7A", "num": 26, "question": "幼児二人同乗用自転車にも、普通自転車に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"}, {"set": "R7A", "num": 27, "question": "自転車安全整備店の登録の有効期間は、登録を受けた日から３年を経過した日以降の１２月３１日又は６月３０日のいずれか早い日が経過するまでの期間である。", "answer": "×"}, {"set": "R7A", "num": 28, "question": "自転車安全整備店が次のいずれかに該当することとなったときは、登録を取り消すことができる。（１）適正な事業所の基準に適合しなくなったとき。（２）正当な理由がないのに１年以上点検整備済ＴＳマークの取扱いをしなかったとき。（３）点検整備済ＴＳマークを不適正に貼付したとき。（４）登録者としての信用を失墜させる行為をしたとき。", "answer": "○"}, {"set": "R7A", "num": 29, "question": "普通自転車の車輪を点検する場合、著しいへこみや変形等のないこと、スポークの張力及び前車輪の固定の３点を確認する。", "answer": "×"}, {"set": "R7A", "num": 30, "question": "普通自転車の点検整備基準においては、制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R7A", "num": 31, "question": "自転車の点検及び整備を行うための作業場が１０平方メートル以上確保されていること、当該作業場は、道路から容易に自転車を持ち込めるものであること、自転車の点検整備のため、規程に定められた工具を備え付けていれば、自転車安全整備店として登録するための適正な事業所の基準を満たしている。", "answer": "×"}, {"set": "R7A", "num": 32, "question": "自転車の部品は、正しく取り付けられ、かつ、確実に固定され、各部が正常に作動することが必要である。普通自転車の点検整備マニュアルにおいては、やぐらを使っているシートポストとサドルの固定については、サドルの前と後に両手をかけ、サドルを水平方向に回す力を加えたときに、動かなければよい。", "answer": "×"}, {"set": "R7A", "num": 33, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、一時停止しなければならない。", "answer": "○"}, {"set": "R7A", "num": 34, "question": "自転車に乗って道路を横断しようとするとき、近くに自転車横断帯も横断歩道もない場合には、右左の見通しのよいところを選んで、自動車が来ないことを確認し､直角にわたる。", "answer": "○"}, {"set": "R7A", "num": 35, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないため、道路のどこに駐車しても支障はないので、駐車禁止の対象となっていない。", "answer": "×"}, {"set": "R7A", "num": 36, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人に自転車が走っていることを知らせるためのものでもあるので、原則として夜間にライトをつけずに走行してはならない。", "answer": "○"}, {"set": "R7A", "num": 37, "question": "駆動補助機付自転車の点検整備基準においては、ペダルに踏力が加わっていないときは、原動機による補助力が作動しないこととされている。", "answer": "○"}, {"set": "R7A", "num": 38, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に備え付けられた場合において、定められた基準に適合する前照灯で照射したときに、夜間後方５０メートルの距離から、反射光を照射位置から容易に確認できること、反射光の色は、橙色又は赤色であることが必要である。", "answer": "×"}, {"set": "R7A", "num": 39, "question": "酒気を帯びて自転車を運転した者、酒気を帯びている者に自転車を提供した者は処罰の対象となるが、酒気を帯びて自転車を運転するおそれのある者に酒を提供しただけでは処罰の対象とならない。", "answer": "×"}, {"set": "R7A", "num": 40, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で片足の踏力をペダルにかけたとき、後車輪が回らないことを確認する。", "answer": "×"}, {"set": "R7A", "num": 41, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」などがあるが、「普通自転車の歩道通行時の通行方法違反」もその対象である。", "answer": "○"}, {"set": "R7A", "num": 42, "question": "タイヤのバルブには、英式の「ウッズバルブ」、米式の「シュレーダーバルブ」及び仏式の「フレンチバルブ」の３種類があるが、「シュレーダーバルブ」と「フレンチバルブ」は同一のポンプの口金が使える。", "answer": "×"}, {"set": "R7A", "num": 43, "question": "自転車に乗るときは運転中、停止中であっても、スマートフォンで通話をしたり、スマートフォンの画面を注視してはならない。", "answer": "×"}, {"set": "R7A", "num": 44, "question": "普通自転車のブレーキレバーの点検整備では、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。また、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを最低位置まで下げたとき、グリップ最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、５０㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでない。", "answer": "×"}, {"set": "R7A", "num": 45, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりする。また、反対にねじを締めすぎるとボールが壊れて、走れなくなることがある。", "answer": "○"}, {"set": "R7A", "num": 46, "question": "普通自転車の車輪数は、４輪以下とされている。", "answer": "×"}, {"set": "R7A", "num": 47, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような相手の怪我が軽い自転車事故の場合でも、自動車と同様に警察官への報告義務がある｡", "answer": "○"}, {"set": "R7A", "num": 48, "question": "普通自転車の点検整備基準においては、前車輪と後車輪が、それぞれ別系統で確実に制動できること、ブレーキレバーを反復して作動した場合において、ブレーキ各部及び各取付部に異状が生じないことが必要である。", "answer": "○"}, {"set": "R7A", "num": 49, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "R7A", "num": 50, "question": "普通自転車は、普通自転車の運転者が１３歳未満の子供、７０歳以上のお年寄りの場合に限り、自転車歩道通行可の標識や標示のない歩道を通行することができる。", "answer": "×"}, {"set": "R7B", "num": 1, "question": "普通自転車は、普通自転車の運転者が１３歳未満の子供、７０歳以上のお年寄りの場合に限り、自転車歩道通行可の標識や標示のない歩道を通行することができる。", "answer": "×"}, {"set": "R7B", "num": 2, "question": "ＴＳマーク付帯保険の支払対象となる事故には、自転車を押し歩いている場合の事故は含まれない。", "answer": "×"}, {"set": "R7B", "num": 3, "question": "自転車安全整備店の登録の有効期間は、登録を受けた日から３年を経過した日以降の１２月３１日又は６月３０日のいずれか早い日が経過するまでの期間である。", "answer": "×"}, {"set": "R7B", "num": 4, "question": "自転車安全整備店が次のいずれかに該当することとなったときは、登録を取り消すことができる。（１）適正な事業所の基準に適合しなくなったとき。（２）正当な理由がないのに１年以上点検整備済ＴＳマークの取扱いをしなかったとき。（３）点検整備済ＴＳマークを不適正に貼付したとき。（４）登録者としての信用を失墜させる行為をしたとき。", "answer": "○"}, {"set": "R7B", "num": 5, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から３年間保管しなければならない。", "answer": "○"}, {"set": "R7B", "num": 6, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に取り付けられた場合、定められた基準に適合する前照灯で照射したときに、夜間後方１００メートルの距離から、反射光を照射位置から容易に確認できること、反射光の色は、橙色であることが必要である。", "answer": "×"}, {"set": "R7B", "num": 7, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて、原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R7B", "num": 8, "question": "適正な事業所の基準で定める工具のうち、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "R7B", "num": 9, "question": "普通自転車の車輪数は、４輪以下とされている。", "answer": "×"}, {"set": "R7B", "num": 10, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、徐行しなければならない。", "answer": "×"}, {"set": "R7B", "num": 11, "question": "普通自転車の制動性能としては、前車輪と後車輪が同一系統で確実に制動できること、ブレーキレバーを反復して作動した場合において、ブレーキ各部及び各取付部に異状が生じないことが必要である。", "answer": "×"}, {"set": "R7B", "num": 12, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね３等分する３カ所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "○"}, {"set": "R7B", "num": 13, "question": "自転車に乗って通行中、出会い頭に歩行者と衝突したが、怪我もかすり傷程度の軽いものであった。このような自転車事故の場合は、相手の怪我が軽いので、自動車と違い警察官への報告義務はない｡", "answer": "×"}, {"set": "R7B", "num": 14, "question": "自転車の運転者は、他人を当該自転車に乗車させるときは、当該他人に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "R7B", "num": 15, "question": "車道の左側を普通自転車に乗って運転中、前方の道路で工事をしているときは、車道の左側を安全に通行することができる場合であっても、歩道を通行してよい。", "answer": "×"}, {"set": "R7B", "num": 16, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車の小売りを業とする者は、自転車の販売にあたっては、当該自転車の取扱方法、定期的な点検の必要性等の自転車の安全利用のための十分な情報を提供するとともに、防犯登録の勧奨並びに自転車の点検及び修理業務の充実に努めなければならない。」と規定されている。", "answer": "○"}, {"set": "R7B", "num": 17, "question": "自転車に乗るときは、自動車の運転者や歩行者などから見やすいように、できるだけ明るい目立つ色の衣服を着用したり、反射器材を使用する。", "answer": "○"}, {"set": "R7B", "num": 18, "question": "自転車の部品は、正しく取り付けられ、かつ、確実に固定され、各部が正常に作動することが必要である。普通自転車の点検整備マニュアルにおいては、やぐらを使っているシートポストとサドルの固定については、サドルの前と後に両手をかけ、サドルに両手で上下の力を加えたときに、動かなければよい。", "answer": "○"}, {"set": "R7B", "num": 19, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができ、修理ができる構造であることとされている。", "answer": "×"}, {"set": "R7B", "num": 20, "question": "自転車安全整備店としての登録を受けるには、自転車店の店主が自転車安全整備士の資格を有していなければならない。", "answer": "×"}, {"set": "R7B", "num": 21, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」などがあるが、「普通自転車の歩道通行時の通行方法違反」もその対象である。", "answer": "○"}, {"set": "R7B", "num": 22, "question": "駆動補助機付自転車の点検整備基準においては、ペダルに踏力が加わっていないときでも、わずかであれば原動機による力が作動してもよいとされている。", "answer": "×"}, {"set": "R7B", "num": 23, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行かつ水平に、幅はフレーム中心面に垂直かつ水平にそれぞれ最長部を測定するが、スタンドについては含めないで測定する。", "answer": "×"}, {"set": "R7B", "num": 24, "question": "酒気を帯びて自転車を運転した者、酒気を帯びている者に自転車を提供した者は処罰の対象となるが、酒気を帯びて自転車を運転するおそれのある者に酒を提供しただけでは処罰の対象とならない。", "answer": "×"}, {"set": "R7B", "num": 25, "question": "自転車安全利用５則は、①車道が原則・左側を通行・歩道は例外・歩行者を優先、②交差点では信号と一時停止を守って・安全確認、③夜間はライトを点灯、④飲酒運転は禁止、⑤ヘルメットを着用の５つである。", "answer": "○"}, {"set": "R7B", "num": 26, "question": "自転車は、車両であるから常に車両用の信号機に従わなければならない。", "answer": "×"}, {"set": "R7B", "num": 27, "question": "普通自転車の車輪を点検する場合、著しいへこみや変形等のないこと、スポークの張力及び前車輪の固定の３点を確認する。", "answer": "×"}, {"set": "R7B", "num": 28, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で、片足で全体重をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "○"}, {"set": "R7B", "num": 29, "question": "防犯登録は法律で登録することが義務付けられており、防犯登録がなされていない自転車には、ＴＳマークを貼付することはできない。", "answer": "×"}, {"set": "R7B", "num": 30, "question": "普通自転車は、サドル、タイヤ等の車体・車輪部の部品、チェーン、ブレーキ等の駆動・制動部の部品、ハンドル等の操縦部の部品、尾灯、警音器等の安全付属部の部品又はこれらと同等の機能を有するものにより構成されている。", "answer": "○"}, {"set": "R7B", "num": 31, "question": "ナットドライバーは、適正な事業所の基準で定める工具のひとつである。", "answer": "×"}, {"set": "R7B", "num": 32, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、緩まないようにねじは強く締めるほうがよい。", "answer": "×"}, {"set": "R7B", "num": 33, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "R7B", "num": 34, "question": "自転車安全整備店として登録を受けた自転車店は、貸与された「自転車安全整備店章」を事業所の見やすい場所に掲出しなければならない。", "answer": "○"}, {"set": "R7B", "num": 35, "question": "自転車は、信号機などにより交通整理の行われていない交差点（環状交差点を除く）を右折するとき、後方の安全を確かめ、交差点の中心を通るなど最短距離で曲がらなければならない。", "answer": "×"}, {"set": "R7B", "num": 36, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポスト関係で固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "R7B", "num": 37, "question": "自転車に乗って道路を横断しようとするとき、近くに自転車横断帯も横断歩道もない場合には、右左の見通しのよいところを選んで、自動車が来ないことを確認し､直角にわたる。", "answer": "○"}, {"set": "R7B", "num": 38, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、相当な安全性を備えた安価な自転車の供給体制の整備が明記されている。", "answer": "×"}, {"set": "R7B", "num": 39, "question": "普通自転車のブレーキレバーの点検整備では、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。また、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを最低位置まで下げたとき、グリップ最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、５０㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでない。", "answer": "×"}, {"set": "R7B", "num": 40, "question": "タイヤのバルブには、英式の「ウッズバルブ」、米式の「シュレーダーバルブ」及び仏式の「フレンチバルブ」の３種類があり、それぞれに使えるポンプの口金は異なる。", "answer": "○"}, {"set": "R7B", "num": 41, "question": "普通自転車の点検整備基準においては、制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R7B", "num": 42, "question": "幼児二人同乗用自転車にも、普通自転車に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"}, {"set": "R7B", "num": 43, "question": "自動車の運転者は、危険を防止するためやむを得ない場合を除き、その自動車を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならないが、自転車についてはこの限りではない。", "answer": "×"}, {"set": "R7B", "num": 44, "question": "自転車の点検及び整備を行うための作業場が５平方メートル以上確保されていること、当該作業場は、道路から容易に自転車を持ち込めるものであること、自転車の点検整備のため、規程に定められた工具を備え付けていれば自転車安全整備店として登録するための適正な事業所の基準を満たしている。", "answer": "○"}, {"set": "R7B", "num": 45, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないため、道路のどこに駐車しても支障はないので、駐車禁止の対象となっていない。", "answer": "×"}, {"set": "R7B", "num": 46, "question": "自転車タイヤのサイドウオールの数字が〔２６×１．９５〕である場合、そのタイヤはＨＥタイヤである。", "answer": "○"}, {"set": "R7B", "num": 47, "question": "自転車活用推進法では、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を５月５日、自転車月間を５月１日から同月３１日までと定めている。", "answer": "○"}, {"set": "R7B", "num": 48, "question": "緑色ＴＳマーク付帯保険の賠償責任保障の支払いの対象は、死亡又は身体の傷害である。", "answer": "○"}, {"set": "R7B", "num": 49, "question": "自転車は、夜間であっても、街灯がある場合は、ライトを点灯して走行しなくてもよい。", "answer": "×"}, {"set": "R7B", "num": 50, "question": "自転車に乗るときは運転中、停止中であっても、スマートフォンで通話をしたり、スマートフォンの画面を注視してはならない。", "answer": "×"}, {"set": "R7C", "num": 1, "question": "自転車安全整備店が次のいずれかに該当することとなったときは、登録を取り消すことができる。（１）適正な事業所の基準に適合しなくなったとき。（２）正当な理由がないのに１年以上点検整備済ＴＳマークの取扱いをしなかったとき。（３）点検整備済ＴＳマークを不適正に貼付したとき。（４）登録者としての信用を失墜させる行為をしたとき。", "answer": "○"}, {"set": "R7C", "num": 2, "question": "普通自転車は、普通自転車の運転者が１３歳未満の子供、７０歳以上のお年寄りの場合に限り、自転車歩道通行可の標識や標示のない歩道を通行することができる。", "answer": "×"}, {"set": "R7C", "num": 3, "question": "普通自転車の車輪数は、４輪以下とされている。", "answer": "×"}, {"set": "R7C", "num": 4, "question": "普通自転車のブレーキレバーの点検整備では、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。また、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを最低位置まで下げたとき、グリップ最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、５０㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでない。", "answer": "×"}, {"set": "R7C", "num": 5, "question": "タイヤのバルブには、英式の「ウッズバルブ」、米式の「シュレーダーバルブ」及び仏式の「フレンチバルブ」の３種類があるが、「シュレーダーバルブ」と「フレンチバルブ」は同一のポンプの口金が使える。", "answer": "×"}, {"set": "R7C", "num": 6, "question": "自転車に乗るときは運転中、停止中であっても、スマートフォンで通話をしたり、スマートフォンの画面を注視してはならない。", "answer": "×"}, {"set": "R7C", "num": 7, "question": "普通自転車の点検整備基準においては、制動性能は、乾燥した平坦な舗装道路において、走行速度が１０㎞／ｈのとき、制動操作を開始した場所から３ｍ以内の距離で、円滑に停止させる性能を有することとされている。", "answer": "○"}, {"set": "R7C", "num": 8, "question": "自転車の部品は、正しく取り付けられ、かつ、確実に固定され、各部が正常に作動することが必要である。普通自転車の点検整備マニュアルにおいては、やぐらを使っているシートポストとサドルの固定については、サドルの前と後に両手をかけ、サドルを水平方向に回す力を加えたときに、動かなければよい。", "answer": "×"}, {"set": "R7C", "num": 9, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね２等分する２カ所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "×"}, {"set": "R7C", "num": 10, "question": "自転車安全整備店の登録を受けた自転車店は、「自転車安全整備店章」を貸与されるが、掲出する必要はない。", "answer": "×"}, {"set": "R7C", "num": 11, "question": "車道の左側を普通自転車に乗って運転中、前方の道路で工事をしているため、車道の左側を通行することが困難で安全を確保するためやむを得ないと認められるときは、歩道を通行することができる。", "answer": "○"}, {"set": "R7C", "num": 12, "question": "酒気を帯びて自転車を運転した者に限らず、酒気を帯びている者に自転車を提供した者、酒気を帯びて自転車を運転するおそれがある者に酒を提供し、又はすすめた者も処罰の対象となる。", "answer": "○"}, {"set": "R7C", "num": 13, "question": "普通自転車は、自転車歩道通行可の標識がある歩道を通行することができる。この場合、歩行者の通行を妨げることとなるときは、ベルを鳴らして歩行者に注意を喚起しなければならない。", "answer": "×"}, {"set": "R7C", "num": 14, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポスト関係で固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "R7C", "num": 15, "question": "自転車を運転していて交通事故を起こしたとき、運転者は、ただちに自転車の運転を停止して、負傷者を救護し、道路における危険を防止し、交通事故の状況などを警察官に報告しなければならない。", "answer": "○"}, {"set": "R7C", "num": 16, "question": "自動車の運転者は、危険を防止するためやむを得ない場合を除き、その自動車を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならないが、自転車についても同様である。", "answer": "○"}, {"set": "R7C", "num": 17, "question": "普通自転車は、フレーム、サドル、リム等の車体・車輪部の部品、ギヤクランク、チェーン等の駆動・制動部の部品、ハンドル、ブレーキ等の操縦部の部品、反射器材、警音器等の安全付属部の部品又はこれらと同等の機能を有するものによって構成されている。", "answer": "×"}, {"set": "R7C", "num": 18, "question": "自転車安全整備店の登録の有効期間は、登録を受けた日から３年を経過した日以降の１２月３１日又は６月３０日のいずれか早い日が経過するまでの期間である。", "answer": "×"}, {"set": "R7C", "num": 19, "question": "駆動補助機付自転車の点検整備基準においては、ペダルに踏力が加わっていないときは、原動機による補助力が作動しないこととされている。", "answer": "○"}, {"set": "R7C", "num": 20, "question": "自転車タイヤのサイドウオールの数字が〔２６×１．９５〕である場合、そのタイヤはＨＥタイヤである。", "answer": "○"}, {"set": "R7C", "num": 21, "question": "駆動補助機付自転車の点検整備基準においては、電源スイッチ、人力及び車速の測定手段、原動機及びその制御手段並びにそれらを結ぶ配線類は、外部から容易に部品交換ができ、修理ができる構造であることとされている。", "answer": "×"}, {"set": "R7C", "num": 22, "question": "自転車安全利用５則は、①車道が原則・左側を通行・歩道は例外・歩行者を優先、②交差点では信号と一時停止を守って・安全確認、③夜間はライトを点灯、④飲酒運転は禁止、⑤ヘルメットを着用の５つである。", "answer": "○"}, {"set": "R7C", "num": 23, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能については、自転車に備え付けられた場合において、定められた基準に適合する前照灯で照射したときに、夜間後方１００メートルの距離から、照射位置から反射光を容易に確認できること、反射光の色は、橙色又は赤色であることが必要である。", "answer": "○"}, {"set": "R7C", "num": 24, "question": "ＴＳマーク付帯保険の支払対象となる事故には、自転車を押し歩いている場合の事故は含まれない。", "answer": "×"}, {"set": "R7C", "num": 25, "question": "自転車活用推進法では、国民に広く自転車の活用の推進についての関心と理解を深めるため、自転車の日を５月４日、自転車月間を５月１日から同月３１日までと定めている。", "answer": "×"}, {"set": "R7C", "num": 26, "question": "普通自転車の点検整備マニュアルにおいては、制動性能の静的な測定方法は、幼児用自転車を除く一般用自転車の後ブレーキの場合、後ブレーキレバーを指２本をかけて締め、ペダルの前後を水平にした状態で、片足で全体重をペダルにかけたときに、後車輪が回らないことを確認する。", "answer": "○"}, {"set": "R7C", "num": 27, "question": "自転車安全整備店は、ＴＳマークを貼付した際は、ＴＳマーク付帯保険加入書（お客様用）をＴＳマーク保険加入者に交付するとともに、同加入書（店舗用）を交付の日から３年間保管しなければならない。", "answer": "○"}, {"set": "R7C", "num": 28, "question": "普通自転車の制動性能としては、前車輪と後車輪が同一系統で確実に制動できること、ブレーキレバーを反復して作動した場合において、ブレーキ各部及び各取付部に異状が生じないことが必要である。", "answer": "×"}, {"set": "R7C", "num": 29, "question": "自転車は、信号機などにより交通整理の行われていない交差点（環状交差点を除く）を右折するとき、後方の安全を確かめ、交差点の中心を通るなど最短距離で曲がらなければならない。", "answer": "×"}, {"set": "R7C", "num": 30, "question": "自転車の運転者は、他人を当該自転車に乗車させるときは、当該他人に乗車用ヘルメットをかぶらせるよう努めなければならない。", "answer": "○"}, {"set": "R7C", "num": 31, "question": "普通自転車の点検整備基準においては、警音器(ベル)の性能の点検は、５ｍ離れた位置でよく聞こえ、かつ、適切な音質のものであることを確認する。", "answer": "○"}, {"set": "R7C", "num": 32, "question": "自転車は、車両であるから常に車両用の信号機に従わなければならない。", "answer": "×"}, {"set": "R7C", "num": 33, "question": "自転車は、すぐに移動でき、自動車ほど邪魔にならないため、道路のどこに駐車しても支障はないので、駐車禁止の対象となっていない。", "answer": "×"}, {"set": "R7C", "num": 34, "question": "ナットドライバーは、適正な事業所の基準で定める工具に含まれない。", "answer": "○"}, {"set": "R7C", "num": 35, "question": "自転車に乗って道路を横断しようとするとき、近くに自転車横断帯も横断歩道もない場合には、右左の見通しのよいところを選んで、自動車が来ないことを確認し､直角にわたる。", "answer": "○"}, {"set": "R7C", "num": 36, "question": "防犯登録は法律で登録することが義務付けられており、防犯登録がなされていない自転車には、ＴＳマークを貼付することはできない。", "answer": "×"}, {"set": "R7C", "num": 37, "question": "自転車の点検及び整備を行うための作業場が５平方メートル以上確保されていること、自転車の点検整備のために規程に定められた工具を備え付けていれば自転車安全整備店として登録するための適正な事業所の基準を満たしている。", "answer": "×"}, {"set": "R7C", "num": 38, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、緩まないようにねじは強く締めるほうがよい。", "answer": "×"}, {"set": "R7C", "num": 39, "question": "自転車は気軽な乗り物なので、乗るときに明るい目立つ色の衣服を着用したり、反射器材を使用する必要はない。", "answer": "×"}, {"set": "R7C", "num": 40, "question": "自転車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて、原則として道路の左側に寄って一時停止しなければならない。", "answer": "○"}, {"set": "R7C", "num": 41, "question": "緑色ＴＳマーク付帯保険の賠償責任保障の支払いの対象は、死亡又は身体の傷害である。", "answer": "○"}, {"set": "R7C", "num": 42, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人に自転車が走っていることを知らせるためのものでもあるので、原則として夜間にライトをつけずに走行してはならない。", "answer": "○"}, {"set": "R7C", "num": 43, "question": "幼児二人同乗用自転車にも、普通自転車に適合していれば、ＴＳマークを貼付することができる。", "answer": "○"}, {"set": "R7C", "num": 44, "question": "普通自転車の車輪を点検する場合、著しいへこみや変形等のないこと、振れ、スポークの張力及び前車輪の固定の４点を確認する。", "answer": "○"}, {"set": "R7C", "num": 45, "question": "自転車の安全利用の促進及び自転車等の駐車対策の総合的推進に関する法律では、「自転車の小売りを業とする者は、自転車の販売にあたっては、当該自転車の取扱方法、定期的な点検の必要性等の自転車の安全利用のための十分な情報を提供するとともに、防犯登録の勧奨並びに自転車の点検及び修理業務の充実に努めなければならない。」と規定されている。", "answer": "○"}, {"set": "R7C", "num": 46, "question": "自転車安全整備店としての登録を受けるには、自転車店の店主が自転車安全整備士の資格を有していなければならない。", "answer": "×"}, {"set": "R7C", "num": 47, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」などがあるが、「普通自転車の歩道通行時の通行方法違反」もその対象である。", "answer": "○"}, {"set": "R7C", "num": 48, "question": "普通自転車の車体の大きさは、長さはフレーム中心面に平行かつ水平に、幅はフレーム中心面に垂直かつ水平にそれぞれ最長部を測定するが、スタンドについては含めないで測定する。", "answer": "×"}, {"set": "R7C", "num": 49, "question": "適正な事業所の基準で定める工具のうち、前後ハブナットの締め付け、緩め用に使用する工具はラチェットレンチであるが、ボックスレンチでもよいとされている。", "answer": "○"}, {"set": "R7C", "num": 50, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、高い安全性を備えた良質な自転車の供給体制の整備が明記されている。", "answer": "○"}, {"set": "R7D", "num": 1, "question": "自転車安全整備店としての登録を受けるには、自転車店の店主が自転車安全整備士の資格を有していなければならない。", "answer": "×"}, {"set": "R7D", "num": 2, "question": "普通自転車の点検整備基準において、ハンドルステム及びシートポスト関係で固定力検査を行うのは、前ホークとハンドルステムとの固定、ハンドルステムとハンドルバーとの固定、立パイプとシートポストとの固定及びハンドルバーとブレーキレバーとの固定の４箇所である。", "answer": "×"}, {"set": "R7D", "num": 3, "question": "普通自転車が歩道を通行できるときでも、歩行者が優先である。歩行者の通行を妨げることとなるときには、一時停止しなければならない。", "answer": "○"}, {"set": "R7D", "num": 4, "question": "夜間、自転車のライト（前照灯）を点灯して走行するのは、自分の進行方向を照らすためだけではなく、他の人に自転車が走っていることを知らせるためのものでもあるので、原則として夜間にライトをつけずに走行してはならない。", "answer": "○"}, {"set": "R7D", "num": 5, "question": "自転車に乗るときは運転中、停止中であっても、スマートフォンで通話をしたり、スマートフォンの画面を注視してはならない。", "answer": "×"}, {"set": "R7D", "num": 6, "question": "自動車は、交差点又はその付近において緊急自動車が近づいてきたときは、交差点を避けて、原則として道路の左側に寄って一時停止しなければならないが、自転車の場合は、徐行すればよい。", "answer": "×"}, {"set": "R7D", "num": 7, "question": "普通自転車の点検整備マニュアルにおいては、スポークの張力を手で点検する場合には、車輪の両側について、リムの内周を概ね３等分する３カ所くらいずつのスポークを指先で握り、それぞれの張力を点検し、緩いものや著しいばらつきがないかを確認する。", "answer": "○"}, {"set": " num": 38, "question": "自転車は、沢山の部品がねじで結合されて組み立てられているので、走行中の細かい振動でこれらのねじが緩むと、各部が正しい位置に保たれなくなったり、ベアリング部が緩んだりするので、緩まないようにねじは強く締めるほうがよい。", "answer": "×"}, {"set": "R7D", "num": 39, "question": "普通自転車の車輪数は、４輪以下とされている。", "answer": "×"}, {"set": "R7D", "num": 40, "question": "自動車の運転者は、危険を防止するためやむを得ない場合を除き、その自動車を急に停止させ、又はその速度を急激に減ずることとなるような急ブレーキをかけてはならないが、自転車についてはこの限りではない。", "answer": "×"}, {"set": "R7D", "num": 41, "question": "普通自転車のブレーキレバーの点検整備では、サドルとハンドルを運転者に適応した位置に調節した自転車に通常の乗車姿勢に乗車した運転者の肩より下方にする。また、ハンドルをはめ合わせ限界標識まで引き上げ、サドルを最低位置まで下げたとき、グリップ最上部からサドル座面がシートポスト軸と交差する点までの垂直距離は、４０㎝を超えてはならない。ただし、車体部が折りたたみ又は分割できるものは、この限りでない。", "answer": "○"}, {"set": "R7D", "num": 42, "question": "自転車安全整備店が次のいずれかに該当することとなったときは、登録を取り消すことができる。（１）適正な事業所の基準に適合しなくなったとき。（２）正当な理由がないのに１年以上点検整備済ＴＳマークの取扱いをしなかったとき。（３）点検整備済ＴＳマークを不適正に貼付したとき。（４）登録者としての信用を失墜させる行為をしたとき。", "answer": "○"}, {"set": "R7D", "num": 43, "question": "自転車に乗って道路を横断しようとするとき、近くに自転車横断帯も横断歩道もない場合には、右左の見通しのよいところを選んで、自動車が来ないことを確認し､直角にわたる。", "answer": "○"}, {"set": "R7D", "num": 44, "question": "普通自転車の点検整備基準においては、反射器材の色及び性能は、自転車に取り付けられた場合、定められた基準に適合する前照灯で照射したときに、夜間後方１００メートルの距離から、反射光を照射位置から容易に確認できること、反射光の色は、橙色であることが必要である。", "answer": "×"}, {"set": "R7D", "num": 45, "question": "道路交通法に定める自転車運転者講習の対象となる危険行為には「信号無視」「ブレーキ不良自転車運転」などがあるが、「普通自転車の歩道通行時の通行方法違反」もその対象である。", "answer": "○"}, {"set": "R7D", "num": 46, "question": "自転車の部品は、正しく取り付けられ、かつ、確実に固定され、各部が正常に作動することが必要である。普通自転車の点検整備マニュアルにおいては、やぐらを使っているシートポストとサドルの固定については、サドルの前と後に両手をかけ、サドルを水平方向に回す力を加えたときに、動かなければよい。", "answer": "×"}, {"set": "R7D", "num": 47, "question": "自転車安全整備店の登録の有効期間は、登録を受けた日から３年を経過した日以降の１２月３１日又は６月３０日のいずれか早い日が経過するまでの期間である。", "answer": "×"}, {"set": "R7D", "num": 48, "question": "自転車の点検及び整備を行うための作業場が５平方メートル以上確保されていること、当該作業場は、道路から容易に自転車を持ち込めるものであること、自転車の点検整備のため、規程に定められた工具を備え付けていれば自転車安全整備店として登録するための適正な事業所の基準を満たしている。", "answer": "○"}, {"set": "R7D", "num": 49, "question": "自転車活用推進法においては、自転車の活用の推進に関して、重点的に検討され、及び実施されるべき施策として、相当な安全性を備えた安価な自転車の供給体制の整備が明記されている。", "answer": "×"}, {"set": "R7D
