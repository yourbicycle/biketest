<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
:root{
  --bg:#f5f4ef;--surface:#ffffff;--surface2:#f8fafc;--surface3:#f1f5f9;
  --text:#0f172a;--text2:#334155;--text3:#64748b;--text4:#94a3b8;
  --border:#cbd0d8;--border2:#e2e8f0;--border3:#475569;
  --accent:#c2410c;--accent-bg:#fef3c7;--accent-text:#92400e;
  --header-bg:#1e293b;--header-text:#e2e8f0;
  --shift:#1e40af;--off:#c2410c;--off-bg:#fef3c7;--off-text:#92400e;
  --koukyu-k-bg:#fdba74;--koukyu-k-text:#9a3412;
  --yuukyu-bg:#bfdbfe;--yuukyu-half-bg:#dbeafe;
  --tokkyu-bg:#e9d5ff;--kaigi-bg:#fef08a;--kenshu-bg:#bbf7d0;
  --event-bg:#fef3c7;--event-text:#92400e;--event-border:#fcd34d;
  --weekend-sat:#eff6ff;--weekend-sun:#fef2f2;
  --ok-bg:#dcfce7;--ok-text:#15803d;
  --warn-bg:#fef9c3;--warn-text:#854d0e;
  --err-bg:#fee2e2;--err-text:#991b1b;
  --monday-divider:#94a3b8;

}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
.num{font-family:"SF Mono","Menlo",ui-monospace,monospace;font-feature-settings:"tnum";font-weight:500}
.app-root *{border-radius:0!important}
.app-root button{font-family:inherit;letter-spacing:0;cursor:pointer}
.app-root input,.app-root select,.app-root textarea{font-family:inherit}
.app-root .stick-r{position:sticky;right:0;z-index:14;box-shadow:-2px 0 0 var(--border3) inset}
.app-root .stick-r-head{position:sticky;right:0;z-index:24;box-shadow:-2px 0 0 var(--border3) inset}
.app-root .stick-r2{position:sticky;right:90px;z-index:14;box-shadow:-2px 0 0 var(--border3) inset}
.app-root .stick-r2-head{position:sticky;right:90px;z-index:24;box-shadow:-2px 0 0 var(--border3) inset}
.app-root input[type="text"],.app-root input[type="number"],.app-root input[type="time"],.app-root select,.app-root textarea{background:var(--surface) !important;color:var(--text) !important;border:1px solid var(--border3) !important}
.app-root input[type="text"]:focus,.app-root input[type="number"]:focus,.app-root input[type="time"]:focus,.app-root select:focus,.app-root textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.app-root label{color:var(--text2)}
.app-root .modal-card{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.app-root .modal-card label{color:var(--text2)}
.app-root .btn-primary{background:#2563eb;color:#fff;border:1px solid #2563eb}
.app-root .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border3)}
.app-root .btn-danger{background:var(--err-bg);color:var(--err-text);border:1px solid var(--err-text)}
.app-root .card{background:var(--surface);border:1px solid var(--border);color:var(--text)}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useCallback,useEffect} = React;

const generateId = () => Math.random().toString(36).slice(2, 11);
const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const DAY_LABELS = ['日','月','火','水','木','金','土'];
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];

const SHIFT_TYPES = {
  normal: { label: '通常', short: '', color: '#3b82f6', bg: '#dbeafe', textColor: '#1e40af' },
  koukyu: { label: '公休', short: '公休', color: '#f97316', bg: '#fff7ed', textColor: '#c2410c' },
  koukyu_k: { label: '公休(希)', short: '公希', color: '#ea580c', bg: '#fed7aa', textColor: '#9a3412' },
  yuukyu: { label: '有休', short: '有休', color: '#2563eb', bg: '#bfdbfe', textColor: '#1e3a8a' },
  yuukyu_am: { label: '有休前半', short: '有前', color: '#3b82f6', bg: '#dbeafe', textColor: '#1e3a8a' },
  yuukyu_pm: { label: '有休後半', short: '有後', color: '#1d4ed8', bg: '#bfdbfe', textColor: '#1e3a8a' },
  tokkyu: { label: '特休', short: '特休', color: '#7c3aed', bg: '#ddd6fe', textColor: '#5b21b6' },
  kaigi:  { label: '会議', short: '会議', color: '#ea580c', bg: '#fed7aa', textColor: '#9a3412' },
  kenshu: { label: '研修', short: '研修', color: '#16a34a', bg: '#bbf7d0', textColor: '#166534' },
  ouen:   { label: '応援', short: '応援', color: '#db2777', bg: '#fbcfe8', textColor: '#9d174d' },
};
const COUNTS_AS_WORKING = { normal: true, koukyu: false, koukyu_k: false, yuukyu_am: false, yuukyu_pm: false, kaigi: false, kenshu: false, ouen: false, yuukyu: false, tokkyu: false };

const JAPAN_HOLIDAYS = new Set([
  '2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24','2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-23','2025-10-13','2025-11-03','2025-11-23','2025-11-24',
  '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2026-12-23',
  '2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23',
]);

function getMonthPeriodDates(year, month) {
  const pm = month - 1 < 1 ? 12 : month - 1;
  const py = month - 1 < 1 ? year - 1 : year;
  const start = new Date(py, pm - 1, 21), end = new Date(year, month - 1, 20), dates = [];
  const d = new Date(start);
  while (d <= end) { dates.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return dates;
}

const TIME_OPTIONS = (() => { const o = []; for (let h = 0; h < 24; h++) for (let m = 0; m < 60; m += 15) o.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`); return o; })();

const INIT_PRESETS = [
  { label: '早番', start: '06:00', end: '15:00' },
  { label: '日勤', start: '09:00', end: '18:00' },
  { label: '遅番A', start: '10:00', end: '19:00' },
  { label: '遅番B', start: '11:00', end: '20:00' },
  { label: '準夜', start: '13:00', end: '22:00' },
];
const INIT_STAFF = [
  { id: 's1', name: '山田 太郎', color: '#3b82f6', memo: '', sortOrder: 0, targetDaysOff: 8, employment: 'staff', hourlyWage: 0 },
  { id: 's2', name: '佐藤 花子', color: '#ef4444', memo: '', sortOrder: 1, targetDaysOff: 8, employment: 'staff', hourlyWage: 0 },
  { id: 's3', name: '鈴木 一郎', color: '#22c55e', memo: '', sortOrder: 2, targetDaysOff: 8, employment: 'staff', hourlyWage: 0 },
  { id: 's4', name: '高橋 美咲', color: '#f59e0b', memo: '', sortOrder: 3, targetDaysOff: 8, employment: 'staff', hourlyWage: 0 },
  { id: 's5', name: '田中 健一', color: '#8b5cf6', memo: '', sortOrder: 4, targetDaysOff: 8 },
];

// === localStorage helpers ===
const STORAGE_KEY = 'shift_manager_data';
function loadData() {
  try { const d = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (d) return d; } catch(e) {}
  return null;
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

function Modal({ open, onClose, title, children, width = 'max-w-md' }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.65)' }}>
      <div className={`shadow-2xl w-full ${width} max-h-screen overflow-y-auto app-root`} style={{maxHeight:'90vh',background:'var(--surface)',border:'1px solid var(--border)'}}>
        <div className="flex items-center justify-between px-5 py-4" style={{borderBottom:'1px solid var(--border)'}}>
          <h3 style={{fontSize:16,fontWeight:600,color:'var(--text)'}}>{title}</h3>
          <button onClick={onClose} style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text2)',fontSize:18,cursor:'pointer'}}>×</button>
        </div>
        <div className="p-5" style={{color:'var(--text)'}}>{children}</div>
      </div>
    </div>
  );
}

function ShiftManager() {
  const saved = useMemo(() => loadData(), []);
  const [currentYear, setCurrentYear] = useState(saved?.currentYear || 2026);
  const [currentMonth, setCurrentMonth] = useState(saved?.currentMonth || 3);
  const [staff, setStaff] = useState(saved?.staff || INIT_STAFF);
  const [shifts, setShifts] = useState(saved?.shifts || {});
  const [events, setEvents] = useState(saved?.events || {});
  const [activeTab, setActiveTab] = useState('calendar');
  const [patterns, setPatterns] = useState(saved?.patterns || []);
  const [monthlyDaysOff, setMonthlyDaysOff] = useState(saved?.monthlyDaysOff || {});
  const [monthlyBudgets, setMonthlyBudgets] = useState(saved?.monthlyBudgets || {});
  const [eventsCollapsed, setEventsCollapsed] = useState(() => { try { return localStorage.getItem('sm_events_collapsed') === '1'; } catch(e) { return false; } });
  useEffect(() => { try { localStorage.setItem('sm_events_collapsed', eventsCollapsed ? '1' : '0'); } catch(e){} }, [eventsCollapsed]);
  const [showSalary, setShowSalary] = useState(() => { try { return localStorage.getItem('sm_show_salary') === '1'; } catch(e) { return false; } });
  useEffect(() => { try { localStorage.setItem('sm_show_salary', showSalary ? '1' : '0'); } catch(e){} }, [showSalary]);

  // Salary period: shift month X → salary period (X-1)/11 〜 X/10
  const salaryPeriod = useMemo(() => {
    let startY = currentYear, startM = currentMonth - 1;
    if (startM < 1) { startM = 12; startY = currentYear - 1; }
    const start = new Date(startY, startM - 1, 11);
    const end = new Date(currentYear, currentMonth - 1, 10);
    const days = []; const d = new Date(start);
    while (d <= end) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }
    return { start, end, days, label: `${startM}月分` };
  }, [currentYear, currentMonth]);

  // Time HH:MM string → minutes since 00:00
  const tToMin = t => { if (!t || typeof t !== 'string') return 0; const [h,m] = t.split(':').map(Number); return h*60 + (m||0); };

  // Calculate salary for one partner staff over the salary period
  const calcSalary = useCallback((s) => {
    if (s.employment !== 'partner' || !s.hourlyWage) return { total: 0, workMin: 0 };
    let total = 0, workMin = 0;
    salaryPeriod.days.forEach(d => {
      const ds = formatDate(d), dow = d.getDay(), hol = JAPAN_HOLIDAYS.has(ds);
      const sh = shifts[`${s.id}_${ds}`];
      if (!sh) return;
      let mins = 0;
      if (sh.type === 'normal' || sh.type === 'ouen') {
        if (sh.start && sh.end) mins = tToMin(sh.end) - tToMin(sh.start);
      } else if (sh.type === 'yuukyu') {
        if (sh.start && sh.end) mins = tToMin(sh.end) - tToMin(sh.start);
      } else {
        return; // 公休/公希/特休/会議/研修/有休前後半 → 0円
      }
      if (mins <= 0) return;
      // Break deduction (control case A: 超えたら控除)
      let breakMin = 0;
      if (mins > 8*60) breakMin = 60;
      else if (mins > 6*60) breakMin = 45;
      const actual = mins - breakMin;
      if (actual <= 0) return;
      const wage = (dow === 0 || hol) ? (s.hourlyWage + 50) : s.hourlyWage;
      const pay = Math.ceil(actual / 60 * wage);
      total += pay;
      workMin += actual;
    });
    return { total, workMin };
  }, [salaryPeriod, shifts]);
  const [presets, setPresets] = useState(saved?.presets || INIT_PRESETS);
  const [shiftModal, setShiftModal] = useState(null);
  const [staffModal, setStaffModal] = useState(null);
  const [eventModal, setEventModal] = useState(null);
  const [patternModal, setPatternModal] = useState(null);
  const [applyModal, setApplyModal] = useState(null);
  const [dragStaff, setDragStaff] = useState(null);
  const [clipboard, setClipboard] = useState(null);
  const [rangeClip, setRangeClip] = useState(null);
  const [selectedCells, setSelectedCells] = useState([]);
  const [toast, setToast] = useState('');
  const [shiftForm, setShiftForm] = useState({ type: 'normal', start: '11:00', end: '20:00' });
  const [staffForm, setStaffForm] = useState({ name: '', color: '#3b82f6', memo: '', startYear: null, startMonth: null, endYear: null, endMonth: null, employment: 'staff', hourlyWage: 1000 });
  const [showPresetEdit, setShowPresetEdit] = useState(false);
  const [presetForm, setPresetForm] = useState({ label: '', start: '11:00', end: '20:00' });
  const [patternForm, setPatternForm] = useState({ staffId: '', name: '', week: {} });
  const [applyForm, setApplyForm] = useState({ patternId: '', mode: 'month' });

  // ==== Mobile UI ====
  const [isMobile, setIsMobile] = useState(() => window.matchMedia('(max-width: 768px)').matches);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 768px)');
    const handler = (e) => setIsMobile(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);
  const [mobileView, setMobileView] = useState('home'); // home | day | jump | holidayStaff | holidayCal
  const [mobileDayDate, setMobileDayDate] = useState(() => formatDate(new Date()));
  const [mobileHolidayStaffId, setMobileHolidayStaffId] = useState(null);
  const [mobileHolidayType, setMobileHolidayType] = useState('koukyu_k');
  const [mobileEditModal, setMobileEditModal] = useState(null); // { staffId, date, step, type, start, end }
  const getTodayShiftPeriod = () => {
    const t = new Date();
    let y = t.getFullYear(), m = t.getMonth() + 1;
    if (t.getDate() >= 21) { m++; if (m > 12) { m = 1; y++; } }
    return { year: y, month: m };
  };
  const getShiftPeriodOfDate = (dateStr) => {
    const [y, m, d] = dateStr.split('-').map(Number);
    if (d >= 21) { let mm = m + 1, yy = y; if (mm > 12) { mm = 1; yy++; } return { year: yy, month: mm }; }
    return { year: y, month: m };
  };
  const [mobileJumpYearMonth, setMobileJumpYearMonth] = useState(() => getTodayShiftPeriod());

  // Auto-save
  useEffect(() => {
    const timer = setTimeout(() => {
      saveData({ currentYear, currentMonth, staff, shifts, events, patterns, presets, monthlyDaysOff, monthlyBudgets });
    }, 500);
    return () => clearTimeout(timer);
  }, [currentYear, currentMonth, staff, shifts, events, patterns, presets, monthlyDaysOff, monthlyBudgets]);

  const dates = useMemo(() => getMonthPeriodDates(currentYear, currentMonth), [currentYear, currentMonth]);
  // Context dates: previous Monday to day before period start
  const contextPrefix = useMemo(() => {
    if (dates.length === 0) return [];
    const start = dates[0]; // e.g. 10/21
    const dow = start.getDay(); // 0=Sun 1=Mon
    if (dow === 1) return []; // already Monday
    const daysBack = dow === 0 ? 6 : dow - 1;
    const result = [];
    for (let i = daysBack; i >= 1; i--) {
      const d = new Date(start); d.setDate(d.getDate() - i); result.push(d);
    }
    return result;
  }, [dates]);
  // Context suffix: day after period end to next Sunday
  const contextSuffix = useMemo(() => {
    if (dates.length === 0) return [];
    const end = dates[dates.length - 1]; // e.g. 11/20
    const dow = end.getDay(); // 0=Sun 1=Mon
    if (dow === 0) return []; // already Sunday
    const daysForward = 7 - dow;
    const result = [];
    for (let i = 1; i <= daysForward; i++) {
      const d = new Date(end); d.setDate(d.getDate() + i); result.push(d);
    }
    return result;
  }, [dates]);
  const allDates = useMemo(() => [...contextPrefix, ...dates, ...contextSuffix], [contextPrefix, dates, contextSuffix]);
  const inPeriodDateSet = useMemo(() => new Set(dates.map(d => formatDate(d))), [dates]);
  const sortedStaff = useMemo(() => [...staff].sort((a, b) => a.sortOrder - b.sortOrder), [staff]);
  const isStaffActive = useCallback((s, y, m) => {
    const ym = y * 100 + m;
    if (s.startYear && s.startMonth && ym < s.startYear * 100 + s.startMonth) return false;
    if (s.endYear && s.endMonth && ym > s.endYear * 100 + s.endMonth) return false;
    return true;
  }, []);
  const activeStaff = useMemo(() => sortedStaff.filter(s => isStaffActive(s, currentYear, currentMonth)), [sortedStaff, currentYear, currentMonth, isStaffActive]);
  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(''), 2000); return () => clearTimeout(t); } }, [toast]);

  const goMonth = (dir) => { let m = currentMonth + dir, y = currentYear; if (m > 12) { m = 1; y++; } if (m < 1) { m = 12; y--; } setCurrentMonth(m); setCurrentYear(y); };
  const getWorking = useCallback((ds) => { let c = 0; activeStaff.forEach(s => { const sh = shifts[`${s.id}_${ds}`]; if (sh && COUNTS_AS_WORKING[sh.type]) c++; }); return c; }, [shifts, activeStaff]);
  const getDaysOff = useCallback((sid) => { let off = 0, yu = 0, tk = 0; dates.forEach(d => { const sh = shifts[`${sid}_${formatDate(d)}`]; if (sh && (sh.type === 'koukyu' || sh.type === 'koukyu_k')) off++; else if (sh && (sh.type === 'yuukyu' || sh.type === 'yuukyu_am' || sh.type === 'yuukyu_pm')) yu++; else if (sh && sh.type === 'tokkyu') tk++; }); return { off, yu, tk }; }, [dates, shifts]);
  const isMonday = d => d.getDay() === 1;
  const mondayBorder = d => isMonday(d) ? '2px solid #94a3b8' : '1px solid #f1f5f9';
  const mondayBorderPrint = d => isMonday(d) ? '2px solid #555' : '1px solid #999';
  const getWeeklyOffErrors = useCallback((sid) => {
    const weeks = []; let week = [];
    allDates.forEach(d => { if (d.getDay() === 1 && week.length > 0) { weeks.push(week); week = []; } week.push(d); });
    if (week.length > 0) weeks.push(week);
    const errors = [];
    weeks.forEach(w => {
      if (w.length < 7) return;
      let off = 0;
      w.forEach(d => { const sh = shifts[`${sid}_${formatDate(d)}`]; if (sh && (sh.type === 'koukyu' || sh.type === 'koukyu_k' || sh.type === 'yuukyu' || sh.type === 'yuukyu_am' || sh.type === 'yuukyu_pm' || sh.type === 'tokkyu')) off++; });
      if (off < 2) errors.push(`${w[0].getMonth()+1}/${w[0].getDate()}〜: ${off}日`);
    });
    return errors;
  }, [allDates, shifts]);
  const monthlyTarget = monthlyDaysOff[`${currentYear}-${currentMonth}`] ?? 8;

  const openShiftModal = (sid, date) => { const ex = shifts[`${sid}_${date}`]; setShiftForm(ex ? { type: ex.type, start: ex.start || '11:00', end: ex.end || '20:00' } : { type: 'normal', start: '11:00', end: '20:00' }); setShowPresetEdit(false); setShiftModal({ staffId: sid, date }); };
  const saveShift = () => { if (!shiftModal) return; const curStaff = staff.find(s => s.id === shiftModal.staffId); const isPartner = curStaff?.employment === 'partner'; let e; if (shiftForm.type === 'normal') e = { type: 'normal', start: shiftForm.start, end: shiftForm.end }; else if (shiftForm.type === 'yuukyu' && isPartner) e = { type: 'yuukyu', start: shiftForm.start || '10:00', end: shiftForm.end || '19:00' }; else e = { type: shiftForm.type }; setShifts(p => ({ ...p, [`${shiftModal.staffId}_${shiftModal.date}`]: e })); setShiftModal(null); };
  const deleteShift = () => { if (!shiftModal) return; setShifts(p => { const n = { ...p }; delete n[`${shiftModal.staffId}_${shiftModal.date}`]; return n; }); setShiftModal(null); };
  const copyShift = () => { if (!shiftModal) return; const ex = shifts[`${shiftModal.staffId}_${shiftModal.date}`]; if (ex) { setClipboard({ ...ex }); setToast('コピーしました'); } else { setToast('シフトが未入力です'); } setShiftModal(null); };
  const pasteShift = () => { if (!shiftModal || !clipboard) return; setShifts(p => ({ ...p, [`${shiftModal.staffId}_${shiftModal.date}`]: { ...clipboard } })); setToast('ペーストしました'); setShiftModal(null); };

  const dateStrings = useMemo(() => dates.map(d => formatDate(d)), [dates]);
  const handleCellClick = (sid, ds, e) => {
    if (e.shiftKey && selectedCells.length > 0 && selectedCells[0].staffId === sid) {
      const startIdx = dateStrings.indexOf(selectedCells[0].date);
      const endIdx = dateStrings.indexOf(ds);
      if (startIdx >= 0 && endIdx >= 0) {
        const from = Math.min(startIdx, endIdx), to = Math.max(startIdx, endIdx);
        setSelectedCells(dateStrings.slice(from, to + 1).map(d => ({ staffId: sid, date: d })));
      }
    } else {
      setSelectedCells([{ staffId: sid, date: ds }]);
    }
  };
  const handleCellDblClick = (sid, ds) => { setSelectedCells([]); openShiftModal(sid, ds); };
  const isCellSelected = useCallback((sid, ds) => selectedCells.some(c => c.staffId === sid && c.date === ds), [selectedCells]);

  const selectedDates = useMemo(() => new Set(selectedCells.map(c => c.date)), [selectedCells]);

  const renderMobileHolidayCal = () => {
    const s = staff.find(x => x.id === mobileHolidayStaffId);

    const { year, month } = mobileJumpYearMonth;
    const monthDates = getMonthPeriodDates(year, month);
    const firstDate = monthDates[0];
    const firstDow = firstDate.getDay();
    const grid = [];
    for (let i = 0; i < firstDow; i++) grid.push(null);
    monthDates.forEach(d => grid.push(d));
    while (grid.length % 7 !== 0) grid.push(null);
    const today = formatDate(new Date());
    const changeMonth = (dir) => {
      let m = month + dir, y = year;
      if (m > 12) { m = 1; y++; } if (m < 1) { m = 12; y--; }
      setMobileJumpYearMonth({ year: y, month: m });

    const activeStaffList = staff.filter(x => isStaffActive(x, currentYear, currentMonth)).sort((a, b) => a.sortOrder - b.sortOrder);

      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,gap:8}}>
        <button onClick={() => changeMonth(-1)} style={{padding:'6px 10px',fontSize:14,background:'var(--surface2)',border:'1px solid var(--border3)',minWidth:44}}>←</button>
        <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{year}年 {month}月度</div>
        <button onClick={() => changeMonth(1)} style={{padding:'6px 10px',fontSize:14,background:'var(--surface2)',border:'1px solid var(--border3)',minWidth:44}}>→</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7, 1fr)',gap:3,marginBottom:3}}>
        {DAY_LABELS.map((d, i) => <div key={d} style={{textAlign:'center',fontSize:10,fontWeight:700,padding:'2px 0',color:i===0?'#dc2626':i===6?'#2563eb':'var(--text3)'}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7, 1fr)',gap:3}}>
        {grid.map((d, i) => {

          const ds = formatDate(d), dow = d.getDay(), hol = JAPAN_HOLIDAYS.has(ds);
          const isPast = ds < today;
          const color = (dow === 0 || hol) ? '#dc2626' : (dow === 6 ? '#2563eb' : 'var(--text)');
          const sh = shifts[`${s.id}_${ds}`];
          const isHoliday = sh && ['koukyu_k','yuukyu','yuukyu_am','yuukyu_pm'].includes(sh.type);

          return (<button key={i} onClick={() => toggleMobileHoliday(ds)} disabled={isPast} style={{aspectRatio:'1',background:holCfg?holCfg.color:'var(--surface)',border:'1px solid var(--border)',color:holCfg?holCfg.textColor:color,fontSize:12,fontWeight:600,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',opacity:isPast?0.3:1,cursor:isPast?'not-allowed':'pointer',position:'relative'}} className="num">

  };

  const renderMobileEditModal = () => {

            <button onClick={() => applyMobileEdit('yuukyu_pm')} style={{padding:'14px',fontSize:13,fontWeight:700,background:'var(--yuukyu-half-bg)',color:'#1e3a8a',border:'2px solid #1e3a8a'}}>有休後半</button>
            <button onClick={() => applyMobileEdit('tokkyu')} style={{padding:'14px',fontSize:14,fontWeight:700,background:'var(--tokkyu-bg)',color:'#6d28d9',border:'2px solid #6d28d9'}}>特休</button>
            <button onClick={() => applyMobileEdit('kaigi')} style={{padding:'14px',fontSize:14,fontWeight:700,background:'var(--kaigi-bg)',color:'#854d0e',border:'2px solid #854d0e'}}>会議</button>
            <button onClick={() => applyMobileEdit('kenshu')} style={{padding:'14px',fontSize:14,fontWeight:700,background:'var(--kenshu-bg)',color:'#166534',border:'2px solid #166534'}}>研修</button>
            <button onClick={() => applyMobileEdit('delete')} style={{padding:'14px',fontSize:13,fontWeight:600,background:'var(--err-bg)',color:'var(--err-text)',border:'2px solid var(--err-text)'}}>クリア</button>
          </div>
        </div>)}
        {step === 2 && mobileEditModal.type === 'normal' && (<div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:600,color:'var(--text2)'}}>Step 2: 時刻</div>
            <button onClick={() => setMobileEditModal(p => ({ ...p, step: 1 }))} style={{padding:'4px 8px',fontSize:11,background:'var(--surface2)',color:'var(--text3)',border:'1px solid var(--border3)'}}>← 種別</button>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
            {presets.map((p, i) => (<button key={i} onClick={() => setMobileEditModal(pv => ({ ...pv, start: p.start, end: p.end }))} style={{padding:'8px 10px',fontSize:12,fontWeight:600,background:(mobileEditModal.start===p.start&&mobileEditModal.end===p.end)?'rgba(59,130,246,0.15)':'var(--surface2)',color:'var(--text)',border:'1.5px solid '+((mobileEditModal.start===p.start&&mobileEditModal.end===p.end)?'#3b82f6':'var(--border3)')}}>{p.label} <span style={{opacity:0.6,fontWeight:400}}>{p.start}-{p.end}</span></button>))}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:12}}>
            <select value={mobileEditModal.start} onChange={e => setMobileEditModal(p => ({ ...p, start: e.target.value }))} style={{flex:1,padding:'10px',fontSize:14,background:'var(--surface2)',color:'var(--text)',border:'1px solid var(--border3)'}}>{TIME_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}</select>
            <span style={{color:'var(--text3)'}}>〜</span>
            <select value={mobileEditModal.end} onChange={e => setMobileEditModal(p => ({ ...p, end: e.target.value }))} style={{flex:1,padding:'10px',fontSize:14,background:'var(--surface2)',color:'var(--text)',border:'1px solid var(--border3)'}}>{TIME_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}</select>

        </div>)}

    </div>);

  const renderMobile = () => (<div className="app-root" style={{ backgroundColor: 'var(--bg)', color: 'var(--text)', minHeight: '100vh' }}>
    {mobileView === 'home' && renderMobileHome()}

    {mobileView === 'holidayStaff' && renderMobileHolidayStaff()}

  return (

      <div className="no-print" style={{ background: 'var(--surface)', borderBottom: '1px solid var(--border)', borderLeft: '3px solid var(--accent)', padding: '8px 12px' }}>

          <div className="flex items-center" style={{gap:10,flexWrap:'wrap'}}>
            <span style={{fontSize:13,fontWeight:600,color:'var(--text)',letterSpacing:'0.04em'}}>シフト管理</span>
            <div className="flex">{[['calendar', 'カレンダー'], ['staff', 'スタッフ']].map(([k, l], i, arr) => (<button key={k} onClick={() => setActiveTab(k)} style={{padding:'4px 12px',fontSize:11,fontWeight:600,background:activeTab===k?'var(--header-bg)':'var(--surface2)',color:activeTab===k?'var(--header-text)':'var(--text3)',border:'1px solid var(--border)',borderRight:i===arr.length-1?'1px solid var(--border)':'none'}}>{l}</button>))}</div>
            {activeTab === 'calendar' && (<>
              <div style={{width:1,height:18,background:'var(--border)',margin:'0 2px'}}></div>

                <button onClick={() => goMonth(1)} style={{padding:'4px 10px',fontSize:12,fontWeight:600,background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border3)'}}>▶</button>
              </div>
              <span style={{fontSize:15,fontWeight:600,color:'var(--text)'}}>
                <span className="num" style={{fontWeight:600}}>{currentYear}</span>年 <span className="num" style={{background:'var(--accent)',color:'#fff',padding:'2px 10px'}}>{String(currentMonth).padStart(2,'0')}</span>月度
              </span>
              {dates.length > 0 && <span className="num" style={{color:'var(--text3)',fontSize:11}}>{dates[0].getMonth()+1}/{dates[0].getDate()} 〜 {dates[dates.length-1].getMonth()+1}/{dates[dates.length-1].getDate()}</span>}
            </>)}
          </div>
          <div className="flex items-center" style={{gap:6,flexWrap:'wrap'}}>
            {activeTab === 'calendar' && (<>
              {clipboard && (<div style={{padding:'3px 8px',fontSize:10,background:'var(--ok-bg)',color:'var(--ok-text)',border:'1px solid var(--border)'}}>📋 {clipboard.type === 'normal' ? `${clipboard.start}-${clipboard.end}` : SHIFT_TYPES[clipboard.type]?.short}<button onClick={() => setClipboard(null)} style={{marginLeft:4,background:'none',border:'none',color:'inherit',cursor:'pointer'}}>×</button></div>)}
              {rangeClip && (<div style={{padding:'3px 8px',fontSize:10,background:'var(--ok-bg)',color:'var(--ok-text)',border:'1px solid var(--border)'}}>📋 {rangeClip.data.length}セル<button onClick={() => setRangeClip(null)} style={{marginLeft:4,background:'none',border:'none',color:'inherit',cursor:'pointer'}}>×</button></div>)}
              {selectedCells.length > 0 && (<div style={{padding:'3px 8px',fontSize:10,background:'var(--warn-bg)',color:'var(--warn-text)',border:'1px solid var(--border)'}}>選択中: {selectedCells.length}セル<button onClick={() => setSelectedCells([])} style={{marginLeft:4,background:'none',border:'none',color:'inherit',cursor:'pointer'}}>×</button></div>)}
              <span style={{fontSize:11,color:'var(--text3)',fontWeight:600,display:'inline-flex',alignItems:'center',gap:4}}>目標公休<input type="number" value={monthlyTarget} onChange={e=>setMonthlyDaysOff(p=>({...p,[`${currentYear}-${currentMonth}`]:parseInt(e.target.value)||0}))} className="num" style={{background:'var(--surface)',color:'var(--text)',border:'1px solid var(--border3)',width:36,textAlign:'center',padding:'2px',fontSize:11}} min="0" max="31"/>日</span>
              <div style={{width:1,height:18,background:'var(--border)',margin:'0 2px'}}></div>
            </>)}
            {activeTab === 'calendar' && (<>
              <button onClick={() => setShowSalary(s => !s)} title={showSalary ? '給与列を隠す' : '給与列を表示'} style={{padding:'4px 10px',fontSize:13,background:showSalary?'var(--ok-bg)':'var(--surface2)',color:showSalary?'var(--ok-text)':'var(--text2)',border:'1px solid var(--border3)',fontWeight:600}}>¥</button>
              <button onClick={() => handleExport('print')} style={{padding:'4px 10px',fontSize:11,fontWeight:600,background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border3)',borderRight:'none'}}>🖨 印刷</button>
              <button onClick={() => handleExport('pdf')} style={{padding:'4px 10px',fontSize:11,fontWeight:600,background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border3)',borderRight:'none'}}>PDF</button>
              <button onClick={() => handleExport('jpeg')} style={{padding:'4px 10px',fontSize:11,fontWeight:600,background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border3)'}}>JPEG</button>

      <div style={{padding:'8px 10px'}}>

            <label className="block text-xs font-semibold text-gray-600 mb-1">時間を手動設定</label>
            <div className="flex gap-3"><select value={shiftForm.start} onChange={e => setShiftForm(p => ({ ...p, start: e.target.value }))} className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select><div className="flex items-center text-gray-400 font-bold">〜</div><select value={shiftForm.end} onChange={e => setShiftForm(p => ({ ...p, end: e.target.value }))} className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select></div>

            {showPresetEdit && (<div className="mt-2 p-3 bg-gray-50 rounded-lg"><div className="space-y-1.5 mb-3">{presets.map((p, i) => (<div key={i} className="flex items-center gap-2 text-xs"><span className="flex-1 font-medium text-gray-700">{p.label} ({p.start}-{p.end})</span><button onClick={() => setPresets(pr => pr.filter((_, j) => j !== i))} className="text-red-400 hover:text-red-600">削除</button></div>))}</div><div className="flex gap-1.5 items-end"><input type="text" value={presetForm.label} onChange={e => setPresetForm(p => ({ ...p, label: e.target.value }))} className="flex-1 px-2 py-1.5 border border-gray-300 rounded-lg text-xs" placeholder="名前" /><select value={presetForm.start} onChange={e => setPresetForm(p => ({ ...p, start: e.target.value }))} className="px-2 py-1.5 border border-gray-300 rounded-lg text-xs">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select><span className="text-xs text-gray-400">〜</span><select value={presetForm.end} onChange={e => setPresetForm(p => ({ ...p, end: e.target.value }))} className="px-2 py-1.5 border border-gray-300 rounded-lg text-xs">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select><button onClick={() => { if (presetForm.label.trim()) { setPresets(p => [...p, { ...presetForm }]); setPresetForm({ label: '', start: '11:00', end: '20:00' }); } }} className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium hover:bg-blue-700">追加</button></div></div>)}
          </div>)}
          {isPartner && shiftForm.type === 'yuukyu' && (<div className="mb-4 p-3" style={{background:'var(--surface2)',border:'1px solid var(--border)'}}><label className="block text-xs font-semibold text-gray-600 mb-2">有休の時間（給与計算用）</label><div className="flex gap-3"><select value={shiftForm.start || '10:00'} onChange={e => setShiftForm(p => ({ ...p, start: e.target.value }))} className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select><div className="flex items-center text-gray-400 font-bold">〜</div><select value={shiftForm.end || '19:00'} onChange={e => setShiftForm(p => ({ ...p, end: e.target.value }))} className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select></div><p className="text-xs text-gray-400 mt-2">入力した時間分が給与計算に含まれます（休憩控除あり）</p></div>)}
          <div className="flex gap-2 mt-5"><button onClick={saveShift} className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm shadow-sm">保存</button><button onClick={deleteShift} className="px-4 py-2.5 bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100 font-medium text-sm">削除</button><button onClick={() => setShiftModal(null)} className="px-4 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium text-sm">キャンセル</button></div>
        </div>); })()}
      </Modal>

      <Modal open={!!staffModal} onClose={() => setStaffModal(null)} title={staffModal === 'new' ? 'スタッフ追加' : 'スタッフ編集'} width="max-w-lg">
        <div className="space-y-4">
          <div><label className="block text-xs font-semibold text-gray-600 mb-1">名前</label><input type="text" value={staffForm.name} onChange={e => setStaffForm(p => ({ ...p, name: e.target.value }))} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="田中 太郎" /></div>
          <div><label className="block text-xs font-semibold text-gray-600 mb-1">メモ</label><textarea value={staffForm.memo} onChange={e => setStaffForm(p => ({ ...p, memo: e.target.value }))} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none" rows={2} placeholder="勤務条件など" /></div>
          <div><label className="block text-xs font-semibold text-gray-600 mb-2">雇用形態</label>
            <div className="flex gap-2">
              <button onClick={() => setStaffForm(p => ({ ...p, employment: 'staff' }))} className="flex-1 px-3 py-2 text-sm font-semibold border-2" style={{borderColor:staffForm.employment==='staff'?'#3b82f6':'var(--border)',background:staffForm.employment==='staff'?'rgba(59,130,246,0.1)':'var(--surface2)',color:staffForm.employment==='staff'?'#3b82f6':'var(--text2)'}}>社員</button>
              <button onClick={() => setStaffForm(p => ({ ...p, employment: 'partner' }))} className="flex-1 px-3 py-2 text-sm font-semibold border-2" style={{borderColor:staffForm.employment==='partner'?'#16a34a':'var(--border)',background:staffForm.employment==='partner'?'rgba(22,163,74,0.1)':'var(--surface2)',color:staffForm.employment==='partner'?'#16a34a':'var(--text2)'}}>パートナー</button>
            </div>
            {staffForm.employment === 'partner' && (<div className="mt-3 flex items-center gap-2"><label className="text-xs font-semibold text-gray-600 whitespace-nowrap">時給</label><input type="text" inputMode="numeric" pattern="[0-9]*" value={staffForm.hourlyWage} onChange={e => { const v = e.target.value.replace(/[^0-9]/g, ''); setStaffForm(p => ({ ...p, hourlyWage: v === '' ? 0 : parseInt(v) })); }} onBlur={e => { const v = parseInt(e.target.value)||0; const rounded = Math.round(v / 10) * 10; if (v !== rounded) setStaffForm(p => ({ ...p, hourlyWage: rounded })); }} className="num w-24 px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-right"/><span className="text-xs text-gray-500">円</span><span className="text-xs text-gray-400 ml-2">（10円単位 / 日曜・祝日は+50円）</span></div>)}
          </div>
          <div><label className="block text-xs font-semibold text-gray-600 mb-2">在籍期間</label>
            <div className="flex items-center gap-2 flex-wrap">
              <div className="flex items-center gap-1"><input type="number" value={staffForm.startYear||''} onChange={e=>setStaffForm(p=>({...p,startYear:e.target.value?parseInt(e.target.value):null}))} className="w-20 px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-center" placeholder="年" min="2020" max="2099"/><span className="text-xs text-gray-500">年</span><input type="number" value={staffForm.startMonth||''} onChange={e=>setStaffForm(p=>({...p,startMonth:e.target.value?parseInt(e.target.value):null}))} className="w-16 px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-center" placeholder="月" min="1" max="12"/><span className="text-xs text-gray-500">月度〜</span></div>
              <div className="flex items-center gap-1"><input type="number" value={staffForm.endYear||''} onChange={e=>setStaffForm(p=>({...p,endYear:e.target.value?parseInt(e.target.value):null}))} className="w-20 px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-center" placeholder="年" min="2020" max="2099"/><span className="text-xs text-gray-500">年</span><input type="number" value={staffForm.endMonth||''} onChange={e=>setStaffForm(p=>({...p,endMonth:e.target.value?parseInt(e.target.value):null}))} className="w-16 px-2 py-1.5 border border-gray-300 rounded-lg text-sm text-center" placeholder="月" min="1" max="12"/><span className="text-xs text-gray-500">月度</span></div>
            </div>
            <p className="text-xs text-gray-400 mt-1">空欄＝制限なし。退社時は終了月度を設定すると翌月度から非表示になります。</p>
          </div>

          {staffModal !== 'new' && staffModal && (() => { const sp = patterns.filter(p => p.staffId === staffModal.id); return (
            <div className="pt-3 border-t border-gray-200">
              <div className="flex items-center justify-between mb-2">
                <label className="text-xs font-semibold text-purple-700">📋 シフトパターン {sp.length > 0 && <span className="text-gray-400 font-normal">({sp.length})</span>}</label>
                <button onClick={() => openNewPatternForStaff(staffModal.id)} className="px-2 py-1 text-xs bg-purple-100 hover:bg-purple-200 text-purple-700 rounded font-medium">+ パターン追加</button>
              </div>
              {sp.length === 0 ? (
                <div className="text-xs text-gray-400 py-3 text-center border border-gray-100 rounded-lg">パターン未登録</div>
              ) : (
                <div className="space-y-2">{sp.map(p => (<div key={p.id} className="p-2 bg-purple-50 border border-purple-200 rounded-lg">
                  <div className="flex items-center justify-between mb-1.5"><span className="text-xs font-bold text-purple-800">{p.name}</span><div className="flex gap-1"><button onClick={() => { setStaffModal(null); setTimeout(() => openApplyModal(staffModal.id), 100); }} className="px-2 py-0.5 text-xs bg-purple-600 hover:bg-purple-700 text-white rounded font-medium">適用</button><button onClick={() => { setStaffModal(null); setTimeout(() => openPatternModal(p), 100); }} className="px-2 py-0.5 text-xs bg-white hover:bg-gray-100 border border-gray-300 rounded font-medium">編集</button><button onClick={() => { if(confirm(`「${p.name}」を削除しますか？`)) setPatterns(pr => pr.filter(x => x.id !== p.id)); }} className="px-2 py-0.5 text-xs bg-white hover:bg-red-50 border border-red-200 text-red-600 rounded font-medium">削除</button></div></div>
                  <div className="grid grid-cols-7 gap-1">{DAY_KEYS.map((dk, i) => { const v = p.week[dk]; return (<div key={dk} className="text-center p-1 rounded" style={{ backgroundColor: v ? (SHIFT_TYPES[v.type]?.bg || '#dbeafe') : '#f9fafb' }}><div className="text-xs font-semibold mb-0.5" style={{ color: i === 0 ? '#dc2626' : i === 6 ? '#2563eb' : '#6b7280' }}>{DAY_LABELS[i]}</div>{v ? (v.type === 'normal' ? <div style={{ fontSize: '9px', color: '#1e40af', fontWeight: 600 }}>{v.start}<br/>{v.end}</div> : <div style={{ fontSize: '9px', color: SHIFT_TYPES[v.type]?.textColor, fontWeight: 700 }}>{SHIFT_TYPES[v.type]?.short}</div>) : <div style={{ fontSize: '9px', color: '#9ca3af' }}>─</div>}</div>); })}</div>
                </div>))}</div>
              )}
            </div>
          ); })()}
          {staffModal === 'new' && (<div className="pt-3 border-t border-gray-200 text-xs text-gray-400 text-center py-2">📋 シフトパターンは保存後に追加できます</div>)}

          <div className="flex gap-2 pt-2"><button onClick={saveStaff} className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm" disabled={!staffForm.name.trim()}>保存</button><button onClick={() => setStaffModal(null)} className="px-4 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium text-sm">キャンセル</button></div>
        </div>
      </Modal>

      <Modal open={!!eventModal} onClose={() => setEventModal(null)} title="イベント入力">
        {eventModal && (() => { const ev = events[eventModal] || ['', '', '']; return (<div><div className="mb-4 text-sm text-gray-600 font-medium">{eventModal}</div><div className="space-y-3"><div><label className="block text-xs font-semibold text-gray-600 mb-1">イベント①</label><input type="text" value={ev[0] || ''} onChange={e => saveEvent(eventModal, 0, e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="棚卸し、セール初日など" autoFocus /></div><div><label className="block text-xs font-semibold text-gray-600 mb-1">イベント②</label><input type="text" value={ev[1] || ''} onChange={e => saveEvent(eventModal, 1, e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="本部巡回、研修など" /></div><div><label className="block text-xs font-semibold text-gray-600 mb-1">イベント③</label><input type="text" value={ev[2] || ''} onChange={e => saveEvent(eventModal, 2, e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="その他" /></div></div><div className="flex gap-2 mt-5"><button onClick={() => setEventModal(null)} className="flex-1 px-4 py-2.5 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 font-medium text-sm">OK</button><button onClick={() => { setEvents(p => { const n = { ...p }; delete n[eventModal]; return n; }); setEventModal(null); }} className="px-4 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium text-sm">クリア</button></div></div>); })()}
      </Modal>

      <Modal open={!!patternModal} onClose={() => setPatternModal(null)} title={patternModal === 'new' ? 'パターン追加' : 'パターン編集'} width="max-w-lg">
        <div className="space-y-4">
          <div><label className="block text-xs font-semibold text-gray-600 mb-1">対象スタッフ</label><select value={patternForm.staffId} onChange={e => setPatternForm(p => ({ ...p, staffId: e.target.value }))} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" disabled={patternModal !== 'new'}>{sortedStaff.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
          <div><label className="block text-xs font-semibold text-gray-600 mb-1">パターン名</label><input type="text" value={patternForm.name} onChange={e => setPatternForm(p => ({ ...p, name: e.target.value }))} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" placeholder="通常週、繁忙期など" /></div>
          <div><label className="block text-xs font-semibold text-gray-600 mb-3">曜日ごとのシフト</label><div className="space-y-2">{DAY_KEYS.map((dk, i) => { const v = patternForm.week[dk]; return (<div key={dk} className="flex items-center gap-2 p-2 rounded-lg" style={{ backgroundColor: v ? '#f8fafc' : '#fff', border: '1px solid #e5e7eb' }}><div className="text-center text-xs font-bold" style={{ color: i === 0 ? '#dc2626' : i === 6 ? '#2563eb' : '#374151', width: 32 }}>{DAY_LABELS[i]}</div><select value={v ? v.type : '_off'} onChange={e => { const val = e.target.value; if (val === '_off') setPatDay(dk, null); else if (val === 'normal') setPatDay(dk, { type: 'normal', start: '11:00', end: '20:00' }); else setPatDay(dk, { type: val }); }} className="px-2 py-1.5 border border-gray-300 rounded-lg text-xs"><option value="_off">─ 未設定</option>{Object.entries(SHIFT_TYPES).map(([k, v2]) => <option key={k} value={k}>{v2.label}</option>)}</select>{v && v.type === 'normal' && <div className="flex items-center gap-1 ml-2"><select value={v.start} onChange={e => setPatDay(dk, { ...v, start: e.target.value })} className="px-2 py-1 border border-gray-300 rounded text-xs">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select><span className="text-xs text-gray-400">〜</span><select value={v.end} onChange={e => setPatDay(dk, { ...v, end: e.target.value })} className="px-2 py-1 border border-gray-300 rounded text-xs">{TIME_OPTIONS.map(t => <option key={t}>{t}</option>)}</select></div>}</div>); })}</div></div>
          <div className="flex gap-2 pt-2"><button onClick={savePattern} className="flex-1 px-4 py-2.5 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium text-sm" disabled={!patternForm.name.trim()}>保存</button><button onClick={() => setPatternModal(null)} className="px-4 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium text-sm">キャンセル</button></div>
        </div>
      </Modal>

      <Modal open={!!applyModal} onClose={() => setApplyModal(null)} title="パターン適用">
        {applyModal && (() => { const sp = patterns.filter(p => p.staffId === applyModal.staffId); const sn = sortedStaff.find(s => s.id === applyModal.staffId)?.name; return (<div>
          <div className="mb-4 p-3 bg-purple-50 rounded-lg text-sm font-semibold text-purple-800">{sn} にパターンを適用</div>
          <div className="mb-4"><label className="block text-xs font-semibold text-gray-600 mb-1">パターン選択</label><select value={applyForm.patternId} onChange={e => setApplyForm(p => ({ ...p, patternId: e.target.value }))} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">{sp.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
          <div className="mb-4"><label className="block text-xs font-semibold text-gray-600 mb-2">適用範囲</label><div className="flex flex-wrap gap-2"><button onClick={() => setApplyForm(p => ({ ...p, mode: 'month' }))} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 ${applyForm.mode === 'month' ? 'border-purple-500 bg-purple-50 text-purple-700' : 'border-gray-200 text-gray-600'}`}>月全体</button>{[1, 2, 3, 4, 5].map(w => { const wDates = dates.slice((w - 1) * 7, w * 7); if (!wDates.length) return null; return (<button key={w} onClick={() => setApplyForm(p => ({ ...p, mode: `week${w}` }))} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 ${applyForm.mode === `week${w}` ? 'border-purple-500 bg-purple-50 text-purple-700' : 'border-gray-200 text-gray-600'}`}>第{w}週<span className="font-normal ml-1 opacity-70">({wDates[0].getMonth() + 1}/{wDates[0].getDate()}〜)</span></button>); })}</div></div>
          <div className="flex gap-2 mt-5"><button onClick={applyPattern} className="flex-1 px-4 py-2.5 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium text-sm shadow-sm">適用する</button><button onClick={() => setApplyModal(null)} className="px-4 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 font-medium text-sm">キャンセル</button></div>
        </div>); })()}
      </Modal>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ShiftManager />);
</script>
</body>
</html>
